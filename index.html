<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KBW Expenses">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>KBW Expense Tracker</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-size:14px;line-height:1.5;transition:background .25s,color .25s;font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif}
input,select,textarea{border-radius:8px;padding:8px 10px;font-size:14px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s;font-family:inherit}
input[type="date"]{padding:4px 6px;font-size:13px;-webkit-appearance:none;appearance:none;height:34px;line-height:1.2}
input[type=color]{padding:3px 5px;height:36px;cursor:pointer}
textarea{resize:vertical}
button{cursor:pointer;font-size:14px;border-radius:8px;border:none;transition:all .15s;font-weight:500;font-family:inherit}
.shell{display:flex;flex-direction:column;min-height:100vh}
@keyframes kbwspin{to{transform:rotate(360deg)}}
.hdr{border-bottom:1px solid;padding:0 22px;position:sticky;top:0;z-index:100}
.hdr-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:10px;height:60px;flex-wrap:wrap}
.logo-area{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px 8px;border-radius:8px;flex-shrink:0}
.logo-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.logo-title{font-size:15px;font-weight:700}
.logo-sub{font-size:10px;font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif;margin-top:1px;opacity:.4}
.nav{display:flex;gap:2px;margin-left:auto}
.nb{background:transparent;border:1px solid transparent;padding:6px 13px;border-radius:8px;font-size:13px;opacity:.6}
.nb:hover{opacity:1}
.nb.on{opacity:1;border-color:rgba(128,128,128,.3)}
.psel,.fsel{padding:6px 9px;font-size:12px;border-radius:7px;border:1px solid;background:transparent;font-family:inherit;cursor:pointer;width:auto}
.psel{max-width:72px}
.addbtn{padding:8px 17px;border-radius:9px;font-weight:600;font-size:13px}
.addbtn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.tbtn{padding:7px 11px;border-radius:8px;font-size:12px;border:1px solid;background:transparent;opacity:.7}
.tbtn:hover{opacity:1}
.fbar{border-bottom:1px solid;padding:8px 22px;position:sticky;top:57px;z-index:90}
.fbar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto}
.flbl{font-size:10px;font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif;letter-spacing:.3px;text-transform:uppercase;opacity:.4}
.main{flex:1;padding:22px;max-width:1200px;margin:0 auto;width:100%}
/* stat cards */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.sc{border-radius:14px;padding:17px 19px;position:relative;overflow:hidden;cursor:pointer;transition:filter .15s;border:1px solid}
.sc:hover{filter:brightness(1.06)}
.sc-bar{position:absolute;top:0;left:0;right:0;height:2px}
.sc-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.3px;margin-bottom:7px;font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif;opacity:.5}
.sc-val{font-size:22px;font-weight:700;letter-spacing:-.3px}
.sc-sub{font-size:11px;margin-top:4px;opacity:.4}
.sc-hint{position:absolute;top:8px;right:10px;font-size:10px;opacity:0;transition:opacity .15s;pointer-events:none}
.sc:hover .sc-hint{opacity:.5}
/* layout */
.card{border-radius:14px;padding:19px;border:1px solid}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sec-ttl{font-size:15px;font-weight:700;margin-bottom:14px}
/* cat bars */
.cbar{margin-bottom:11px}
.cbar-h{display:flex;justify-content:space-between;margin-bottom:4px}
.cbar-name{font-size:13px;display:flex;align-items:center;gap:6px}
.cbar-amt{font-size:13px;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif}
.prog{height:4px;border-radius:3px;overflow:hidden;opacity:.25}
.prog-fill{height:100%;border-radius:3px;transition:width .4s}
/* expense table */
.etbl{border-radius:14px;overflow:hidden;border:1px solid}
.etbl-hd{padding:11px 17px;border-bottom:1px solid;display:grid;grid-template-columns:48px 100px 1fr 210px 90px 90px 90px 115px;gap:10px;align-items:center}
.th{font-size:11px;font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.3px;opacity:.4}
.erow{padding:11px 17px;border-bottom:1px solid;display:grid;grid-template-columns:48px 100px 1fr 210px 90px 90px 90px 115px;gap:10px;align-items:center;cursor:pointer;transition:background .1s}
.erow:last-child{border-bottom:none}
.erow{content-visibility:auto;contain-intrinsic-size:auto 66px}
.r-thumb{width:40px;height:40px;border-radius:7px;object-fit:cover;border:1px solid;cursor:zoom-in;display:block}
.r-thumb:hover{filter:brightness(1.15)}
.r-wrap{position:relative;width:40px;height:40px;flex-shrink:0}
.r-tick{position:absolute;right:-5px;bottom:-5px;width:17px;height:17px;border-radius:50%;background:#22a45d;color:#fff;font-size:11px;font-weight:700;line-height:17px;text-align:center;border:2px solid var(--bg,#111);box-sizing:content-box;text-decoration:none;cursor:pointer}
.r-icon{width:40px;height:40px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid}
.vname{font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vnote{font-size:13px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-top:1px;opacity:.4}
.mob-only{display:none}
.mob-amounts{display:none;gap:12px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.lnbadge{display:inline-block;padding:1px 6px;border-radius:5px;font-size:10px;font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif;opacity:.5;margin-left:4px}
.ra{text-align:right}
.mono{font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif}
.rac{display:flex;gap:5px;justify-content:flex-end}
.bsm{padding:4px 9px;border-radius:7px;font-size:12px;border:1px solid;background:transparent}
.bsm:hover{filter:brightness(1.3)}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;backdrop-filter:blur(6px)}
.modal{border-radius:18px;padding:26px;width:100%;max-width:560px;max-height:93vh;overflow-y:auto;border:1px solid}
.modal-sm{max-width:440px}
.modal-lg{max-width:720px}
.mhdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.mttl{font-size:18px;font-weight:700}
.mclose{border:1px solid;width:30px;height:30px;border-radius:7px;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;background:transparent;cursor:pointer}
.fg{margin-bottom:14px}
.fl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px;display:block;font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif;opacity:.6}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* receipt drop zone */
.dz{border:2px dashed;border-radius:11px;padding:26px 16px;text-align:center;cursor:pointer;position:relative}
.dz input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dz:hover{opacity:.75}
/* scan */
.scan-box{border-radius:11px;padding:18px;text-align:center;margin-bottom:14px;border:1px solid}
.spin{width:26px;height:26px;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px;border-width:2.5px;border-style:solid}
@keyframes kbwspin{to{transform:rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
/* breakdown */
.bkbox{border-radius:10px;padding:13px;margin-bottom:14px;border:1px solid}
.bkrow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px}
.bkrow+.bkrow{border-top:1px solid}
.bklbl{opacity:.6}
.bkval{font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif;font-weight:500}
.bkdiv{border-top-width:2px!important;margin-top:4px;padding-top:8px!important}
.bkdiv .bklbl{opacity:1;font-weight:600}
.bkdiv .bkval{font-size:14px;font-weight:700}
/* gas helper */
.gas-helper{border-radius:10px;padding:11px 14px;margin-bottom:14px;border:1px solid;font-size:12px;line-height:1.7}
/* cra note */
.cranote{border-left:3px solid;border-radius:0 8px 8px 0;padding:8px 12px;font-size:12px;margin-bottom:14px;line-height:1.6;opacity:.7}
/* pst toggle */
.pst-row{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:8px;cursor:pointer;opacity:.7}
.pst-row input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:#4b8ef5}
/* receipt in modal */
.rp{position:relative;margin-bottom:14px}
.rp img{width:100%;border-radius:10px;border:1px solid;max-height:200px;object-fit:cover;cursor:zoom-in;display:block}
.rp img:hover{filter:brightness(1.08)}
.rp-rm{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.78);border:none;color:#fff;border-radius:6px;padding:3px 9px;font-size:11px;cursor:pointer}
/* fullscreen receipt */
.rfs{position:fixed;inset:0;background:#000;z-index:3000;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:zoom-out}
.rfs-img{max-width:96vw;max-height:88vh;object-fit:contain;border-radius:8px}
.rfs-bar{position:absolute;top:0;left:0;right:0;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(rgba(0,0,0,.7),transparent);pointer-events:none}
.rfs-bar button{pointer-events:all}
.rfs-close{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:18px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* category cards */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ccard{border-radius:14px;padding:16px 18px;border-left:3px solid;border:1px solid;position:relative}
.ccard-top{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.ccard-icon{font-size:20px}
.ccard-name{font-weight:600;font-size:13px}
.ccard-line{font-size:10px;font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif;opacity:.4;margin-top:1px}
.ccard-count{font-size:11px;opacity:.4}
.ccard-tot{margin-left:auto;font-size:16px;font-weight:700;font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif}
.ccard-ebtn{border:1px solid;padding:3px 9px;border-radius:6px;font-size:11px;background:transparent;opacity:.5;cursor:pointer;flex-shrink:0}
.ccard-ebtn:hover{opacity:1}
.cminis{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
.cmini{border-radius:7px;padding:7px 9px;border:1px solid}
.cminilbl{font-size:10px;font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif;margin-bottom:2px;opacity:.4}
.cminival{font-size:12px;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif}
.ccranote{border-radius:6px;padding:7px 10px;font-size:11px;line-height:1.5;opacity:.45}
.wpill{margin-top:6px;border-radius:6px;padding:4px 9px;font-size:11px;border:1px solid}
/* summary table */
.stbl{width:100%;border-collapse:collapse}
.stbl th{padding:9px 14px;text-align:right;font-size:10px;font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid;font-weight:500;opacity:.5}
.stbl th:first-child,.stbl td:first-child{text-align:left}
.stbl td{padding:10px 14px;text-align:right;border-bottom:1px solid;font-size:13px}
.stbl tbody tr:hover{filter:brightness(1.05)}
.stbl tfoot td{border-top:2px solid;font-weight:700}
/* export */
.xbar{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.xbtn{padding:8px 15px;border-radius:8px;font-size:13px;border:1px solid;background:transparent;display:flex;align-items:center;gap:6px}
.xbtn:hover{filter:brightness(1.2)}
/* detail */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}
.di{border-radius:8px;padding:9px 11px;border:1px solid}
.dilbl{font-size:10px;font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif;margin-bottom:2px;opacity:.4}
.dival{font-size:13px;font-weight:600}
/* theme */
.font-opt{border:1px solid;border-radius:9px;padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px}
.font-opt:hover{filter:brightness(1.12)}
.font-opt.sel{border-width:2px}
.color-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* info banner */
.ibanner{border-radius:11px;padding:13px 17px;font-size:13px;line-height:1.7;margin-top:16px;border:1px solid;opacity:.75}
/* empty */
.empty{padding:56px 20px;text-align:center;opacity:.4}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{border-radius:3px;background:rgba(128,128,128,.2)}
@media(max-width:900px){.sgrid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.hcol{display:none}.cgrid{grid-template-columns:1fr}}

/* ── MOBILE (<=640px) ── */
@media(max-width:480px){
  .hdr{padding:0 10px}
  .hdr-in{height:auto!important;padding:8px 0;gap:6px;flex-wrap:nowrap;align-items:center;overflow-x:auto}
  .logo-area{flex-shrink:0;gap:5px}
  .logo-icon{width:26px;height:26px;font-size:13px;border-radius:6px}
  .logo-title{font-size:11px;white-space:nowrap}
  .logo-sub{display:none}
  .psel{font-size:10px;padding:4px 5px;max-width:95px;flex-shrink:0}
  .tbtn{font-size:10px;padding:4px 7px;flex-shrink:0;white-space:nowrap}
  .hdr-in{flex-wrap:wrap}
  .nav{order:3;width:100%;overflow-x:auto;gap:2px;padding-bottom:3px;display:flex;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nb{font-size:11px;padding:6px 12px;white-space:nowrap;flex-shrink:0;border-radius:8px}
  .fbar-in{flex-wrap:wrap;gap:5px;padding:8px 10px}
  .fsel{font-size:11px;padding:5px 6px;flex-shrink:0;min-width:0}
  .addbtn{font-size:13px;padding:10px 16px;width:100%;order:99;margin-top:4px;border-radius:10px}
  .main{padding:10px}
  .sgrid{grid-template-columns:1fr 1fr!important;gap:8px}
  .sc{padding:10px 8px}.sc-val{font-size:17px}.sc-lbl{font-size:9px}.sc-sub{font-size:10px}
  .two{grid-template-columns:1fr!important}
  .card{padding:12px}
  .etbl-hd{display:none!important}
  .erow{display:block!important;padding:12px!important}
  .erow .hcol{display:none!important}
  .vname{font-size:14px}.vnote{font-size:12px}
  .cgrid{grid-template-columns:1fr!important}
  .ov{padding:0;align-items:flex-end}
  .modal,.modal-sm,.modal-lg{width:100vw!important;max-width:100vw!important;max-height:92dvh!important;border-radius:20px 20px 0 0!important;margin:0;overflow-y:auto;padding:18px 14px}
  .mttl{font-size:16px}
  .frow{grid-template-columns:1fr 1fr}.frow3{grid-template-columns:1fr 1fr}
  .sum-tbl{font-size:11px}.sum-tbl td,.sum-tbl th{padding:5px 6px}
  .med-tbl-hdr{display:none!important}
  .med-row{display:block!important;padding:12px!important;position:relative}
  .bsm{font-size:11px;padding:4px 10px}
  .mob-hide{display:none!important}
  .mob-only{display:block!important}
  .mob-amounts{display:flex!important}
  .med-desk{display:none!important}
  .hcol{display:none!important}
  .med-mob-amounts{display:flex!important}
  .med-row{grid-template-columns:48px 1fr 80px!important}
}

/* ═══ Apple-style refresh ═══ */
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.011em;font-variant-numeric:tabular-nums}
.hdr{background:rgba(28,28,30,.72)!important;-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-bottom:.5px solid rgba(255,255,255,.12)!important}
.fbar{background:rgba(0,0,0,.72)!important;-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-bottom:.5px solid rgba(255,255,255,.08)!important}
body[data-mode=light] .hdr{background:rgba(255,255,255,.72)!important;border-bottom-color:rgba(0,0,0,.1)!important}
body[data-mode=light] .fbar{background:rgba(242,242,247,.8)!important;border-bottom-color:rgba(0,0,0,.08)!important}
.logo-title{font-weight:600;letter-spacing:-.02em}
.logo-sub{opacity:.5}
.nav{background:rgba(118,118,128,.24);padding:2px;border-radius:11px;gap:0}
body[data-mode=light] .nav{background:rgba(118,118,128,.12)}
.nb{border:none!important;border-radius:9px;padding:6px 15px;font-size:13px;font-weight:500;opacity:.7}
.nb:hover{opacity:1}
.nb.on{opacity:1;background:rgba(99,99,102,.6)!important;box-shadow:0 1px 3px rgba(0,0,0,.3),0 0 0 .5px rgba(255,255,255,.06)}
body[data-mode=light] .nb.on{background:#fff!important;box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04)}
.psel,.fsel,.tbtn,.xbtn{border-radius:10px;border-color:transparent!important;background:rgba(118,118,128,.24)!important}
body[data-mode=light] .psel,body[data-mode=light] .fsel,body[data-mode=light] .tbtn,body[data-mode=light] .xbtn{background:rgba(118,118,128,.12)!important}
.tbtn{opacity:1;padding:7px 12px}
.addbtn{border-radius:980px;padding:9px 19px;font-weight:600;box-shadow:none}
.addbtn:hover{filter:brightness(1.1);transform:none}
button:active{transform:scale(.97)}
input,select,textarea{border-radius:10px;padding:10px 12px}
input[type="date"]{padding:4px 8px}
input:focus,select:focus,textarea:focus{border-color:#0a84ff!important;box-shadow:0 0 0 3px rgba(10,132,255,.28)}
.card,.sc,.etbl{border-radius:18px;border-color:transparent!important}
.card{padding:20px}
.sc{padding:18px 20px}
.sc-bar{height:0}
.sc-lbl,.flbl,.th{text-transform:none;letter-spacing:0;font-size:12px;font-weight:500;opacity:.55}
.fl{text-transform:none;letter-spacing:0;font-size:12px;font-weight:500;opacity:.6}
.sc-val{font-size:26px;font-weight:600;letter-spacing:-.03em}
.sec-ttl,.mttl{font-weight:600;letter-spacing:-.02em}
.etbl-hd{background:transparent!important}
.erow{padding:12px 18px;border-bottom:.5px solid rgba(255,255,255,.08)!important}
body[data-mode=light] .erow{border-bottom-color:rgba(0,0,0,.07)!important}
.r-thumb{border-radius:10px;border:none}
.r-icon{border-radius:10px;border-color:transparent!important}
.r-tick{background:#30d158;border-color:var(--bg2,#1c1c1e)}
.bsm{border-radius:9px;border-color:transparent!important;background:rgba(118,118,128,.24)!important}
body[data-mode=light] .bsm{background:rgba(118,118,128,.12)!important}

// ─── CORE CALC ────────────────────────────────────────────────────────────────
// CRA rule: "Do NOT include GST/HST in your expenses — claim ITC instead."
// Therefore: deductible = subtotal × df   (never subtotal + GST)
// Gas tip: NOT deductible (CRA does not allow tip on fuel as a business expense)
function calcBD(amount, province, catId, tax, cats) {
  const cat = cats.find(c=>c.id===catId) || cats[cats.length-1];
  const p   = PROVS.find(x=>x.code===province) || PROVS[0];
  const sub = parseFloat(amount) || 0;

  const autoGst = () => {
    if (cat.gf === 0) return 0;
    return p.hst ? sub * p.hstRate : sub * p.gst;
  };

  const tip    = parseFloat(tax?.tip)    || 0;
  const liquor = parseFloat(tax?.liquor) || 0;
  const other2 = parseFloat(tax?.other)  || 0;
  const gstPaid = (tax?.gst != null && tax.gst !== '') ? (parseFloat(tax.gst)||0) : autoGst();
  const pstPaid = (tax?.hasPst && tax?.pst != null) ? (parseFloat(tax.pst)||0) : 0;
  const total   = sub + tip + gstPaid + pstPaid + liquor + other2;

  // GST ITC claimable: 50% for meals/entertain, 0% for insurance/banking/payroll, 100% else
  const gstClaimable = Math.round(gstPaid * cat.gf * 100) / 100;

  // Deductible base: subtotal + PST + liquor tax (both non-recoverable, part of your expense cost)
  // GST excluded (claimed separately as ITC). Gas: tip excluded. Meals: tip + liquor included in 50% base.
  const taxBase = cat.id === 'gas' ? (sub + pstPaid) : (sub + tip + pstPaid + liquor + other2);
  const deductibleAmount = Math.round(taxBase * cat.df * 100) / 100;

  return { sub, tip, gstPaid:Math.round(gstPaid*100)/100, pstPaid, liquor:liquor+other2, total:Math.round(total*100)/100, gstClaimable, deductibleAmount };
}

const LS_KEY = 'cra_tracker_v1';
function lsLoad(key, fallback) {
  try { const v = localStorage.getItem(LS_KEY+'_'+key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function lsSave(key, val) {
  try {
    localStorage.setItem(LS_KEY+'_'+key, JSON.stringify(val));
  } catch(e) {
    // Storage full — receipts are likely the culprit
    if (e.name === 'QuotaExceededError') {
      alert('⚠️ Storage is full! Your receipts are taking up too much space.\n\nTip: Export your data to CSV/Excel as a backup, then consider removing old receipts from expenses to free up space.');
    }
  }
}

function lsUsageMB() {
  try {
    let total = 0;
    for (let k in localStorage) {
      if (k.startsWith(LS_KEY)) total += (localStorage[k]||'').length;
    }
    return (total * 2 / 1024 / 1024).toFixed(1); // UTF-16 = 2 bytes per char
  } catch { return '?'; }
}

  async function gSignIn() {

  async function gGetOrCreateFolder(name, parentId, token) {
    // Search for existing folder
    const q = `name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false${parentId?` and '${parentId}' in parents`:''}`;
    const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    const searchData = await searchRes.json();
    if (searchData.files && searchData.files.length > 0) return searchData.files[0].id;
    // Create folder
    const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, mimeType: 'application/vnd.google-apps.folder', parents: parentId ? [parentId] : [] })
    });
    const created = await createRes.json();
    return created.id;
  }

  async function compressForDrive(dataUrl) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1600;
        let w = img.width, h = img.height;
        if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
        if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  }

  async function gUploadReceipt(expense, token) {
    if (!expense.receipt) return null;
    const cat   = getCat(expense.category);
    const year  = expense.date.split('-')[0]; // dynamic — works for 2025, 2026, 2027...
    const isPdf = expense.receipt.startsWith('__PDF__:');
    const raw   = isPdf ? expense.receipt.slice(8) : expense.receipt;
    // Only create folders when there is actually a receipt to store
    setGStatus(`📁 Business Expenses / ${year} / ${cat.label}…`);
    const rootId = await gGetOrCreateFolder(DRIVE_ROOT, null, token);
    const bizId  = await gGetOrCreateFolder(DRIVE_BIZ, rootId, token);
    const yearId = await gGetOrCreateFolder(year, bizId, token);
    const catId  = await gGetOrCreateFolder(cat.label, yearId, token);
    // Compress image before upload (skip PDFs)
    setGStatus('🗜 Compressing…');
    const finalUrl = isPdf ? raw : await compressForDrive(raw);
    const b64   = finalUrl.split(',')[1];
    const bstr  = atob(b64);
    const bytes = new Uint8Array(bstr.length);
    for (let i=0;i<bstr.length;i++) bytes[i]=bstr.charCodeAt(i);
    const mime     = isPdf ? 'application/pdf' : 'image/jpeg';
    const ext      = isPdf ? 'pdf' : 'jpg';
    const safeName = expense.vendor.replace(/[^a-zA-Z0-9 ]/g,'').replace(/\s+/g,'_').slice(0,30);
    const fileName = `${expense.date}_${safeName}_$${expense.amount}.${ext}`;
    // Avoid duplicates — update if already exists
    const eq = `name='${fileName}' and '${catId}' in parents and trashed=false`;
    const er = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(eq)}&fields=files(id)`,{headers:{Authorization:`Bearer ${token}`}});
    const ed = await er.json();
    setGStatus('☁️ Uploading…');
    let fileId;
    if (ed.files?.length>0) {
      fileId = ed.files[0].id;
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,{method:'PATCH',headers:{Authorization:`Bearer ${token}`,'Content-Type':mime},body:bytes});
    } else {
      const bd='kbw_b'; const meta=JSON.stringify({name:fileName,parents:[catId]});
      const p1=new TextEncoder().encode(`--${bd}\r\nContent-Type: application/json\r\n\r\n${meta}\r\n--${bd}\r\nContent-Type: ${mime}\r\n\r\n`);
      const p2=new TextEncoder().encode(`\r\n--${bd}--`);
      const body=new Uint8Array(p1.length+bytes.length+p2.length);
      body.set(p1);body.set(bytes,p1.length);body.set(p2,p1.length+bytes.length);
      const uploadRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':`multipart/related; boundary=${bd}`},body});
      const uploadData = await uploadRes.json();
      fileId = uploadData.id;
    }
    // Make file publicly viewable so any device can load the receipt
    if (fileId) {
      await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, {
        method:'POST', headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
        body: JSON.stringify({role:'reader', type:'anyone'})
      });
      return `https://drive.google.com/uc?export=view&id=${fileId}`;
    }
    return fileName;
  }

  async function gSyncFromDrive(silent=false) {
    if (!gClientId) { if(!silent) alert('Please set up Google Drive in ⚙️ Settings first.'); return; }
    if (!window.google?.accounts?.oauth2) {
      if (!silent) { setGStatus('❌ Google not loaded — try refreshing'); setTimeout(()=>setGStatus(''),4000); }
      return;
    }
    if (!silent) { setGSyncing(true); setGStatus('🔗 Signing in…'); }
    try {
      let token;
      try { token = await gSignIn(); } catch(e) { throw new Error('Sign-in cancelled. Try again.'); }
      if (!token) throw new Error('No access token.');
      if (!silent) setGStatus('🔍 Loading expenses…');
      const rootId = await gGetOrCreateFolder(DRIVE_ROOT, null, token);

      // Search entire KBW Expenses folder tree for any expenses_*.json files
      const searchQ = `name contains 'expenses_' and '${rootId}' in parents or (name contains 'expenses_' and mimeType='application/json') and trashed=false`;
      // Simpler: just search all of Drive for expenses_ json files under root
      const allFilesQ = `name contains 'expenses_' and trashed=false`;
      const allFilesR = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(allFilesQ)}&fields=files(id,name,parents)&pageSize=50`,{headers:{Authorization:`Bearer ${token}`}});
      const allFilesD = await allFilesR.json();

      let allExpenses = [];
      for (const file of (allFilesD.files||[])) {
        if (!file.name.includes('expenses_')) continue;
        try {
          const dr = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`,{headers:{Authorization:`Bearer ${token}`}});
          const data = await dr.json();
          if (Array.isArray(data)) allExpenses = [...allExpenses, ...data];
        } catch(e) { console.log('skip file', file.name); }
      }
      if (!allExpenses.length) {
        if (!silent) { setGStatus('❌ No expenses found in Drive'); setTimeout(()=>setGStatus(''),4000); }
        if (!silent) setGSyncing(false); return;
      }
      const seen = new Set();
      const cleaned = allExpenses
        .map((e,i)=>({...e, id:e.id||Date.now()+i, receipt:(e.receipt&&typeof e.receipt==='string'&&e.receipt.startsWith('['))?null:e.receipt}))
        .filter(e=>{ if(seen.has(e.id)) return false; seen.add(e.id); return true; });
      setExpenses(cleaned);
      lsSave('expenses', cleaned);
      if (!silent) { setGStatus(`✅ Synced ${cleaned.length} expenses!`); setTimeout(()=>setGStatus(''),3000); }
    } catch(err) {
      console.error(err);
      if (!silent) { setGStatus('❌ '+(err.message||'Sync error')); setTimeout(()=>setGStatus(''),5000); }
    }
    if (!silent) setGSyncing(false);
  }

  async function pullFromGitHub(token) {

      const parsed = await res.json();

  function importCSV(file) {
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const text = ev.target.result;
        const lines = text.split('\n').filter(l=>l.trim());
        if (lines.length < 2) { alert('File appears empty.'); return; }
        function parseRow(line) {
          const fields=[]; let cur='', inQ=false;
          for (let i=0;i<line.length;i++) {
            const ch=line[i];
            if (ch==='"') { if(inQ&&line[i+1]==='"'){cur+='"';i++;} else inQ=!inQ; }
            else if (ch===','&&!inQ) { fields.push(cur.trim()); cur=''; }
            else cur+=ch;
          }
          fields.push(cur.trim());
          return fields;
        }
        const headers = parseRow(lines[0]).map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,''));
        const imported = [];
        let skipped = 0;
        const baseTime = Date.now();
        for (let i=1;i<lines.length;i++) {
          const row = parseRow(lines[i]);
          if (row.length < 3) continue;
          const get = (...keys) => {
            for (const k of keys) {
              const idx = headers.findIndex(h=>h.includes(k));
              if (idx>=0 && row[idx] !== undefined) return row[idx].replace(/^"|"$/g,'');
            }
            return '';
          };
          const date   = get('date');
          const vendor = get('vendor');
          const catName= get('category');
          if (!date || !vendor) { skipped++; continue; }
          const cat    = cats.find(c=>c.label.toLowerCase()===catName.toLowerCase()) || cats[cats.length-1];
          const amount = parseFloat(get('subtotal','pretax','amount'))||0;
          const tip    = parseFloat(get('tip'))||0;
          const gst    = parseFloat(get('gsthst','gst'))||0;
          const pst    = parseFloat(get('pst'))||0;
          const other  = parseFloat(get('othertax','other'))||0;
          const bizPctS= get('business');
          const bizPct = bizPctS ? parseInt(bizPctS)||100 : 100;
          const prov   = get('province')||province;
          const note   = get('purpose','note');
          const payType= get('paymenttype','payment')||'';
          const payName= get('cardname','name')||'';
          const payLast4=get('last4','card')||'';
          // Use base time + index * large offset to guarantee unique IDs
          imported.push({
            id: baseTime * 1000 + i,
            date, vendor, category: cat.id,
            amount, province: prov, bizPct,
            tax: { gst, pst, hasPst: pst>0, tip, liquor: other, other: 0, gasMode: false, gasTotal: 0 },
            payment: { type: payType, name: payName, last4: payLast4 },
            note, receipt: null
          });
        }
        if (imported.length===0) { alert('No valid rows found. Check the format matches the template.'); return; }
        const msg = `Import ${imported.length} expense${imported.length!==1?'s':''}${skipped>0?` (${skipped} rows skipped)`:''}\n\nReplace all existing expenses, or add to them?\n\nOK = Replace all\nCancel = Add to existing`;
        if (window.confirm(msg)) {
          setExpenses(imported);
        } else {
          setExpenses(prev => {
            const existingKeys = new Set(prev.map(e=>`${e.date}|${e.vendor}|${e.amount}`));
            const newOnes = imported.filter(e=>!existingKeys.has(`${e.date}|${e.vendor}|${e.amount}`));
            return [...prev, ...newOnes];
          });
        }
        alert(`✅ Imported ${imported.length} expense${imported.length!==1?'s':''}!`);
      } catch(err) {
        alert('Error reading file: ' + err.message);
      }
    };
    reader.readAsText(file);
  }

  function bulkApply(ids, fn, label) {

    const m = new Map(u.prev.map(e=>[e.id,e]));
    setExpenses(p=>p.map(e=>m.has(e.id)?m.get(e.id):e));
    bulkRef.current = null; setBulkUndo(null);
  }
  function undoDelete() {
    const u = undoRef.current; if (!u) return;
    clearTimeout(u.t); setExpenses(p=>[...p, ...u.items]);
    undoRef.current = null; setUndo(null);
  }
  useEffect(()=>{
    if (prevSync.current==='syncing' && syncSt.s==='ok') { setSyncFlash(true); const t=setTimeout(()=>setSyncFlash(false),1800); prevSync.current = syncSt.s; return ()=>clearTimeout(t); }
    prevSync.current = syncSt.s;
  },[syncSt.s]);
  useEffect(()=>{
    const h = e => {
      if (e.metaKey||e.ctrlKey||e.altKey) return;
      const t = e.target, tag = ((t&&t.tagName)||'').toLowerCase();
      if (tag==='input'||tag==='textarea'||tag==='select'||(t&&t.isContentEditable)) return;
      if (modal||fullImg) return;
      if (e.key==='n'||e.key==='N') { e.preventDefault(); setEditId(null); setModal('expense'); }
      else if (e.key==='/') { e.preventDefault(); setTab('expenses'); setTimeout(()=>{ const el=document.getElementById('qsearch'); if(el) el.focus(); },60); }
    };
    window.addEventListener('keydown', h);
    return ()=>window.removeEventListener('keydown', h);
  },[modal, fullImg]);
  const dExp = detailExp ? (expenses.find(x=>x.id===detailExp.id) || null) : null;
  const TITLES = {dashboard:'Dashboard',expenses:'Expenses',categories:'Categories',medical:'Medical',summary:'Summary',mileage:'Mileage',income:'Income'};
  const hasFilters = ['dashboard','expenses','categories','summary'].includes(tab);
  const filtersActive = filter.cat!=='all' || !!filter.dateFrom || !!filter.dateTo || filter.sort!=='date';
  const syncLabel = syncSt.s==='ok' ? 'Synced' : syncSt.s==='syncing' ? 'Syncing…' : syncSt.s==='error' ? 'Sync failed' : 'Sync';
  const openAdd = ()=>{ setEditId(null); setModal('expense'); };
  const borderC = {borderColor:T.border};
  const cardS   = {background:T.bg2,...borderC};

  return (
    <div className="shell" style={{background:T.bg,color:T.text}}>

      {/* Sidebar (desktop) / top bar (phone) */}
      <div className="hdr" style={{background:T.bg2,borderColor:T.border}}>
        <div className="hdr-in">
          <div className="logo-area" onClick={()=>setModal('logo')} title="Click to customise logo">
            {logo.logoImg
              ? <img src={logo.logoImg} style={{width:34,height:34,borderRadius:9,objectFit:'cover',flexShrink:0}} alt="logo"/>
              : <div className="logo-icon" style={{background:logo.iconBg}}>{logo.icon}</div>
            }
            <div>
              <div className="logo-title">{logo.title}</div>
              <div className="logo-sub">{logo.sub}</div>
            </div>
          </div>
          <div className="nav">
            {['dashboard','expenses','categories','medical','summary','mileage','income'].map(t=>(
              <button key={t} className={`nb${tab===t?' on':''}`} style={{color:T.text}} onClick={()=>setTab(t)}>
                <span className="nb-i"><Ic n={t} s={21}/></span><span>{t[0].toUpperCase()+t.slice(1)}</span>
              </button>
            ))}
          </div>
          <div className="hdr-tools">
            <button type="button" className="tbtn tmore" aria-label="More" onClick={()=>setMoreOpen(o=>!o)} style={{borderColor:T.border,color:T.text}}><Ic n="more" s={18}/></button>
            <select className="psel" style={{borderColor:T.border,color:T.text}} value={province} onChange={e=>setProvince(e.target.value)} aria-label="Province">
              {PROVS.map(p=><option key={p.code} value={p.code}>{p.code}</option>)}
            </select>
            <button type="button" className="tbtn tsync" onClick={syncNow} title={syncSt.s==='error'?syncSt.msg:syncSt.s==='syncing'?'Syncing…':syncSt.s==='ok'?'Synced. Tap to sync now.':'Tap to sync'} aria-label="Sync now"
               style={{borderColor:syncSt.s==='error'?T.red:T.border,color:syncSt.s==='error'?T.red:syncSt.s==='ok'?T.green:syncSt.s==='syncing'?T.amber:T.text}}>
              <span style={{display:'inline-block',animation:syncSt.s==='syncing'?'kbwspin 1s linear infinite':'none'}}>{syncSt.s==='error'?'⚠':'↻'}</span><span className="mob-hide tlbl"> {syncLabel}</span>
            </button>
            <a className="tbtn tdrive" href="https://drive.google.com/drive/folders/1Vs6c6Txnu5uKC8yS2BVigzya8yJ0h2w9" target="_blank" rel="noopener" title="Open receipts in Google Drive" aria-label="Open Google Drive folder" style={{borderColor:T.border,color:T.text,textDecoration:'none'}}>
              <svg width="17" height="17" viewBox="0 0 87.3 78" xmlns="http://www.w3.org/2000/svg"><path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/><path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0 -1.2 4.5h27.5z" fill="#00ac47"/><path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/><path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/><path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/><path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/></svg>
              <span className="mob-hide tlbl"> Receipts folder</span>
            </a>
            <button className="tbtn ttheme" style={{borderColor:T.border,color:T.text}} onClick={()=>setModal('theme')} aria-label="Theme"><Ic n="theme" s={16}/><span className="mob-hide tlbl"> Theme</span></button>
            <button className="tbtn" style={{borderColor:T.border,color:T.text}} onClick={()=>setModal('settings')} aria-label="Settings"><Ic n="settings" s={16}/><span className="mob-hide tlbl"> Settings</span></button>
            {gStatus&&<span className="gstat" style={{fontSize:11,color:gStatus.startsWith('❌')?T.red:gStatus.startsWith('✅')?T.green:T.blue,maxWidth:200,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{gStatus}</span>}
          </div>
        </div>
      </div>

      {moreOpen && <div className="morebg" onClick={()=>setMoreOpen(false)}><div className="morepop" style={{background:T.bg3||T.bg2,borderColor:T.border,color:T.text}} onClick={e=>e.stopPropagation()}>
        <label className="mrow"><span>Province</span><select value={province} onChange={e=>setProvince(e.target.value)} style={{color:T.text}}>{PROVS.map(p=><option key={p.code} value={p.code}>{p.code}</option>)}</select></label>
        <a className="mrow" href="https://drive.google.com/drive/folders/1Vs6c6Txnu5uKC8yS2BVigzya8yJ0h2w9" target="_blank" rel="noopener" style={{color:T.text}}><span>Receipts folder</span><span>↗</span></a>
        <button type="button" className="mrow" style={{color:T.text}} onClick={()=>{setMoreOpen(false);setModal('theme');}}><span>Theme</span><span>›</span></button>
      </div></div>}
      <div className="col">
      <input ref={camRef} type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(f){ setStartFile(f); setEditId(null); setModal('expense'); } }}/>

      {/* Page title + actions */}
      <div className="phead">
        <div style={{minWidth:0}}>
          <h1 className="ptitle">{TITLES[tab]}</h1>
          {hasFilters && <div className="psub">{filter.year==='all'?'All years':filter.year}{filter.cat!=='all'?' · '+getCat(filter.cat).label:''} · {filtered.length} expense{filtered.length!==1?'s':''}</div>}
        </div>
        {hasFilters && <div className="pact">
          <button type="button" className={'pbtn'+(showFilters?' on':'')} onClick={()=>setShowFilters(v=>!v)} aria-label="Filters" aria-expanded={showFilters}>
            <Ic n="settings" s={17}/><span className="mob-hide">Filter</span>{filtersActive&&<i className="pdot"/>}
          </button>
          <button type="button" className="pbtn" onClick={()=>camRef.current&&camRef.current.click()} aria-label="Scan a receipt" title="Scan a receipt"><Ic n="camera" s={17}/><span className="mob-hide">Scan</span></button>
          <button type="button" className="pbtn primary" onClick={openAdd} aria-label="Add expense"><Ic n="plus" s={17} w={2}/><span className="mob-hide">Add Expense</span></button>
        </div>}
      </div>

      {/* Filters (opens from the Filter button) */}
      {hasFilters && showFilters && (
      <div className="fbar" style={{background:T.bg2,borderColor:T.border}}>
        <div className="fbar-in">
          <select className="fsel" style={{borderColor:T.border,color:T.text}} value={filter.year} onChange={e=>setFilter(p=>({...p,year:e.target.value,dateFrom:'',dateTo:''}))}>
            <option value="all">All Years</option>
            {years.map(y=><option key={y} value={y}>{y}</option>)}
          </select>
          <select className="fsel" style={{borderColor:T.border,color:T.text,maxWidth:180}} value={filter.cat} onChange={e=>setFilter(p=>({...p,cat:e.target.value}))}>
            <option value="all">All Categories</option>
            {cats.map(c=><option key={c.id} value={c.id}>{c.label}</option>)}
          </select>
          <span className="flbl">From</span>
          <input type="date" style={{background:T.bg4,borderColor:T.border,color:T.text,borderRadius:7,padding:'5px 9px',fontSize:12,border:'1px solid',width:'auto',fontFamily:'inherit'}} value={filter.dateFrom} onChange={e=>setFilter(p=>({...p,dateFrom:e.target.value,year:'all'}))}/>
          <span className="flbl">To</span>
          <input type="date" style={{background:T.bg4,borderColor:T.border,color:T.text,borderRadius:7,padding:'5px 9px',fontSize:12,border:'1px solid',width:'auto',fontFamily:'inherit'}} value={filter.dateTo} onChange={e=>setFilter(p=>({...p,dateTo:e.target.value,year:'all'}))}/>
          {(filter.dateFrom||filter.dateTo)&&<button onClick={()=>setFilter(p=>({...p,dateFrom:'',dateTo:'',year:String(new Date().getFullYear())}))} style={{fontSize:11,background:'transparent',border:`1px solid ${T.border}`,color:T.text,padding:'4px 8px',borderRadius:6,opacity:.6}}>✕</button>}
          <span className="flbl">Sort</span>
          <select className="fsel" style={{borderColor:T.border,color:T.text}} value={filter.sort} onChange={e=>setFilter(p=>({...p,sort:e.target.value}))}>
            <option value="date">Date (newest first)</option>
            <option value="date_asc">Date (oldest first)</option>
            <option value="added">Recently Added</option>
            <option value="amount">Amount (highest)</option>
            <option value="amount_asc">Amount (lowest)</option>
            <option value="vendor">Vendor (A to Z)</option>
            <option value="cat">Category</option>
            <option value="itc">GST ITC (highest)</option>
            <option value="ded">Deductible (highest)</option>
          </select>
        </div>
      </div>
      )}

      {/* Main */}
      <div className="bodyrow">
      <div className="main">
        {tab==='dashboard'  && <Dashboard  {...{filtered,statVals,statCards,cats,province,T,getCat,calcBD}} onDetail={e=>{setDetailExp(e);setModal('detail');}} onEditStat={s=>{setEditStat(s);setModal('statEdit');}} />}
        {tab==='expenses'   && <Expenses   {...{filtered,cats,province,T,getCat,calcBD,clients}} selectedId={dExp?dExp.id:null} onDetail={e=>{setDetailExp(e); if(!wide) setModal('detail');}} onEdit={id=>{setEditId(id);setModal('expense');}} sortKey={filter.sort} onAdd={()=>{setEditId(null);setModal('expense');}} onDelete={id=>deleteExpenses([id])} onBulkDelete={ids=>deleteExpenses(ids)} onBulk={bulkApply} onReview={()=>setReviewOpen(true)} onZoom={zoomTo} exportCSV={exportCSV} exportXLS={exportXLS} importCSV={importCSV} downloadTemplate={downloadTemplate} dedupeExpenses={dedupeExpenses} />}
        {tab==='categories' && <Categories {...{filtered,cats,province,T,getCat,calcBD}} onEditCat={c=>{setEditCat(c);setModal('catEdit');}} />}
        {tab==='medical'    && <MedicalTab medical={medical} setMedical={setMedical} T={T} onZoom={zoomTo} onDriveBackup={handleMedicalDriveBackup} gClientId={gClientId} />}
        {tab==='income'     && <Income logoImg={logo.logoImg} invoices={invoices} setInvoices={setInvoices} prof={invProf} setProf={setInvProf} expenses={expenses} province={province} cats={cats} T={T} dl={dl} />}
        {tab==='mileage'    && <Mileage mileage={mileage} setMileage={setMileage} clients={clients} T={T} dl={dl} />}
        {tab==='summary'    && <Summary    {...{filtered,statVals,statCards,cats,province,T,getCat,calcBD}} exportCSV={exportCSV} exportXLS={exportXLS} />}
      </div>
      {wide && tab==='expenses' && (
        <aside className="dpane" style={{borderColor:T.border}}>
          {dExp
            ? <DetailModal inline expense={dExp} cats={cats} province={province} T={T} getCat={getCat} calcBD={calcBD} onZoom={zoomTo} onEdit={id=>{setEditId(id);setModal('expense');}} onDelete={id=>{deleteExpenses([id]);setDetailExp(null);}} />
            : <div className="dempty"><Ic n="receipt" s={40} w={1.2}/><div>Select an expense to see its breakdown</div></div>}
        </aside>
      )}
      </div>
      </div>

      {syncSt.s==='error' && (
        <div style={{position:'fixed',left:12,right:12,bottom:'calc(76px + env(safe-area-inset-bottom))',zIndex:9998,display:'flex',justifyContent:'center',pointerEvents:'none'}}>
          <div style={{pointerEvents:'auto',maxWidth:480,width:'100%',background:'#2a1514',color:'#ffd9d6',border:'1px solid rgba(255,69,58,.5)',borderRadius:14,padding:'12px 14px',fontSize:13,display:'flex',gap:10,alignItems:'center'}}>
            <span style={{flex:1}}>⚠ {syncSt.msg}</span>
            <button onClick={()=>{setSyncSt({s:'idle'}); syncNow();}} style={{background:'rgba(255,255,255,.12)',color:'#fff',padding:'6px 12px',borderRadius:8,fontSize:12,fontWeight:600}}>Retry</button>
          </div>
        </div>
      )}
      {(undo||syncFlash||bulkUndo||snapUndo) && (
        <div className="toastwrap">
          {undo && <div className="toast"><span>{undo.n>1?`${undo.n} expenses deleted`:`Deleted${undo.name?' '+(undo.name.length>22?undo.name.slice(0,22)+'…':undo.name):''}`}</span><button onClick={undoDelete}>Undo</button></div>}
          {snapUndo && !undo && <div className="toast"><span>Restored {snapUndo.label}</span><button onClick={undoRestore}>Undo</button></div>}
          {bulkUndo && !undo && !snapUndo && <div className="toast"><span>{bulkUndo.n} expenses updated</span><button onClick={undoBulk}>Undo</button></div>}
          {syncFlash && !undo && !bulkUndo && !snapUndo && <div className="toast pill"><Ic n="check" s={14}/> Synced</div>}
        </div>
      )}
      {/* Modals */}
      {modal==='expense'  && <ExpenseModal editId={editId} expense={expenses.find(e=>e.id===editId)} cats={cats} defaultProvince={province} T={T} calcBD={calcBD} apiKey={apiKey} clients={clients} vendors={vendors} allExpenses={expenses} startFile={startFile} onSave={(data,opts)=>{
        const rid = editId || Date.now();
        // Start the Google sign-in right here, inside the tap, so phones do not block the popup
        const tokenP = (data.receipt && isLocalReceipt(data.receipt) && gClientId) ? driveTokenNow() : null;
        if(editId) setExpenses(p=>p.map(e=>e.id===editId?{...e,...data}:e));
        else setExpenses(p=>[...p,{id:rid,...data}]);
        if(!editId && opts && opts.repeat){
          const day = +data.date.slice(8,10);
          const nxt = addMonth(data.date, day), end = (opts.repeatEnd||'') || undefined;
          if (!end || nxt <= end) setRecurring(r=>[...r,{id:Date.now(), day, next:nxt, ...(end?{end}:{}), tpl:{...data, receipt:null, orderNo:''}}]);
        }
        closeModal();
        // Auto-backup to Drive after save
        setTimeout(()=>handleGDriveBackup({...data,id:rid}, tokenP), 500);
      }} onClose={closeModal} onZoom={zoomTo} />}
      {modal==='detail'   && dExp && <DetailModal  expense={dExp} cats={cats} province={province} T={T} getCat={getCat} calcBD={calcBD} onClose={closeModal} onZoom={zoomTo} onEdit={id=>{setEditId(id);setModal('expense');}} onDelete={id=>{setModal(null);setDetailExp(null);deleteExpenses([id]);}} />}
      {modal==='catEdit'  && editCat   && <CatEditModal cat={editCat} T={T} onSave={p=>{setCats(x=>x.map(c=>c.id===editCat.id?{...c,...p}:c));closeModal();}} onClose={closeModal} />}
      {modal==='statEdit' && editStat  && <StatEditModal stat={editStat} T={T} onSave={p=>{setStatCards(x=>x.map(s=>s.key===editStat.key?{...s,...p}:s));closeModal();}} onClose={closeModal} />}
      {reviewOpen && <ReceiptReview expenses={expenses} getCat={getCat} T={T} onAttach={attachReceipt} onMark={markNoReceipt} onEdit={id=>{setReviewOpen(false);setEditId(id);setModal('expense');}} onClose={()=>setReviewOpen(false)} />}
      {restoreOpen && <RestoreModal expenses={expenses} cats={cats} T={T} listVersions={listVersions} loadVersion={loadVersion} onApply={applyRestore} onClose={()=>setRestoreOpen(false)} />}
      {modal==='theme'    && <ThemeModal  theme={T} auto={autoTheme} onSave={(t,a)=>{setAutoTheme(!!a);lsSave('themeAuto',!!a);setTheme(t);closeModal();}} onClose={closeModal} />}
      {modal==='logo'     && <LogoModal   logo={logo} T={T} onSave={l=>{setLogo(l);closeModal();}} onClose={closeModal} />}
      {modal==='settings' && <SettingsModal cards={cards} setCards={setCards} clients={clients} setClients={setClients} vendors={vendors} setVendors={setVendors} cats={cats} onOpenRestore={()=>{setModal(null);setRestoreOpen(true);}} recurring={recurring} setRecurring={setRecurring} apiKey={apiKey} gClientId={gClientId} ghToken={ghToken} T={T} onSave={(k,g,gh)=>{
        const tokenChanged = gh && gh !== lsLoad('ghToken','');
        setApiKey(k);setGClientId(g);setGhToken(gh);lsSave('ghToken', gh);closeModal();
        if (gh && (tokenChanged || !window._ghReady)) {
          pullFromGitHub(gh).then(r=>{
            if (r.ok) alert(`Connected. Loaded ${r.count} expenses from GitHub.`);
            else if (r.reason==='bad-token') alert('GitHub rejected that token. Check that you copied all of it.');
            else if (r.reason==='not-found') alert('Token saved, but the data file was not found. Make sure the token has access to the data repo.');
            else alert('Could not reach GitHub. Check your connection and try Save again.');
          });
        }
      }} onClose={closeModal} onMigrate={moveReceiptsToDrive} localReceipts={expenses.filter(e=>isLocalReceipt(e.receipt)).length + medical.filter(m=>isLocalReceipt(m.receipt)).length} />}

      {/* Lightbox receipt viewer */}
      {fullImg && <ReceiptLightbox src={fullImg} list={zoomList} onClose={()=>{setFullImg(null);setZoomList(null);}} />}
    </div>
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({filtered,statVals,statCards,cats,province,T,getCat,calcBD,onDetail,onEditStat}) {
  const byCat = useMemo(()=>{const m={};filtered.forEach(e=>{m[e.category]=(m[e.category]||0)+e.amount;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);},[filtered]);
  const mx = byCat[0]?.[1]||1;
  return(
    <div>
      <div className="sgrid">
        {statCards.map(sc=>(
          <div key={sc.key} className="sc" style={{background:T.bg2,borderColor:T.border}} onClick={()=>onEditStat(sc)}>
            <div className="sc-bar" style={{background:sc.color}}/>
            <div className="sc-hint">✏ edit</div>
            <div className="sc-lbl">{sc.label}</div>
            <div className="sc-val" style={{color:sc.color}}>{cad(statVals[sc.key])}</div>
            <div className="sc-sub">{sc.sub}</div>
          </div>
        ))}
      </div>
      <div className="two">
        <div className="card" style={{background:T.bg2,borderColor:T.border}}>
          <div className="sec-ttl">Spending by Category</div>
          {byCat.length===0&&<div style={{opacity:.4,fontSize:13}}>No expenses yet</div>}
          {byCat.map(([id,amt])=>{const c=getCat(id);return(
            <div key={id} className="cbar">
              <div className="cbar-h"><span className="cbar-name">{c.icon} {c.label}</span><span className="cbar-amt">{cad(amt)}</span></div>
              <div className="prog"><div className="prog-fill" style={{width:`${Math.round(amt/mx*100)}%`,background:c.color}}/></div>
            </div>
          );})}
        </div>
        <div className="card" style={{background:T.bg2,borderColor:T.border}}>
          <div className="sec-ttl">Recent Expenses</div>
          {filtered.slice(0,7).map(e=>{
            const c=getCat(e.category);
            const bd=calcBD(e.amount,e.province||province,e.category,e.tax,cats);
            return(
              <div key={e.id} style={{display:'flex',alignItems:'center',gap:9,marginBottom:12,cursor:'pointer'}} onClick={()=>onDetail(e)}>
                <div style={{fontSize:19}}>{c.icon}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>{e.vendor}</div>
                  <div style={{fontSize:10,opacity:.4}}>{e.date} · L{c.line}</div>
                </div>
                <div style={{textAlign:'right',flexShrink:0}}>
                  <div style={{fontSize:13,fontWeight:600,fontFamily:"-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif"}}>{cad(e.amount)}</div>
                  <div style={{fontSize:10,color:T.green}}>ITC {cad(bd.gstClaimable)}</div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
      <div className="ibanner" style={{borderColor:T.border}}>
        🍁 <b>CRA T2125:</b> Don't include GST/HST in expenses — claim ITC instead. Deductible = subtotal only. Gas tip not deductible. Meals = 50% deductible, 50% ITC. PST optional — enter only if on receipt. Keep receipts <b>6 yrs</b>. Click stat cards to customise · <b>🎨 Theme</b> to change colours/fonts · logo to rename.
      </div>
    </div>
  );
}

// ─── EXPENSES ─────────────────────────────────────────────────────────────────
function Expenses({filtered:filteredAll0,clients,cats,province,T,getCat,calcBD,sortKey,selectedId,onAdd,onDetail,onEdit,onDelete,onBulkDelete,onBulk,onReview,onZoom,exportCSV,exportXLS,importCSV,downloadTemplate,dedupeExpenses}) {
  const fileRef = useRef();
  const PAGE = 60;
  const [limit, setLimit] = useState(PAGE);
  const [rcpt, setRcpt] = useState('all');   // all | with | missing | missing30
  const [cl, setCl] = useState('all');
  const [q, setQ] = useState('');
  const [tools, setTools] = useState(false);
  const [selMode, setSelMode] = useState(false);
  const [sel, setSel] = useState([]);
  const swipe = useRef({}); const swiped = useRef(0);
  const qn = q.trim().toLowerCase();
  const filteredAll = filteredAll0.filter(e=>{
    if (cl!=='all' && !(e.clients||[]).includes(cl)) return false;
    if (!qn) return true;
    const hay = [e.vendor, e.note, getCat(e.category).label, e.date, String(e.amount), (e.clients||[]).join(' '), e.payment?.name, e.payment?.last4, e.payment?.type, e.orderNo].join(' ').toLowerCase();
    return qn.split(/\s+/).every(w=>hay.includes(w));
  });
  const rows = rcpt==='all' ? filteredAll
    : rcpt==='with' ? filteredAll.filter(e=>!!e.receipt)
    : rcpt==='missing30' ? filteredAll.filter(e=>!e.receipt && !e.noReceipt && e.amount>=30)
    : filteredAll.filter(e=>!e.receipt);
  const missingN = filteredAll.filter(e=>!e.receipt).length;
  const miss30 = filteredAll.filter(e=>!e.receipt && !e.noReceipt && e.amount>=30).length;
  const adj = e => {
    const bd = calcBD(e.amount,e.province||province,e.category,e.tax,cats);
    const pct = (e.bizPct!=null?e.bizPct:100)/100;
    return {bd, itc:+(bd.gstClaimable*pct).toFixed(2), ded:+(bd.deductibleAmount*pct).toFixed(2)};
  };
  const grouped = /^date/.test(sortKey||'date');
  const mt = {};
  if (grouped) rows.forEach(e=>{ const k=e.date.slice(0,7); const m=(mt[k]=mt[k]||{n:0,s:0}); m.n++; m.s+=e.amount; });
  const monthLabel = k => { const [y,m]=k.split('-'); return new Date(+y,+m-1,1).toLocaleString('en-CA',{month:'long',year:'numeric'}); };
  const dayLabel = d => { const [y,m,dd]=d.split('-'); return new Date(+y,+m-1,+dd).toLocaleDateString('en-CA',grouped?{month:'short',day:'numeric'}:{month:'short',day:'numeric',year:'numeric'}); };
  const clientNames = [...new Set([...(clients||[]), ...filteredAll0.flatMap(e=>e.clients||[])])];
  const shown = rows.slice(0, limit);
  const groupsArr = [];
  shown.forEach(e=>{ const k = grouped ? e.date.slice(0,7) : 'all'; let g = groupsArr[groupsArr.length-1]; if (!g || g.k!==k) { g = {k, rows:[]}; groupsArr.push(g); } g.rows.push(e); });
  const anyLocalFilter = !!qn || cl!=='all' || rcpt!=='all';
  const clearFilters = () => { setQ(''); setCl('all'); setRcpt('all'); };
  const rlist = () => rows.map(e=>e.receipt).filter(Boolean);
  const toggle = id => setSel(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const exitSel = () => { setSelMode(false); setSel([]); };
  function bulkExport() {
    const ids = new Set(sel);
    const list = rows.filter(e=>ids.has(e.id));
    const hdr = ['Date','Vendor','Category','T2125 Line','Receipt Total','GST ITC Claimable','CRA Deductible','Payment','Clients','Note','Order / Ref #'];
    const out = list.map(e=>{ const c=getCat(e.category), a=adj(e); return [e.date,e.vendor,c.label,c.line,e.amount,a.itc,a.ded,[e.payment?.name||e.payment?.type||'', e.payment?.last4||''].join(' ').trim(),(e.clients||[]).join('; '),e.note||'',e.orderNo||'']; });
    kbwDownload('Selected_Expenses.csv','text/csv',[hdr,...out].map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\n'));
  }
  useEffect(()=>{ setLimit(PAGE); },[rcpt, cl, qn, sortKey]);
  // Keep sticky month headers just under the app header
  useEffect(()=>{
    const set = ()=>{
      const h=document.querySelector('.hdr');
      let top = 0;
      if (h && h.offsetHeight < 200) top = h.offsetHeight;
      document.documentElement.style.setProperty('--stk', top+'px');
    };
    set(); window.addEventListener('resize', set);
    return ()=>window.removeEventListener('resize', set);
  },[]);
  // Load more rows automatically as you scroll to the bottom
  const sentinelRef = useRef(null);
  useEffect(()=>{
    const el = sentinelRef.current;
    if (!el || typeof IntersectionObserver === 'undefined') return;
    const io = new IntersectionObserver(es=>{ if (es[0].isIntersecting) setLimit(l=>l+PAGE); }, {rootMargin:'400px'});
    io.observe(el);
    return ()=>io.disconnect();
  },[limit, rows.length]);
  const sw = {
    onTouchStart: ev=>{ if (selMode || ev.touches.length!==1) return; const t=ev.touches[0]; swipe.current={x:t.clientX,y:t.clientY,dx:0,lock:null,el:ev.currentTarget}; },
    onTouchMove: ev=>{
      const S=swipe.current; if (!S.el) return;
      const t=ev.touches[0], dx=t.clientX-S.x, dy=t.clientY-S.y;
      if (S.lock===null) { if (Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)*1.4) S.lock='h'; else if (Math.abs(dy)>10) S.lock='v'; }
      if (S.lock==='h') { S.dx=dx; S.el.style.transition='none'; S.el.style.transform=`translateX(${Math.max(-140,Math.min(140,dx))}px)`; S.el.style.background = dx<0 ? 'rgba(255,69,58,.28)' : 'rgba(10,132,255,.28)'; }
    },
    onTouchEnd: ()=>{
      const S=swipe.current; if (!S.el) return;
      const el=S.el; el.style.transition='transform .18s, background .18s'; el.style.transform=''; el.style.background='';
      const id=+el.dataset.id;
      if (S.lock==='h') { swiped.current=Date.now(); if (S.dx<-90) onDelete(id); else if (S.dx>90) onEdit(id); }
      swipe.current={};
    },
  };
  const chips = [
    ['all','All'],
    ['with','Has receipt'],
    ['missing',`No receipt${missingN?` · ${missingN}`:''}`],
    ['missing30','Missing over $30'+(miss30?` · ${miss30}`:'')],
  ];
  return(
    <div>
      <div className="srch">
        <span className="srch-ic"><Ic n="search" s={16}/></span>
        <input id="qsearch" type="search" value={q} onChange={e=>setQ(e.target.value)} placeholder="Search" autoComplete="off" autoCorrect="off" spellCheck={false}/>
        {!q && <span className="kbdhint">/</span>}
      </div>
      <div className="chips">
        {chips.map(([k,l])=><button key={k} type="button" className={'chip'+(rcpt===k?' on':'')+(k==='missing30'&&rcpt!==k&&miss30?' warn':'')} style={rcpt!==k&&k==='missing30'&&miss30?{color:T.amber}:undefined} onClick={()=>setRcpt(k)}>{l}</button>)}
        {clientNames.length>0 && <select value={cl} onChange={e=>setCl(e.target.value)} className="chip chipsel" style={{color:T.text}} aria-label="Client">
            <option value="all" style={{color:'#000'}}>All clients</option>
            {clientNames.map(c=><option key={c} value={c} style={{color:'#000'}}>{c}</option>)}
          </select>}
        <button type="button" className={'chip'+(selMode?' on':'')} onClick={()=>selMode?exitSel():setSelMode(true)}><Ic n="select" s={14}/> {selMode?'Done':'Select'}</button>
        <button type="button" className={'chip'+(tools?' on':'')} onClick={()=>setTools(t=>!t)} aria-label="Export and import"><Ic n="download" s={14}/> Export &amp; import</button>
      </div>
      {tools && <div className="xtools2">
        <button className="xbtn" onClick={exportCSV}><Ic n="file" s={14}/> Export CSV</button>
        <button className="xbtn" onClick={exportXLS}><Ic n="download" s={14}/> Export Excel</button>
        <button className="xbtn" onClick={()=>fileRef.current.click()}><Ic n="upload" s={14}/> Import CSV</button>
        <button className="xbtn" onClick={downloadTemplate}><Ic n="file" s={14}/> Template</button>
      </div>}
      <input ref={fileRef} type="file" accept=".csv" style={{display:'none'}} onChange={e=>{if(e.target.files[0])importCSV(e.target.files[0]);e.target.value='';}}/>
      {rcpt==='all' && miss30>0 && (
        <div className="chipw"><button type="button" style={{border:`1px solid ${T.amber}`,color:T.amber}} onClick={()=>onReview?onReview():setRcpt('missing30')}><Ic n="warn" s={14}/> {miss30} expense{miss30!==1?'s':''} over $30 {miss30!==1?'have':'has'} no receipt. Review</button></div>
      )}
      {rows.length===0
        ?<div className="empty"><div style={{marginBottom:12,opacity:.8,display:'flex',justifyContent:'center'}}><Ic n="receipt" s={44} w={1.2}/></div>
          <div>{anyLocalFilter ? 'No expenses match your search or filters' : filteredAll0.length===0 ? 'No expenses for this year or category yet' : 'Nothing to show'}</div>
          {anyLocalFilter
            ? <button type="button" className="eb" onClick={clearFilters}><Ic n="x" s={14}/> Clear filters</button>
            : onAdd && <button type="button" className="eb" onClick={onAdd}><Ic n="plus" s={14}/> Add an expense</button>}
        </div>
        :<div>
          {groupsArr.map(g=>(
            <div className="mgroup" key={g.k}>
              {grouped && <div className="mhead"><span>{monthLabel(g.k)}</span><span>{mt[g.k].n} expense{mt[g.k].n!==1?'s':''} · {cad(mt[g.k].s)}</span></div>}
              <div className="mcard" style={{background:T.bg2}}>
                {g.rows.map(e=>{
                  const c=getCat(e.category);
                  const A=adj(e);
                  const receipt = e.receipt;
                  const isPdfReceipt = receipt?.startsWith('__PDF__:');
                  const isSel = sel.includes(e.id);
                  const pay = e.payment;
                  return(
                    <div key={e.id} className={'erow'+(isSel?' sel':'')+(selectedId===e.id?' cur':'')} data-id={e.id}
                      {...sw}
                      onClick={()=>{ if (Date.now()-swiped.current<400) return; if (selMode) toggle(e.id); else onDetail(e); }}>
                      <div className="r-wrap">
                        {selMode && <span className={'selbox'+(isSel?' on':'')}>{isSel&&<Ic n="check" s={13} w={2.4}/>}</span>}
                        {receipt
                          ? isPdfReceipt
                            ? <PdfPreview src={receipt.slice(8)} width={120} className="r-thumb" style={{objectFit:'cover',objectPosition:'top left',background:'#fff',cursor:'zoom-in'}} onClick={ev=>{ev.stopPropagation();onZoom(receipt);}} fallback={<div className="r-icon" style={{background:T.bg4,cursor:'zoom-in'}} onClick={ev=>{ev.stopPropagation();onZoom(receipt);}}><Ic n="file" s={20}/></div>}/>
                            : <img className="r-thumb" src={thumbSrc(receipt)} onError={fbImg(receipt,120)} referrerPolicy="no-referrer" loading="lazy" decoding="async" alt="" onClick={ev=>{ev.stopPropagation();onZoom(receipt, rlist());}}/>
                          : <div className="r-icon" style={{background:T.bg4,color:T.amber}} title="No receipt"><Ic n="file" s={20}/></div>}
                        {receipt && <span className="r-tick" title="Receipt saved" onClick={ev=>{ev.stopPropagation(); if(/^https?:/.test(receipt)) window.open(drivePage(receipt),'_blank','noopener'); else onZoom(receipt, rlist());}}>✓</span>}
                      </div>
                      <div className="rmain">
                        <div className="vname">{e.vendor}</div>
                        <div className="rsub">
                          <span>{dayLabel(e.date)}</span>
                          <span className="rdot">·</span><i className="cdot" style={{background:c.color}}/><span className="rcat">{c.label}</span>
                          {pay?.type && <span className="rpay"><span className="rdot">·</span> <Ic n={pay.type==='Cash'?'cash':'card'} s={12}/> {pay.name||pay.type}{pay.last4?` ${pay.last4}`:''}</span>}
                          {e.bizPct&&e.bizPct!==100 ? <><span className="rdot">·</span><span style={{color:T.green}}>{e.bizPct}% biz</span></> : null}
                          {e.recurId && <span className="rtag" title="Monthly"><Ic n="repeat" s={12}/></span>}
                          {e.clients&&e.clients.length>0 && <span className="rtag rcl" title={e.clients.join(', ')}><Ic n="user" s={12}/><span className="rtn"> {e.clients.length>1?e.clients.length:e.clients[0]}</span></span>}
                        </div>
                      </div>
                      <div className="rright">
                        <div className="ramt">{cad(e.amount)}</div>
                        <div className="rtot" title="Total paid including taxes and tip">Total {cad(A.bd.total)}</div>
                        <div className="rnote" title={!receipt&&e.noReceipt?e.noReceipt:undefined} style={receipt?undefined:(e.noReceipt?{opacity:.55}:{color:T.amber,opacity:1})}>{receipt ? `ITC ${cad(A.itc)}` : (e.noReceipt ? 'No receipt needed' : 'No receipt')}</div>
                      </div>
                      <div className="rac" onClick={ev=>ev.stopPropagation()}>
                        <button className="bsm" onClick={()=>onEdit(e.id)}>Edit</button>
                        <button className="bsm" style={{color:T.red}} onClick={()=>onDelete(e.id)} aria-label="Delete"><Ic n="x" s={13}/></button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
          {rows.length > limit && <div ref={sentinelRef} style={{height:1}}/>}
          {rows.length > limit && (
            <button className="showmore" onClick={()=>setLimit(l=>l+PAGE)}>Show more ({rows.length - limit} remaining)</button>
          )}
        </div>}
      {selMode && (
        <div className="selbar" style={{background:T.bg2+'f7',color:T.text}}>
          <b style={{fontSize:13}}>{sel.length} selected</b>
          <button type="button" onClick={()=>setSel(sel.length===rows.length?[]:rows.map(e=>e.id))}>{sel.length===rows.length?'Clear':`All ${rows.length}`}</button>
          <select value="" disabled={!sel.length} onChange={e=>{ const v=e.target.value; if(v) onBulk(sel,()=>({category:v}),`Set category to ${(cats.find(c=>c.id===v)||{}).label||v}`); }}>
            <option value="">Category…</option>
            {cats.map(c=><option key={c.id} value={c.id} style={{color:'#000'}}>{c.label}</option>)}
          </select>
          {clientNames.length>0 && <select value="" disabled={!sel.length} onChange={e=>{ const v=e.target.value; if(v) onBulk(sel,x=>({clients:[...new Set([...(x.clients||[]),v])]}),`Add client ${v}`); }}>
            <option value="">Add client…</option>
            {clientNames.map(c=><option key={c} value={c} style={{color:'#000'}}>{c}</option>)}
          </select>}
          <button type="button" disabled={!sel.length} onClick={bulkExport}><Ic n="download" s={13}/> CSV</button>
          <button type="button" disabled={!sel.length} style={{color:T.red,borderColor:'rgba(232,85,85,.4)'}} onClick={()=>{ onBulkDelete(sel); setSel([]); }}><Ic n="trash" s={13}/> Delete</button>
          <button type="button" onClick={exitSel}>Done</button>
        </div>
      )}
    </div>
  );
}

// ─── CATEGORIES ───────────────────────────────────────────────────────────────
function Categories({filtered,cats,province,T,getCat,calcBD,onEditCat}) {
  return(
    <div className="cgrid">
      {cats.map(cat=>{
        const exps=filtered.filter(e=>e.category===cat.id);
        const tot=exps.reduce((s,e)=>s+e.amount,0);
        const itc=exps.reduce((s,e)=>s+calcBD(e.amount,e.province||province,e.category,e.tax,cats).gstClaimable,0);
        const ded=exps.reduce((s,e)=>s+calcBD(e.amount,e.province||province,e.category,e.tax,cats).deductibleAmount,0);
        return(
          <div key={cat.id} className="ccard" style={{background:T.bg2,borderColor:T.border,borderLeftColor:cat.color}}>
            <div className="ccard-top">
              <span className="ccard-icon" style={{fontSize:24}}>{cat.icon}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                  <div className="ccard-name" style={{fontSize:15,fontWeight:600}}>{cat.label}</div>
                  <button className="ccard-ebtn" style={{borderColor:T.border,color:T.text,fontSize:11,padding:'2px 9px',borderRadius:6,background:T.bg4,border:`1px solid ${T.border}`,cursor:'pointer',opacity:.7,flexShrink:0}} onClick={()=>onEditCat(cat)}>✏ Edit</button>
                </div>
                <div className="ccard-line" style={{fontSize:12,marginTop:2}}>T2125 Line {cat.line} · {exps.length} expense{exps.length!==1?'s':''}</div>
              </div>
              <div className="ccard-tot" style={{fontSize:20,fontWeight:700,flexShrink:0}}>{cad(tot)}</div>
            </div>
            <div className="cminis">
              <div className="cmini" style={{borderColor:T.border,background:T.bg4}}>
                <div className="cminilbl" style={{fontSize:11,marginBottom:4}}>GST ITC</div>
                <div className="cminival" style={{color:T.green,fontSize:15}}>{cad(itc)}</div>
              </div>
              <div className="cmini" style={{borderColor:T.border,background:T.bg4}}>
                <div className="cminilbl" style={{fontSize:11,marginBottom:4}}>Deductible</div>
                <div className="cminival" style={{color:T.blue,fontSize:15}}>{cad(ded)}</div>
              </div>
            </div>
            <div className="ccranote" style={{background:T.bg4,fontSize:12,opacity:.7}}>{cat.cra}</div>
            {cat.df<1&&<div className="wpill" style={{borderColor:'rgba(240,160,51,.3)',color:T.amber,background:'rgba(240,160,51,.08)',fontSize:12}}>⚠ {cat.gf*100}% GST ITC · {cat.df*100}% deductible</div>}
          </div>
        );
      })}
    </div>
  );
}

// ─── SUMMARY ──────────────────────────────────────────────────────────────────
function Summary({filtered,statVals,statCards,cats,province,T,getCat,calcBD,exportCSV,exportXLS}) {
  const rows=cats.map(cat=>{
    const exps=filtered.filter(e=>e.category===cat.id);
    if(!exps.length)return null;
    const g  =exps.reduce((s,e)=>s+e.amount,0);
    const itc=exps.reduce((s,e)=>s+calcBD(e.amount,e.province||province,e.category,e.tax,cats).gstClaimable,0);
    const p  =exps.reduce((s,e)=>s+calcBD(e.amount,e.province||province,e.category,e.tax,cats).pstPaid,0);
    const d  =exps.reduce((s,e)=>s+calcBD(e.amount,e.province||province,e.category,e.tax,cats).deductibleAmount,0);
    return{cat,n:exps.length,g,itc,p,d};
  }).filter(Boolean);
  const sortedRows = rows.slice().sort((a,b)=>(parseFloat(a.cat.line)||0)-(parseFloat(b.cat.line)||0));
  const yrs = [...new Set(filtered.map(e=>(e.date||'').slice(0,4)).filter(Boolean))].sort();
  const period = yrs.length===0 ? 'All dates' : yrs.length===1 ? yrs[0] : yrs[0]+' to '+yrs[yrs.length-1];
  function t2125Csv() {
    const hdr = ['T2125 Line','Category','Count','Gross Spent','GST ITC','PST','Deductible','Deduction Rate'];
    const out = sortedRows.map(r=>[r.cat.line,r.cat.label,r.n,r.g.toFixed(2),r.itc.toFixed(2),r.p.toFixed(2),r.d.toFixed(2),Math.round(r.cat.df*100)+'%']);
    out.push(['','TOTALS',filtered.length,(+statVals.gross).toFixed(2),(+statVals.itc).toFixed(2),(+statVals.pst).toFixed(2),(+statVals.ded).toFixed(2),'']);
    kbwDownload('T2125_Summary_'+period.replace(/\s+/g,'')+'.csv','text/csv',[['Period',period],[],hdr,...out].map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\n'));
  }
  function t2125Print() {
    const w = window.open('', '_blank');
    if (!w) { alert('Please allow pop-ups to print the summary.'); return; }
    const tr = sortedRows.map(r=>`<tr><td>${kbwEsc(r.cat.line)}</td><td>${kbwEsc(r.cat.label)}</td><td class="n">${r.n}</td><td class="n">${cad(r.g)}</td><td class="n">${cad(r.itc)}</td><td class="n">${cad(r.p)}</td><td class="n">${cad(r.d)}</td><td class="n">${Math.round(r.cat.df*100)}%</td></tr>`).join('');
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>T2125 Summary ${kbwEsc(period)}</title><style>body{font:14px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;margin:36px;color:#111}h1{font-size:20px;margin:0 0 4px}p{margin:0 0 18px;color:#555}table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;border-bottom:1px solid #ddd;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#555}.n{text-align:right;font-variant-numeric:tabular-nums}tfoot td{font-weight:700;border-top:2px solid #111;border-bottom:none}small{color:#777}</style></head><body><h1>T2125 Business Expense Summary</h1><p>Period: ${kbwEsc(period)} · ${filtered.length} expenses · Generated ${new Date().toLocaleDateString('en-CA')}</p><table><thead><tr><th>Line</th><th>Category</th><th class="n">Count</th><th class="n">Gross spent</th><th class="n">GST ITC</th><th class="n">PST</th><th class="n">Deductible</th><th class="n">Rate</th></tr></thead><tbody>${tr}</tbody><tfoot><tr><td></td><td>Totals</td><td class="n">${filtered.length}</td><td class="n">${cad(statVals.gross)}</td><td class="n">${cad(statVals.itc)}</td><td class="n">${cad(statVals.pst)}</td><td class="n">${cad(statVals.ded)}</td><td></td></tr></tfoot></table><p style="margin-top:18px"><small>Deductible amounts exclude GST and reflect each category's deduction rate and business use percentage.</small></p></body></html>`);
    w.document.close();
    setTimeout(()=>{ try { w.focus(); w.print(); } catch(e) {} }, 400);
  }

  return(
    <div>
      <div className="sgrid" style={{marginBottom:18}}>
        {statCards.map(sc=>(
          <div key={sc.key} className="sc" style={{background:T.bg2,borderColor:T.border}}>
            <div className="sc-bar" style={{background:sc.color}}/>
            <div className="sc-lbl">{sc.label}</div>
            <div className="sc-val" style={{color:sc.color}}>{cad(statVals[sc.key])}</div>
            <div className="sc-sub">{sc.sub}</div>
          </div>
        ))}
      </div>
      <div className="xbar">
        <span style={{fontSize:12,opacity:.5}}>Export for CRA:</span>
        <button className="xbtn" style={{borderColor:T.border,color:T.text}} onClick={exportCSV}><Ic n="file" s={14}/> CSV</button>
        <button className="xbtn" style={{borderColor:T.border,color:T.text}} onClick={exportXLS}><Ic n="download" s={14}/> Excel</button>
        <div style={{width:1,height:20,background:T.border,margin:'0 4px'}}/>
        <span style={{fontSize:12,opacity:.5}}>T2125 summary:</span>
        <button className="xbtn" style={{borderColor:T.border,color:T.text}} onClick={t2125Csv}><Ic n="file" s={14}/> CSV</button>
        <button className="xbtn" style={{borderColor:T.border,color:T.text}} onClick={t2125Print}><Ic n="print" s={14}/> Print / PDF</button>
      </div>
      <div className="etbl" style={{borderColor:T.border,marginBottom:16}}>
        <div style={{padding:'13px 17px',borderBottom:`1px solid ${T.border}`,fontSize:15,fontWeight:700,background:T.bg2}}>T2125 — Business Expense Summary</div>
        <table className="stbl">
          <thead><tr style={{background:T.bg3}}>
            <th style={{borderColor:T.border}}>Category (Line)</th>
            <th style={{borderColor:T.border}}>Count</th>
            <th style={{borderColor:T.border}}>Gross Spent</th>
            <th style={{borderColor:T.border}}>GST ITC</th>
            <th style={{borderColor:T.border}}>PST</th>
            <th style={{borderColor:T.border}}>Deductible</th>
            <th style={{borderColor:T.border}}>Rate</th>
          </tr></thead>
          <tbody>
            {rows.map(r=>(
              <tr key={r.cat.id} style={{borderColor:T.border,background:T.bg2}}>
                <td style={{borderColor:T.border}}>{r.cat.icon} {r.cat.label} <span style={{fontFamily:"-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif",opacity:.4,fontSize:11}}>L{r.cat.line}</span></td>
                <td style={{borderColor:T.border}}>{r.n}</td>
