                <td style={{borderColor:T.border,fontFamily:"-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif"}}>{cad(r.g)}</td>
                <td style={{borderColor:T.border,fontFamily:"-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif",color:T.green,fontWeight:600}}>{cad(r.itc)}</td>
                <td style={{borderColor:T.border,fontFamily:"-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif",color:T.amber}}>{cad(r.p)}</td>
                <td style={{borderColor:T.border,fontFamily:"-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif",color:T.blue,fontWeight:600}}>{cad(r.d)}</td>
                <td style={{borderColor:T.border}}>
                  <span className="badge" style={r.cat.df<1?{background:'rgba(240,160,51,.15)',color:T.amber}:{background:'rgba(46,204,138,.12)',color:T.green}}>{r.cat.df*100}%</span>
                </td>
              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr style={{background:T.bg3}}>
              <td colSpan={2} style={{borderColor:T.border}}>TOTALS</td>
              <td style={{borderColor:T.border,fontFamily:"-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif"}}>{cad(statVals.gross)}</td>
              <td style={{borderColor:T.border,fontFamily:"-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif",color:T.green}}>{cad(statVals.itc)}</td>
              <td style={{borderColor:T.border,fontFamily:"-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif",color:T.amber}}>{cad(statVals.pst)}</td>
              <td style={{borderColor:T.border,fontFamily:"-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif",color:T.blue}}>{cad(statVals.ded)}</td>
              <td style={{borderColor:T.border}}/>
            </tr>
          </tfoot>
        </table>
      </div>
      <SummaryExtras filtered={filtered} cats={cats} province={province} T={T} calcBD={calcBD} />
      <div className="two">
        <div className="card" style={{background:T.bg2,borderColor:T.border,borderLeft:`3px solid ${T.green}`}}>
          <div style={{fontWeight:700,color:T.green,marginBottom:8}}>📥 GST34 Return — Line 108</div>
          <div style={{fontSize:13,opacity:.7,lineHeight:1.7}}>Total <b style={{opacity:1}}>Input Tax Credits</b> to claim:<br/>
          <span style={{fontSize:22,fontWeight:700,fontFamily:"-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif",color:T.green}}>{cad(statVals.itc)}</span></div>
        </div>
        <div className="card" style={{background:T.bg2,borderColor:T.border,borderLeft:`3px solid ${T.blue}`}}>
          <div style={{fontWeight:700,color:T.blue,marginBottom:8}}>📋 T2125 Business Expenses</div>
          <div style={{fontSize:13,opacity:.7,lineHeight:1.7}}>Total allowable deductions (subtotals only, excl. GST):<br/>
          <span style={{fontSize:22,fontWeight:700,fontFamily:"-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif",color:T.blue}}>{cad(statVals.ded)}</span></div>
        </div>
      </div>
    </div>
  );
}

// ─── EXPENSE MODAL ────────────────────────────────────────────────────────────
function ExpenseModal({editId,expense,cats,defaultProvince,T,calcBD,apiKey,clients,vendors,allExpenses,startFile,onSave,onClose,onZoom}) {
  const today=new Date().toISOString().split('T')[0];
  const [date,    setDate]    = useState(expense?.date    ||today);
  const [vendor,  setVendor]  = useState(expense?.vendor  ||'');
  const [cat,     setCat]     = useState(expense?.category||'advertising');
  const [province,setProv]    = useState(expense?.province||defaultProvince);
  const [note,    setNote]    = useState(expense?.note    ||'');
  const [orderNo, setOrderNo] = useState(expense?.orderNo ||'');
  const [receipt, setReceipt] = useState(expense?.receipt ||null);
  const [scanning,setScanning]= useState(false);
  const [scanErr, setScanErr] = useState('');
  const [clientSel, setClientSel] = useState(expense?.clients || []);
  const [repeat,  setRepeat]  = useState(false);
  const [repeatEnd,setRepeatEnd]= useState('');
  const [memoMsg, setMemoMsg] = useState('');
  // Payment method
  const [payType,  setPayType]  = useState(expense?.payment?.type  ||'Credit Card');
  const [payLast4, setPayLast4] = useState(expense?.payment?.last4 ||'');
  const [payName,  setPayName]  = useState(expense?.payment?.name  ||'');
  // Business use %
  const [bizPct,   setBizPct]   = useState(expense?.bizPct != null ? String(expense.bizPct) : '100');

  // Tax fields
  const init=expense?.tax||{gst:'',pst:'',hasPst:false,tip:'',liquor:'',other:'',gasMode:false,gasTotal:''};
  const [gst,    setGst]    = useState(String(init.gst   ||''));
  const [pst,    setPst]    = useState(String(init.pst   ||''));
  const [hasPst, setHasPst] = useState(!!init.hasPst);
  const [tip,    setTip]    = useState(String(init.tip   ||''));
  const [liquor, setLiquor] = useState(String(init.liquor||''));
  const [gasMode,setGasMode]= useState(true);   // always on for gas — type total, get split
  const [gasTotal,setGasTotal]=useState(init.gasTotal?String(init.gasTotal): (expense?.category==='gas'&&expense?.amount ? String((expense.tax?.gasTotal)||'') : ''));
  // amount = pre-tax subtotal
  const [amount, setAmount] = useState(expense?.amount!=null?String(expense.amount):'');

  const fileRef = useRef();
  // Vendor memory: reuse category, business %, card and clients from your last expense with this vendor
  const memoRef = useRef('');
  useEffect(()=>{
    if (editId) return;
    const v = vendor.trim().toLowerCase();
    if (v.length < 3 || memoRef.current === v) return;
    const prev = (allExpenses||[]).filter(e=>(e.vendor||'').trim().toLowerCase()===v).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id)[0];
    if (!prev) return;
    memoRef.current = v;
    if (prev.category) setCat(prev.category);
    if (prev.bizPct != null) setBizPct(String(prev.bizPct));
    if (prev.payment && !payLast4) { setPayType(prev.payment.type||'Credit Card'); setPayName(prev.payment.name||''); setPayLast4(prev.payment.last4||''); }
    if (Array.isArray(prev.clients) && prev.clients.length) setClientSel(prev.clients);
    setMemoMsg('Filled in from your last '+prev.vendor+' expense');
  },[vendor]);
  const vendorOptions = useMemo(()=>{
    const seen=new Set(), out=[];
    const cnt={}; (allExpenses||[]).forEach(e=>{ const n=(e.vendor||'').trim(); if(n) cnt[n]=(cnt[n]||0)+1; });
    [...(vendors||[]).map(v=>v.name), ...Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])].forEach(n=>{ const k=n.toLowerCase(); if(!seen.has(k)){seen.add(k); out.push(n);} });
    return out.slice(0,60);
  },[vendors,allExpenses]);
  const catObj  = cats.find(c=>c.id===cat)||cats[cats.length-1];
  const isGas   = cat==='gas';

  // Gas: derive subtotal + GST directly from gasTotal (no useEffect needed)
  const p = PROVS.find(x=>x.code===province)||PROVS[0];
  const gstRate = p.hst ? p.hstRate : p.gst;

  function handleGasTotal(val) {
    setGasTotal(val);
    const total = parseFloat(val) || 0;
    if (total > 0) {
      const sub  = +(total / (1 + gstRate)).toFixed(2);
      const gstV = +(total - sub).toFixed(2);
      setAmount(String(sub));
      setGst(String(gstV));
    } else {
      setAmount('');
      setGst('');
    }
  }

  // Recalculate if province changes while a gasTotal is already entered
  useEffect(()=>{
    if (isGas && parseFloat(gasTotal) > 0) {
      handleGasTotal(gasTotal);
    }
  }, [province]);

  const taxObj  = {gst,pst,hasPst,tip,liquor,other:'',gasMode:true,gasTotal};
  const amt     = parseFloat(amount)||0;
  const bd      = amt>0 ? calcBD(amt,province,cat,taxObj,cats) : null;

  const PROMPT_TEXT = `You are a Canadian tax receipt OCR. Extract all financial details from this receipt.
Return ONLY valid JSON (no markdown, no explanation):
{
  "vendor": "exact store/business name",
  "date": "YYYY-MM-DD or null",
  "category": "one of: advertising|meals|insurance|interest|business_tax|office|supplies|legal|management|rent|maintenance|salaries|property_tax|travel|phone|fuel|gas|delivery|vehicle|cca|other|homeoffice|software",
  "subtotal": number,
  "tip": number or 0,
  "gst": number or 0,
  "hst": number or 0,
  "pst": number or 0,
  "qst": number or 0,
  "liquor_tax": number or 0,
  "total": number,
  "province": "2-letter CA province code",
  "payment_type": "Credit Card|Debit Card|Cash|Cheque|E-Transfer|Other",
  "card_last4": "4 digits or null",
  "card_name": "card network or bank name e.g. Visa, Mastercard, Amex, TD Debit or null",
  "note": "brief 1-line description of what was purchased"
}
Rules: gas receipts → total=full pump amount inc. GST. PST only if explicitly printed on receipt. All numbers as floats, 0 if absent.`;

  async function doScan(dataUrl, mime) {
    try {
      const base64 = dataUrl.split(',')[1];
      const isPdf  = mime === 'application/pdf';

      const fileBlock = isPdf
        ? { type:'document', source:{ type:'base64', media_type:'application/pdf', data:base64 } }
        : { type:'image',    source:{ type:'base64', media_type: mime.startsWith('image/') ? mime : 'image/jpeg', data:base64 } };

      const body = JSON.stringify({
        model: 'claude-sonnet-5-5',
        max_tokens: 800,
        messages: [{ role:'user', content:[ fileBlock, { type:'text', text:PROMPT_TEXT } ] }]
      });

      // API call — use provided API key (works from file://) or browser IPC (works on localhost/claude.ai)
      let res;
      try {
        const headers = { 'Content-Type':'application/json', 'anthropic-version':'2023-06-01' };
        if (apiKey) {
          headers['x-api-key'] = apiKey;
          headers['anthropic-dangerous-direct-browser-access'] = 'true';
        } else {
          headers['anthropic-dangerous-direct-browser-ipc'] = 'true';
        }
        res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST', headers, body
        });
      } catch(fetchErr) {
        throw new Error('Network blocked — add your Anthropic API key via ⚙️ AI Setup button, or open via http://localhost:8080');
      }

      const data = await res.json();
      if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

      const txt    = (data.content?.find(b=>b.type==='text')?.text || '').replace(/```json|```/g,'').trim();
      const parsed = JSON.parse(txt);

      if (parsed.vendor)   setVendor(parsed.vendor);
      if (parsed.date)     setDate(parsed.date);
      if (parsed.category) setCat(parsed.category);
      if (parsed.province) setProv(parsed.province);
      if (parsed.note && !note) setNote(parsed.note);

      // Payment method
      if (parsed.payment_type) setPayType(parsed.payment_type);
      if (parsed.card_last4)   setPayLast4(parsed.card_last4);
      if (parsed.card_name)    setPayName(parsed.card_name);

      const gstV = parsed.gst || parsed.hst || 0;
      const pstV = parsed.pst || parsed.qst || 0;
      const sub  = parsed.subtotal || 0;

      if (parsed.category === 'gas' && parsed.total) {
        setGasTotal(String(parsed.total));
      } else {
        setAmount(String(sub));
        setGst(gstV ? String(gstV) : '');
      }
      if (pstV) { setPst(String(pstV)); setHasPst(true); }
      setTip(parsed.tip    ? String(parsed.tip)       : '');
      setLiquor(parsed.liquor_tax ? String(parsed.liquor_tax) : '');
      setScanning(false);

    } catch(err) {
      console.error('Scan error:', err);
      setScanning(false);
      setScanErr(`Could not auto-read receipt (${err.message||'unknown error'}) — fill in manually below.`);
    }
  }

  useEffect(()=>{ if (startFile) handleFile({target:{files:[startFile], value:''}}); },[]);
  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const isPdf = file.type === 'application/pdf';

    if (isPdf) {
      const reader = new FileReader();
      reader.onload = ev => {
        setReceipt('__PDF__:' + ev.target.result);
        setScanErr('');
        if (apiKey) { setScanning(true); doScan(ev.target.result, 'application/pdf'); }
      };
      reader.readAsDataURL(file);
      return;
    }

    // Compress image before storing — keeps localStorage from filling up
    // Resize to max 1200px wide, 0.75 quality JPEG = ~80% smaller than original
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objectUrl);
      const MAX = 1200;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const compressed = canvas.toDataURL('image/jpeg', 0.75);
      setReceipt(compressed);
      setScanErr('');
      if (apiKey) { setScanning(true); doScan(compressed, 'image/jpeg'); }
      else setScanErr('Tip: add an Anthropic API key in Settings and the form will fill itself in from the photo.');
    };
    img.onerror = () => {
      // Fallback: store original
      const reader = new FileReader();
      reader.onload = ev => { setReceipt(ev.target.result); setScanErr(''); };
      reader.readAsDataURL(file);
    };
    img.src = objectUrl;
  }

  function submit() {
    if(!vendor.trim()){alert('Please enter a vendor name.');return;}
    if(isGas && !(parseFloat(gasTotal)>0)){alert('Please enter the total amount paid at the pump.');return;}
    if(!isGas && !(parseFloat(amount)>0)){alert('Please enter a pre-tax amount.');return;}
    if (!editId && (allExpenses||[]).some(e=>(e.vendor||'').trim().toLowerCase()===vendor.trim().toLowerCase() && e.date===date && Math.abs((e.amount||0)-(parseFloat(amount)||0))<0.005)) {
      if (!window.confirm('You already have an expense for '+vendor.trim()+' on '+date+' for this amount. Add it anyway?')) return;
    }
    const savedTax={gst:parseFloat(gst)||0,pst:parseFloat(pst)||0,hasPst,tip:parseFloat(tip)||0,liquor:parseFloat(liquor)||0,other:0,gasMode:isGas,gasTotal:parseFloat(gasTotal)||0};
    const payment={type:payType,last4:payLast4.trim(),name:payName.trim()};
    const pct = Math.min(100, Math.max(0, parseFloat(bizPct)||100));
    onSave({date,vendor:vendor.trim(),category:cat,amount:parseFloat(amount),province,note:note.trim(),orderNo:orderNo.trim(),receipt,tax:savedTax,payment,bizPct:pct,clients:clientSel}, {repeat, repeatEnd});
  }

  const inp={background:T.bg4,borderColor:T.border,color:T.text};

  return(
    <div className="ov" onClick={onClose}>
      <div className="modal" style={{background:T.bg2,borderColor:T.border,color:T.text}} onClick={e=>e.stopPropagation()}>
        <div className="mhdr">
          <button type="button" className="mcancel" onClick={onClose}>Cancel</button>
          <div className="mttl">{editId?'Edit Expense':'New Expense'}</div>
          <button type="button" className="msave" onClick={submit}>Save</button>
          <button className="mclose mclose-x" style={{borderColor:T.border,color:T.text}} onClick={onClose}>✕</button>
        </div>

        {/* Receipt */}
        <div className="fg">
          <label className="fl">Receipt Photo — AI Auto-Scan</label>
          {scanning?(
            <div className="scan-box" style={{background:'rgba(75,142,245,.08)',borderColor:'rgba(75,142,245,.25)'}}>
              <div className="spin" style={{borderColor:'rgba(75,142,245,.2)',borderTopColor:T.blue}}/>
              <div style={{color:T.blue,fontSize:13,fontWeight:500}}>Scanning receipt with AI…</div>
              <div style={{fontSize:11,opacity:.5,marginTop:3}}>Reading vendor · amounts · GST · PST · tip · payment method…</div>
            </div>
          ):receipt?(
            <div className="rp">
              {receipt.startsWith('__PDF__:')
                ? <PdfPreview src={receipt.slice(8)} width={600} style={{width:'100%',height:220,objectFit:'cover',objectPosition:'top',borderRadius:10,border:`1px solid ${T.border}`,background:'#fff',cursor:'pointer',display:'block'}} onClick={()=>onZoom(receipt.slice(8))} fallback={<div style={{background:T.bg4,borderRadius:10,border:`1px solid ${T.border}`,padding:'20px 16px',textAlign:'center',cursor:'pointer'}} onClick={()=>onZoom(receipt.slice(8))}>
                    <div style={{fontSize:40,marginBottom:8}}>📄</div>
                    <div style={{fontSize:13,fontWeight:500}}>PDF Receipt</div>
                    <div style={{fontSize:11,opacity:.4,marginTop:3}}>Click to open full PDF</div>
                  </div>}/>
                : <img src={viewSrc(receipt)} onError={fbImg(receipt,1600)} referrerPolicy="no-referrer" alt="receipt" style={{borderColor:T.border}} onClick={()=>onZoom(receipt)}/>
              }
              <button className="rp-rm" onClick={()=>{setReceipt(null);setScanErr('');}}>Remove</button>
            </div>
          ):(
            <div className="dz" style={{borderColor:T.border}} onClick={()=>fileRef.current.click()}>
              <input ref={fileRef} type="file" accept="image/*,application/pdf" onChange={handleFile} onClick={e=>e.stopPropagation()}/>
              <div style={{fontSize:30,marginBottom:8}}>📷</div>
              <div style={{fontSize:13,opacity:.6}}>Click or drag receipt photo or PDF</div>
              <div style={{fontSize:11,opacity:.4,marginTop:3}}>Saved as backup for CRA · image is compressed automatically</div>
            </div>
          )}
          {scanErr&&(
            <div style={{marginTop:6,fontSize:12,borderRadius:8,padding:'10px 13px',border:`1px solid rgba(240,160,51,.3)`,background:'rgba(240,160,51,.08)',color:T.amber}}>
              ⚠ {scanErr}
            </div>
          )}
        </div>

        {/* Date + Province */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 60px',gap:4,marginBottom:12}}>
          <div><label className="fl">Date</label><input type="date" style={{background:T.bg4,borderColor:T.border,color:T.text,borderRadius:8,border:'1px solid',width:'100%',padding:'4px 6px',fontSize:13,fontFamily:'inherit',outline:'none',height:34,WebkitAppearance:'none',appearance:'none',lineHeight:'1.2'}} value={date} onChange={e=>setDate(e.target.value)}/></div>
          <div><label className="fl">Prov.</label>
            <select style={{background:T.bg4,borderColor:T.border,color:T.text,borderRadius:8,border:'1px solid',width:'100%',padding:'4px 2px',fontSize:12,fontFamily:'inherit',outline:'none',height:34}} value={province} onChange={e=>setProv(e.target.value)}>
              {PROVS.map(p=><option key={p.code} value={p.code}>{p.code}</option>)}
            </select>
          </div>
        </div>

        {/* Vendor */}
        <div className="fg"><label className="fl">Vendor / Business Name</label>
          <input type="text" list="kbw-vendor-list" autoComplete="off" style={inp} placeholder="e.g. Esso, The Keg, WestJet" value={vendor} onChange={e=>{setVendor(e.target.value);setMemoMsg('');}}/>
          <datalist id="kbw-vendor-list">{vendorOptions.map(n=><option key={n} value={n}/>)}</datalist>
          {!editId && !vendor && (vendors||[]).length>0 && <div className="vchips">{(vendors||[]).map((v,i)=><button type="button" key={i} className="vchip" onClick={()=>{ setVendor(v.name); setMemoMsg(''); if(v.category && cats.some(c=>c.id===v.category)) setCat(v.category); }}>{v.name}</button>)}</div>}
          {memoMsg && <div style={{fontSize:11,color:T.green,marginTop:4}}>✓ {memoMsg}</div>}
        </div>

        {/* Category */}
        <div className="fg"><label className="fl">Category</label>
          <select style={inp} value={cat} onChange={e=>setCat(e.target.value)}>
            {cats.map(c=><option key={c.id} value={c.id}>{c.icon} {c.label} (L{c.line})</option>)}
          </select>
        </div>

        {/* CRA note */}
        <div className="cranote" style={{borderLeftColor:catObj.color,background:T.bg4}}>📋 {catObj.cra}</div>

        {/* GAS MODE: always enter total-inc-GST, auto-splits */}
        {isGas&&(
          <div className="gas-helper" style={{background:'rgba(46,204,138,.08)',borderColor:'rgba(46,204,138,.3)',color:T.green}}>
            <div style={{fontWeight:600,marginBottom:6,display:'flex',alignItems:'center',gap:6}}>⛽ Gas — Enter Your Receipt Total</div>
            <div style={{fontSize:11,opacity:.7,marginBottom:10,color:T.text}}>
              Type the <b>total amount you paid</b> (inc. GST) and the subtotal + GST will be calculated automatically based on your province ({province}, {((PROVS.find(x=>x.code===province)||PROVS[0]).hst ? ((PROVS.find(x=>x.code===province)||PROVS[0]).hstRate*100).toFixed(0) : (PROVS.find(x=>x.code===province)||PROVS[0]).gst*100).toFixed(0)}% tax).
            </div>
            <label className="fl" style={{color:T.text}}>Total Paid (inc. GST) — from your receipt</label>
            <input type="number" inputMode="decimal" step="0.01" placeholder="e.g. 80.00" style={{background:T.bg4,borderColor:'rgba(46,204,138,.4)',color:T.text,borderRadius:8,padding:'9px 12px',fontSize:14,width:'100%',outline:'none'}}
              value={gasTotal} onChange={e=>handleGasTotal(e.target.value)}/>
            {parseFloat(gasTotal)>0&&(
              <div style={{marginTop:10,display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
                {[
                  {lbl:'Pre-Tax Subtotal',val:cad(parseFloat(amount)||0),color:T.text},
                  {lbl:`GST (${(gstRate*100).toFixed(0)}%)`,val:cad(parseFloat(gst)||0),color:T.green},
                  {lbl:'CRA Deductible',val:cad(parseFloat(amount)||0),color:T.blue},
                ].map(x=>(
                  <div key={x.lbl} style={{background:T.bg4,borderRadius:8,padding:'8px 10px',border:`1px solid ${T.border}`}}>
                    <div style={{fontSize:10,fontFamily:"-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif",opacity:.5,marginBottom:3}}>{x.lbl}</div>
                    <div style={{fontSize:14,fontWeight:700,color:x.color}}>{x.val}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* Amount — hidden for gas (handled by total field above) */}
        {!isGas&&(
        <div className="fg">
          <label className="fl">Pre-Tax Subtotal ($) <span style={{opacity:.4,fontWeight:400}}>before GST/PST/tip</span></label>
          <input type="number" inputMode="decimal" step="0.01" placeholder="0.00" style={inp} value={amount} onChange={e=>setAmount(e.target.value)}/>
        </div>
        )}

        {/* Tax fields — GST auto-calculated for gas */}
        <div className="fg">
          <label className="fl">Tax &amp; Extras <span style={{opacity:.4,fontWeight:400}}>{isGas?'optional — PST / other charges only':'all optional — enter only what\'s on your receipt'}</span></label>
          <div className="frow3">
            {!isGas&&<div>
              <label className="fl" style={{fontSize:10}}>GST / HST</label>
              <input type="number" inputMode="decimal" step="0.01" placeholder="0.00" style={inp} value={gst} onChange={e=>setGst(e.target.value)}/>
            </div>}
            {!isGas&&<div>
              <label className="fl" style={{fontSize:10}}>Tip</label>
              <input type="number" inputMode="decimal" step="0.01" placeholder="0.00" style={inp} value={tip} onChange={e=>setTip(e.target.value)}/>
            </div>}
            <div>
              <label className="fl" style={{fontSize:10}}>Liquor / Other Tax</label>
              <input type="number" inputMode="decimal" step="0.01" placeholder="0.00" style={inp} value={liquor} onChange={e=>setLiquor(e.target.value)}/>
            </div>
          </div>
          <label className="pst-row" style={{color:T.text}}>
            <input type="checkbox" checked={hasPst} onChange={e=>setHasPst(e.target.checked)}/>
            PST is shown on this receipt
          </label>
          {hasPst&&<input type="number" inputMode="decimal" step="0.01" placeholder="PST amount" style={{...inp,marginTop:6}} value={pst} onChange={e=>setPst(e.target.value)}/>}
        </div>

        {/* Live breakdown */}
        {bd&&amt>0&&(
          <div className="bkbox" style={{background:T.bg3,borderColor:T.border}}>
            {bd.tip>0&&<>
              <div className="bkrow" style={{borderColor:T.border}}><span className="bklbl">Subtotal</span><span className="bkval">{cad(bd.sub)}</span></div>
              <div className="bkrow" style={{borderColor:T.border}}>
                <span className="bklbl">Tip {isGas?<span style={{color:T.amber,fontSize:11}}>(⚠ not deductible for gas)</span>:''}</span>
                <span className="bkval">{cad(bd.tip)}</span>
              </div>
            </>}
            {bd.liquor>0&&<div className="bkrow" style={{borderColor:T.border}}><span className="bklbl">Liquor / other tax</span><span className="bkval">{cad(bd.liquor)}</span></div>}
            <div className="bkrow" style={{borderColor:T.border}}><span className="bklbl">GST/HST paid</span><span className="bkval">{cad(bd.gstPaid)}</span></div>
            {bd.pstPaid>0&&<div className="bkrow" style={{borderColor:T.border}}><span className="bklbl" style={{color:T.amber}}>PST paid (non-recoverable)</span><span className="bkval" style={{color:T.amber}}>{cad(bd.pstPaid)}</span></div>}
            <div className="bkrow" style={{borderColor:T.border}}><span className="bklbl">Receipt Total</span><span className="bkval">{cad(bd.total)}</span></div>
            <div className="bkrow bkdiv" style={{borderColor:T.border}}><span className="bklbl">✅ GST ITC Claimable</span><span className="bkval" style={{color:T.green}}>{cad(bd.gstClaimable)}</span></div>
            <div className="bkrow" style={{borderColor:T.border}}><span className="bklbl">✅ CRA Deductible (subtotal only)</span><span className="bkval" style={{color:T.blue}}>{cad(bd.deductibleAmount)}</span></div>
            {catObj.df<1&&<div style={{marginTop:7,fontSize:11,color:T.amber}}>⚠ {catObj.label}: only {catObj.df*100}% deductible per CRA</div>}
          </div>
        )}

        {/* Business use % — for gas and vehicle */}
        {(isGas || cat==='vehicle' || cat==='travel') && (
          <div className="fg">
            <label className="fl">Business Use % <span style={{opacity:.4,fontWeight:400}}>CRA allows only the business portion</span></label>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <input type="range" min="0" max="100" step="5"
                style={{flex:1,accentColor:T.green,background:'transparent',border:'none',padding:'4px 0'}}
                value={bizPct} onChange={e=>setBizPct(e.target.value)}/>
              <div style={{background:T.bg4,border:`1px solid ${T.border}`,borderRadius:8,padding:'6px 12px',minWidth:64,textAlign:'center',fontWeight:600,color:T.green,fontSize:15}}>
                {bizPct}%
              </div>
            </div>
            {parseFloat(bizPct)<100&&bd&&amt>0&&(
              <div style={{fontSize:12,color:T.amber,marginTop:6,background:'rgba(240,160,51,.08)',borderRadius:7,padding:'6px 10px',border:`1px solid rgba(240,160,51,.2)`}}>
                ⚠ At {bizPct}% business use: Deductible = {cad(bd.deductibleAmount * (parseFloat(bizPct)/100))} · ITC = {cad(bd.gstClaimable * (parseFloat(bizPct)/100))}
              </div>
            )}
          </div>
        )}

        {/* Payment Method */}
        <div className="fg">
          <label className="fl">Payment Method</label>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
            {['Credit Card','Debit Card','Cash','Cheque','E-Transfer','Other'].map(pt=>(
              <button key={pt} type="button"
                style={{padding:'8px 10px',borderRadius:8,border:`1px solid ${payType===pt?T.blue:T.border}`,background:payType===pt?`rgba(75,142,245,.12)`:T.bg4,color:T.text,fontWeight:payType===pt?600:400,fontSize:13,transition:'all .15s'}}
                onClick={()=>setPayType(pt)}>
                {pt==='Credit Card'?'💳':pt==='Debit Card'?'🏧':pt==='Cash'?'💵':pt==='Cheque'?'📝':pt==='E-Transfer'?'📲':'•'} {pt}
              </button>
            ))}
          </div>
          {(payType==='Credit Card'||payType==='Debit Card')&&<CardPicker payType={payType} payName={payName} payLast4={payLast4} setPayType={setPayType} setPayName={setPayName} setPayLast4={setPayLast4} T={T} inp={inp}/>}
          {(payType==='Credit Card'||payType==='Debit Card')&&(
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              <div>
                <label className="fl" style={{fontSize:10}}>Card Name <span style={{opacity:.5,fontWeight:400}}>(e.g. Amex, Visa)</span></label>
                <input type="text" style={inp} placeholder="e.g. Amex, TD Visa" value={payName} onChange={e=>setPayName(e.target.value)}/>
              </div>
              <div>
                <label className="fl" style={{fontSize:10}}>Last 4 Digits</label>
                <input type="text" style={inp} placeholder="e.g. 3405" maxLength={4} value={payLast4} onChange={e=>setPayLast4(e.target.value.replace(/\D/g,''))}/>
              </div>
            </div>
          )}
        </div>

        {/* Clients */}
        <div className="fg">
          <label className="fl">Client / met with <span style={{opacity:.5,fontWeight:400}}>(optional)</span></label>
          {(clients||[]).length===0
            ? <div style={{fontSize:12,opacity:.5}}>Add your clients in Settings to tag expenses to them.</div>
            : <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                {(clients||[]).map(c=>{ const on=clientSel.includes(c); return (
                  <button key={c} type="button" onClick={()=>setClientSel(on?clientSel.filter(x=>x!==c):[...clientSel,c])}
                    style={{padding:'6px 12px',borderRadius:999,border:`1px solid ${on?T.blue:T.border}`,background:on?'rgba(10,132,255,.18)':T.bg4,color:T.text,fontSize:13,fontWeight:on?600:400}}>{on?'✓ ':''}{c}</button>); })}
              </div>}
        </div>

        {/* Repeat monthly */}
        {!editId && (
          <label style={{display:'flex',alignItems:'center',gap:10,fontSize:13,margin:'4px 0 14px',cursor:'pointer'}}>
            <input type="checkbox" checked={repeat} onChange={e=>setRepeat(e.target.checked)} style={{width:18,height:18,flexShrink:0}}/>
            <span>🔁 Repeat monthly <span style={{opacity:.5}}>(adds this expense on the same day each month)</span></span>
          </label>
        )}
        {!editId && repeat && (
          <div className="fg" style={{margin:'-6px 0 14px'}}>
            <label className="fl">Stop repeating after <span style={{opacity:.4,fontWeight:400}}>optional · leave empty to keep going</span></label>
            <input type="date" style={inp} value={repeatEnd} min={date} onChange={e=>setRepeatEnd(e.target.value)}/>
            <div style={{fontSize:11,opacity:.5,marginTop:5}}>The date above can be in the past, e.g. Jan 19. Every month from then up to today (or your stop date) is added automatically.</div>
          </div>
        )}

        {/* Note */}
        <div className="fg">
          <label className="fl">Business Purpose <span style={{opacity:.4,fontWeight:400}}>CRA requires this for audits</span></label>
          <textarea rows={2} style={inp} placeholder="Who, what, why — e.g. 'Client lunch with ABC Corp to discuss Q2 campaign'" value={note} onChange={e=>setNote(e.target.value)}/>
          <label className="fl" style={{marginTop:12}}>Order / reference # <span style={{opacity:.4,fontWeight:400}}>optional · invoice, order or confirmation number</span></label>
          <input style={inp} placeholder="e.g. #A123-4567 or INV-0042" value={orderNo} onChange={e=>setOrderNo(e.target.value)} autoComplete="off"/>
        </div>

        <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:6}}>
          <button style={{background:T.bg4,border:`1px solid ${T.border}`,color:T.text,padding:'9px 17px',borderRadius:9}} onClick={onClose}>Cancel</button>
          <button style={{background:T.accent,color:'#fff',padding:'9px 19px',borderRadius:9,fontWeight:600}} onClick={submit}>{editId?'Save Changes':'Add Expense'}</button>
        </div>
      </div>
    </div>
  );
}

// ─── DETAIL MODAL ─────────────────────────────────────────────────────────────
function DetailModal({expense,cats,province,T,getCat,calcBD,inline,onClose,onZoom,onEdit,onDelete}) {
  const e=expense, c=getCat(e.category);
  const bd=calcBD(e.amount,e.province||province,e.category,e.tax,cats);
  const pct=(e.bizPct!=null?e.bizPct:100)/100;
  const adjITC=+(bd.gstClaimable*pct).toFixed(2);
  const adjDed=+(bd.deductibleAmount*pct).toFixed(2);
  const pay=e.payment;
  const payLabel = pay?.type
    ? [pay.name, pay.type, pay.last4?`···· ${pay.last4}`:''].filter(Boolean).join(' ')
    : null;
  const isPdf = e.receipt?.startsWith('__PDF__:');
  const card = inline ? T.bg2 : T.bg4;
  const R = (l, v, o={}) => <div className="grow"><span className="gl" style={{color:o.lc}}>{l}</span><span className="gv" style={{color:o.c,fontWeight:o.b?700:500}}>{v}</span></div>;
  const body = (
    <div className="dbody">
      <div className="dhead">
        <div style={{minWidth:0}}>
          <div className="dmeta">{e.date} · <i className="cdot" style={{background:c.color}}/> {c.label}</div>
          <div className="dttl">{e.vendor}</div>
        </div>
        <div className="damt">{cad(e.amount)}</div>
      </div>
      {e.receipt&&(()=>{
        const open=()=>onZoom(isPdf?e.receipt.slice(8):e.receipt);
        const big=isPdf
          ? <PdfPreview src={e.receipt.slice(8)} width={720} style={{width:'100%',height:190,objectFit:'cover',objectPosition:'top',borderRadius:12,background:'#fff',cursor:'pointer',display:'block'}} onClick={open} fallback={<div style={{background:T.bg4,borderRadius:12,padding:'18px',textAlign:'center',cursor:'pointer'}} onClick={open}><div style={{display:'flex',justifyContent:'center',marginBottom:6}}><Ic n="file" s={34}/></div><div style={{fontSize:13,fontWeight:500}}>PDF receipt, tap to open</div></div>}/>
          : <img src={viewSrc(e.receipt)} onError={fbImg(e.receipt,1600)} referrerPolicy="no-referrer" alt="receipt" style={{borderColor:T.border,width:'100%',height:190,objectFit:'cover',objectPosition:'top',borderRadius:12,cursor:'zoom-in',display:'block'}} onClick={open}/>;
        const thumb=isPdf
          ? <PdfPreview src={e.receipt.slice(8)} width={160} className="rrthumb" style={{objectFit:'cover',objectPosition:'top left',background:'#fff'}} fallback={<div className="rrthumb" style={{background:T.bg4,display:'flex',alignItems:'center',justifyContent:'center'}}><Ic n="file" s={22}/></div>}/>
          : <img className="rrthumb" src={thumbSrc(e.receipt)} onError={fbImg(e.receipt,160)} referrerPolicy="no-referrer" alt="" style={{objectFit:'cover',objectPosition:'top'}}/>;
        return inline
          ? <div className="rp">{big}</div>
          : <div className="grp rrow" style={{background:card}} onClick={open}>{thumb}<div style={{flex:1,minWidth:0}}><div style={{fontSize:16,fontWeight:500}}>Receipt</div><div style={{fontSize:13,opacity:.6}}>{isPdf?'PDF':'Photo'} · tap to view</div></div><span style={{opacity:.45,display:'flex'}}><Ic n="right" s={16}/></span></div>;
      })()}
      <div className="grp" style={{background:card}}>
        {R('Pre-tax subtotal', cad(bd.sub))}
        {bd.tip>0 && R('Tip', cad(bd.tip))}
        {bd.liquor>0 && R('Liquor / other tax', cad(bd.liquor))}
        {R('GST/HST paid', cad(bd.gstPaid))}
        {bd.pstPaid>0 && R('PST paid', cad(bd.pstPaid), {lc:T.amber, c:T.amber})}
        {R('Receipt total', cad(bd.total), {b:true})}
      </div>
      <div className="grp" style={{background:card}}>
        {R('GST ITC claimable'+(pct<1?` (${e.bizPct}%)`:''), cad(adjITC), {c:T.green, b:true})}
        {R('CRA deductible'+(pct<1?` (${e.bizPct}%)`:''), cad(adjDed), {c:T.blue, b:true})}
      </div>
      <div className="grp" style={{background:card}}>
        {R('Category', c.icon+' '+c.label)}
        {R('T2125 line', c.line)}
        {R('Province', e.province||province)}
        {payLabel && R('Payment', payLabel)}
        {e.bizPct!=null&&e.bizPct!==100 && R('Business use', e.bizPct+'%', {c:T.green})}
        {e.clients&&e.clients.length>0 && R('Clients', e.clients.join(', '))}
        {e.recurId && R('Repeats', 'Every month')}
      </div>
      {!e.receipt&&e.noReceipt&&<div className="grp" style={{background:card,padding:'10px 16px',fontSize:14}}><span style={{fontSize:12,opacity:.55,display:'block',marginBottom:2}}>Receipt not available</span>{e.noReceipt}</div>}
      {e.orderNo&&<div className="grp" style={{background:card,padding:'10px 16px',fontSize:14}}><span style={{fontSize:12,opacity:.55,display:'block',marginBottom:2}}>Order / reference #</span>{e.orderNo}</div>}
      {e.note&&<div className="grp" style={{background:card,padding:'10px 16px',fontSize:14}}><span style={{fontSize:12,opacity:.55,display:'block',marginBottom:2}}>Business purpose</span>{e.note}</div>}
      {(onEdit||onDelete) && <div className="dact">
        {onEdit&&<button type="button" className="pbtn primary" onClick={()=>onEdit(e.id)}>Edit</button>}
        {onDelete&&<button type="button" className="pbtn ghost" style={{color:T.red}} onClick={()=>onDelete(e.id)}>Delete</button>}
      </div>}
    </div>
  );
  if (inline) return body;
  return(
    <div className="ov" onClick={onClose}>
      <div className="modal modal-sm" style={{background:T.bg,borderColor:T.border,color:T.text}} onClick={ev=>ev.stopPropagation()}>
        <div className="mhdr" style={{marginBottom:4,justifyContent:'flex-end'}}>
          <button className="mclose" style={{borderColor:T.border,color:T.text}} onClick={onClose} aria-label="Close">✕</button>
        </div>
        {body}
      </div>
    </div>
  );
}

// ─── THEME MODAL ──────────────────────────────────────────────────────────────
function ThemeModal({theme,auto:autoInit,onSave,onClose}) {
  const [t,setT]=useState({...theme});
  const [auto,setAuto]=useState(!!autoInit);
  const inp={background:t.bg4,borderColor:t.border,color:t.text};
  const setF=k=>v=>setT(x=>({...x,[k]:v}));
  return(
    <div className="ov" onClick={onClose}>
      <div className="modal modal-lg" style={{background:t.bg2,borderColor:t.border,color:t.text}} onClick={e=>e.stopPropagation()}>
        <div className="mhdr"><div className="mttl">🎨 Theme Customisation</div><button className="mclose" style={{borderColor:t.border,color:t.text}} onClick={onClose}>✕</button></div>

        {/* Mode quick-switch */}
        <div className="fg">
          <label className="fl">Base Mode <span style={{opacity:.5,fontWeight:400}}>(Auto follows this device's light or dark setting)</span></label>

function fileToReceipt(file){
  return new Promise((res,rej)=>{
    if (file.type==='application/pdf') { const r=new FileReader(); r.onload=e=>res('__PDF__:'+e.target.result); r.onerror=rej; r.readAsDataURL(file); return; }
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ URL.revokeObjectURL(url); const MAX=1200; let w=img.width,h=img.height; if(w>MAX){h=Math.round(h*MAX/w);w=MAX;} if(h>MAX){w=Math.round(w*MAX/h);h=MAX;} const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg',0.75)); };
    img.onerror=()=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsDataURL(file); };
    img.src=url;
  });
}

// ─── RECEIPT CATCH-UP QUEUE ───────────────────────────────────────────────────
function ReceiptReview({expenses, getCat, T, onAttach, onMark, onEdit, onClose}) {
  const [over30,setOver30]=useState(true);
  const [skipped,setSkipped]=useState([]);
  const [marking,setMarking]=useState(false);
  const [reason,setReason]=useState('');
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');
  const fileRef=useRef();
  const pending = expenses.filter(e=>!e.receipt && !e.noReceipt && (!over30 || e.amount>=30)).sort((a,b)=>b.date.localeCompare(a.date));
  const order = [...pending.filter(e=>!skipped.includes(e.id)), ...pending.filter(e=>skipped.includes(e.id))];
  const cur = order[0];
  useEffect(()=>{ setMarking(false); setReason(''); setErr(''); },[cur&&cur.id]);
  const c = cur ? getCat(cur.category) : null;
  const pay = cur && cur.payment && cur.payment.type ? [cur.payment.name||cur.payment.type, cur.payment.last4?`···· ${cur.payment.last4}`:''].filter(Boolean).join(' ') : '';
  const reasons = ['Card statement is the record','Vendor cannot provide one','Lost or not available'];
  async function pick(e){
    const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f||!cur) return;
    setBusy(true); setErr('');
    try { const r=await fileToReceipt(f); onAttach(cur.id, r); } catch { setErr('Could not read that file. Try another.'); }
    setBusy(false);
  }
  const btn = {height:46,borderRadius:12,border:'none',fontSize:16,fontWeight:600,cursor:'pointer',width:'100%'};
  return (
    <div className="ov" onClick={onClose}>
      <div className="modal modal-sm" style={{background:T.bg2,borderColor:T.border,color:T.text}} onClick={e=>e.stopPropagation()}>
        <div className="mhdr"><div className="mttl">Receipt catch-up</div><button className="mclose" style={{borderColor:T.border,color:T.text}} onClick={onClose}>✕</button></div>
        <input ref={fileRef} type="file" accept="image/*,application/pdf" style={{display:'none'}} onChange={pick}/>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',fontSize:13,marginBottom:12}}>
          <span style={{opacity:.65}}>{pending.length} left</span>
          <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',opacity:.8}}><input type="checkbox" checked={over30} onChange={e=>setOver30(e.target.checked)} style={{width:16,height:16}}/> Only over $30</label>
        </div>
        {!cur ? (
          <div style={{textAlign:'center',padding:'36px 8px'}}>
            <div style={{fontSize:40,marginBottom:8}}>✅</div>
            <div style={{fontSize:17,fontWeight:600,marginBottom:4}}>All caught up</div>
            <div style={{fontSize:13,opacity:.6}}>{over30?'Every expense over $30 has a receipt or a reason.':'Every expense has a receipt or a reason.'}</div>
            <button style={{...btn,marginTop:20,background:T.accent,color:'#fff'}} onClick={onClose}>Done</button>
          </div>
        ) : (<>
          <div style={{background:T.bg3,borderRadius:14,padding:'16px 18px',marginBottom:14}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',gap:10}}>
              <div style={{fontSize:20,fontWeight:700,minWidth:0,overflow:'hidden',textOverflow:'ellipsis'}}>{cur.vendor}</div>
              <div style={{fontSize:20,fontWeight:700}}>{cad(cur.amount)}</div>
            </div>
            <div style={{fontSize:13,opacity:.65,marginTop:4}}>{cur.date} · {c.label}{pay?` · ${pay}`:''}</div>
            {cur.note && <div style={{fontSize:13,opacity:.55,marginTop:6}}>{cur.note}</div>}
            {cur.orderNo && <div style={{fontSize:12,opacity:.55,marginTop:4}}>Order # {cur.orderNo}</div>}
          </div>
          {err && <div style={{color:T.red,fontSize:13,marginBottom:8}}>{err}</div>}
          {!marking ? (
            <div style={{display:'grid',gap:10}}>
              <button style={{...btn,background:T.accent,color:'#fff',opacity:busy?.6:1}} disabled={busy} onClick={()=>fileRef.current&&fileRef.current.click()}>{busy?'Adding…':'Attach receipt (photo or PDF)'}</button>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                <button style={{...btn,height:42,fontSize:14,background:T.bg4,color:T.text}} onClick={()=>setSkipped(sk=>[...sk.filter(x=>x!==cur.id),cur.id])}>Skip for now</button>
                <button style={{...btn,height:42,fontSize:14,background:T.bg4,color:T.text}} onClick={()=>setMarking(true)}>No receipt available</button>
              </div>
              <button style={{background:'none',border:'none',color:T.accent,fontSize:13,cursor:'pointer',padding:4}} onClick={()=>onEdit(cur.id)}>Edit this expense</button>
            </div>
          ) : (
            <div>
              <div style={{fontSize:13,opacity:.65,marginBottom:8}}>Why is there no receipt? This is saved on the expense so you can explain it later.</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:10}}>
                {reasons.map(r=><button key={r} type="button" className="vchip" style={reason===r?{background:T.accent,color:'#fff'}:undefined} onClick={()=>setReason(r)}>{r}</button>)}
              </div>
              <input type="text" style={{background:T.bg4,borderColor:T.border,color:T.text,borderRadius:10,padding:'10px 12px',fontSize:15,width:'100%',marginBottom:10}} placeholder="Or type a reason" value={reason} onChange={e=>setReason(e.target.value)}/>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                <button style={{...btn,height:42,fontSize:14,background:T.bg4,color:T.text}} onClick={()=>setMarking(false)}>Back</button>
                <button style={{...btn,height:42,fontSize:14,background:T.accent,color:'#fff',opacity:reason.trim()?1:.5}} disabled={!reason.trim()} onClick={()=>onMark(cur.id, reason.trim())}>Save reason</button>
              </div>
            </div>
          )}
        </>)}
      </div>
    </div>
  );
}

// ─── RESTORE A PREVIOUS VERSION ───────────────────────────────────────────────
function RestoreModal({expenses, cats, T, listVersions, loadVersion, onApply, onClose}) {
  const [versions,setVersions]=useState(null);
  const [err,setErr]=useState('');
  const [sel,setSel]=useState(null);
  const [prev,setPrev]=useState(null);
  const [busy,setBusy]=useState(false);
  useEffect(()=>{ listVersions().then(setVersions).catch(e=>setErr(e.message||'Could not load history')); },[]);
  const catLabel = id => (cats.find(c=>c.id===id)||{}).label || id;
  const fmt = d => new Date(d).toLocaleString('en-CA',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  async function choose(v){
    setSel(v.sha); setPrev(null); setErr(''); setBusy(true);
    try {
      const d = await loadVersion(v.sha);
      const vex = Array.isArray(d.expenses) ? d.expenses : [];
      const cur = new Map(expenses.map(e=>[e.id,e])), vm = new Map(vex.map(e=>[e.id,e]));
      const added = vex.filter(e=>!cur.has(e.id));
      const removed = expenses.filter(e=>!vm.has(e.id));
      const changed = [], fieldN = {};
      vex.forEach(e=>{ const c=cur.get(e.id); if(!c) return;
        const ks=new Set([...Object.keys(e),...Object.keys(c)]); ks.delete('receipt');
        const f=[...ks].filter(k=>JSON.stringify(e[k])!==JSON.stringify(c[k]));
        if(f.length){ changed.push({e,c,f}); f.forEach(k=>fieldN[k]=(fieldN[k]||0)+1); } });
      setPrev({list:vex, date:v.date, added, removed, changed, fieldN});
    } catch { setErr('Could not load that version.'); }
    setBusy(false);
  }
  const noDiff = prev && !prev.added.length && !prev.removed.length && !prev.changed.length;
  return (
    <div className="ov" onClick={onClose}>
      <div className="modal" style={{background:T.bg2,borderColor:T.border,color:T.text}} onClick={e=>e.stopPropagation()}>
        <div className="mhdr"><div className="mttl">Restore a previous version</div><button className="mclose" style={{borderColor:T.border,color:T.text}} onClick={onClose}>✕</button></div>
        <div style={{fontSize:13,opacity:.6,marginBottom:12}}>Every save is kept. Pick a moment, check what would change, then restore. Your current version stays in history too.</div>
        {err && <div style={{color:T.red,fontSize:13,marginBottom:10}}>{err}</div>}
        {!versions && !err && <div style={{opacity:.6,fontSize:14,padding:'12px 0'}}>Loading history…</div>}
        {versions && (
          <div style={{maxHeight:220,overflowY:'auto',background:T.bg3,borderRadius:12,marginBottom:14}}>
            {versions.map((v,i)=>(
              <button key={v.sha} type="button" onClick={()=>choose(v)} style={{display:'flex',justifyContent:'space-between',alignItems:'center',width:'100%',textAlign:'left',padding:'11px 14px',background:sel===v.sha?T.accent+'33':'transparent',border:'none',borderBottom:`.5px solid ${T.border}`,color:T.text,fontSize:14,cursor:'pointer'}}>
                <span>{fmt(v.date)}</span>
                <span style={{fontSize:12,opacity:.55,marginLeft:10,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{i===0?'Current':(/^Update expenses/.test(v.msg)?'':v.msg)}</span>
              </button>
            ))}
          </div>
        )}
        {busy && <div style={{opacity:.6,fontSize:14,marginBottom:10}}>Comparing…</div>}
        {prev && !busy && (
          <div style={{background:T.bg3,borderRadius:12,padding:'14px 16px',marginBottom:14,fontSize:14}}>
            <div style={{fontWeight:600,marginBottom:8}}>{noDiff?'Same as your current version':`Restoring ${fmt(prev.date)} would:`}</div>
            {prev.changed.length>0 && <div style={{marginBottom:6}}>Change {prev.changed.length} expense{prev.changed.length!==1?'s':''} ({Object.entries(prev.fieldN).map(([k,n])=>`${k} ×${n}`).join(', ')})</div>}
            {prev.added.length>0 && <div style={{marginBottom:6}}>Bring back {prev.added.length} deleted expense{prev.added.length!==1?'s':''}</div>}
            {prev.removed.length>0 && <div style={{marginBottom:6,color:T.amber}}>Remove {prev.removed.length} expense{prev.removed.length!==1?'s':''} added since then</div>}
            {prev.changed.slice(0,5).map(({e,c,f})=>(

const INV_DEF = {name:'',addr:'',phone:'',gstNo:'',gstRate:5,notes:'',startNum:1,customers:[],
  recur:{on:false,customer:'',desc:'',amount:'',days:[1,15],since:'',skip:[]}};
const JSPDF_URL='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
function loadJsPdf(){
  if (window.jspdf) return Promise.resolve(window.jspdf);
  return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=JSPDF_URL; s.onload=()=>res(window.jspdf); s.onerror=()=>rej(new Error('Could not load the PDF tool. Check your connection.')); document.head.appendChild(s); });
}
const invSub = i => (i.items||[]).reduce((s,x)=>s+(+x.amount||0),0);
const invGst = i => (i.gst!=null && !isNaN(+i.gst)) ? +(+i.gst).toFixed(2) : +(invSub(i)*((+i.gstRate||0)/100)).toFixed(2);
const invTot = i => +(invSub(i)+invGst(i)).toFixed(2);
const invStatus = i => i.paid ? 'Paid' : (!i.sent ? 'Draft' : ((i.due||i.date) < localToday() ? 'Overdue' : 'Unpaid'));
const longDate = d => { try { const [y,m,dd]=d.split('-').map(Number); return new Date(y,m-1,dd).toLocaleDateString('en-CA',{year:'numeric',month:'long',day:'numeric'}); } catch { return d||''; } };
const invFile = i => `Invoice_${i.num}_${i.date}.pdf`;

async function makeInvoicePdf(inv, prof, logoImg) {
  const {jsPDF} = await loadJsPdf();
  const cust = (prof.customers||[]).find(c=>c.name===inv.customer) || {name:inv.customer};
  const d = new jsPDF({unit:'pt',format:'letter'});
  const W=612, H=792, L=22, R=590;
  const sub=invSub(inv), gst=invGst(inv), tot=invTot(inv), due = inv.paid ? 0 : tot;
  const col=(r,g,b)=>d.setTextColor(r,g,b);
  const txt=(t,x,y,o={})=>{ d.setFont('helvetica',o.b?'bold':'normal'); d.setFontSize(o.s||9.5); if(o.c) col(...o.c); else col(40,40,40); d.text(String(t),x,y,{align:o.a||'left'}); };
  const GR=[120,120,120], MUTE=[130,130,130];
  // header band
  d.setFillColor(122,122,122); d.rect(0,0,400,124,'F');
  d.setFillColor(96,96,96); d.rect(400,0,W-400,124,'F');
  txt('INVOICE',L,70,{s:22,c:[255,255,255]});
  txt('Amount Due (CAD)',506,54,{s:9.5,a:'center',c:[255,255,255]});
  txt(cad(due),506,82,{s:22,a:'center',c:[255,255,255]});
  // bill to
  let y=160; txt('BILL TO',L,y,{s:8.5,c:MUTE}); y+=13;
  txt(cust.name||'',L,y,{b:1}); y+=12.5;
  const addr=String(cust.addr||'').split('\n').filter(Boolean);
  [cust.contact,...addr].filter(Boolean).forEach(l=>{ txt(l,L,y); y+=12.5; });
  if(cust.phone||cust.email){ y+=10; [cust.phone,cust.email].filter(Boolean).forEach(l=>{ txt(l,L,y); y+=12.5; }); }
  // meta
  const meta=[['Invoice Number:',String(inv.num),0],['Invoice Date:',longDate(inv.date),0],['Payment Due:',longDate(inv.due||inv.date),0],['Amount Due (CAD):',cad(due),1]];
  let my=148; meta.forEach(([k,v,bv])=>{ txt(k,462,my,{a:'right',b:1}); txt(v,470,my,{b:bv}); my+=17; });
  y=Math.max(y,my)+22;
  // services header
  txt('SERVICES',L,y,{s:8.5,c:MUTE}); txt('AMOUNT',R,y,{s:8.5,a:'right',c:MUTE}); y+=8;
  d.setDrawColor(220,222,224); d.setLineWidth(.8); d.line(L,y,R,y); y+=2;
  (inv.items||[]).forEach(it=>{
    const lines=d.splitTextToSize(String(it.desc||''),400); const h=Math.max(1,lines.length)*12.5+14;
    d.setFillColor(243,245,245); d.rect(L-14,y,R-L+28,h,'F');
    d.setDrawColor(200,206,210); d.setLineWidth(1); d.line(L-14,y,R+14,y); d.line(L-14,y+h,R+14,y+h);
    lines.forEach((l,k)=>txt(l,L,y+16+k*12.5,{b:1})); txt(cad(it.amount),R,y+16,{a:'right'});
    y+=h;
  });
  y+=22;
  const row=(k,v,b)=>{ txt(k,478,y,{a:'right',b}); txt(v,R,y,{a:'right',b:b&&k==='Amount Due (CAD):'}); y+=19; };
  const rule=()=>{ d.setDrawColor(215,218,220); d.setLineWidth(1); d.line(232,y-8,R,y-8); y+=8; };
  row('Subtotal:',cad(sub),1);
  if (+inv.gstRate>0) row(`GST ${inv.gstRate}%${prof.gstNo?' ('+prof.gstNo+')':''}:`,cad(gst));
  rule(); row('Total:',cad(tot),1);
  if (inv.paid) row(`Payment on ${longDate(inv.paid)} using ${inv.method==='e-transfer'||!inv.method?'a bank payment':inv.method}:`,cad(tot));
  rule(); row('Amount Due (CAD):',cad(due),1);
  // notes
  if (inv.notes) {
    y+=26; txt('Notes / Terms',L,y,{b:1,s:9}); y+=14;
    String(inv.notes).split('\n').forEach(p=>{ d.splitTextToSize(p,R-L).forEach(l=>{ txt(l,L,y,{s:9}); y+=12.5; }); });
  }
  // footer
  const fy=640; d.setDrawColor(225,227,229); d.setLineWidth(1); d.line(0,fy,W,fy);
  if (logoImg) { try { const fmt=/^data:image\/(png|jpe?g)/i.exec(logoImg); d.addImage(logoImg,fmt?fmt[1].toUpperCase().replace('JPG','JPEG'):'PNG',46,fy+22,48,48); } catch(e){} }
  let fyy=fy+36; txt(prof.name||'',216,fyy,{b:1,s:9.5}); fyy+=12.5;
  String(prof.addr||'').split('\n').filter(Boolean).forEach(l=>{ txt(l,216,fyy,{s:9.5}); fyy+=12.5; });
  txt('Contact Information',R,fy+36,{b:1,s:9.5,a:'right'}); txt(prof.phone||'',R,fy+48.5,{s:9.5,a:'right'});
  d.line(0,fy+104,W,fy+104);
  return d.output('blob');
}

  const num={fontFamily:"-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif"};
  const P = {...INV_DEF,...prof,recur:{...INV_DEF.recur,...(prof.recur||{})}};

  const nextNum = ()=>{ const ns=invoices.map(i=>parseInt(i.num,10)).filter(n=>!isNaN(n)); return String(ns.length?Math.max(...ns)+1:(+P.startNum||1)); };

  // Monthly recurring: make drafts for the 1st / 15th (or your days) that have come due
  useEffect(()=>{
    const r=P.recur; if(!r.on||!r.since||!r.customer) return;
    const today=localToday(), made=[]; let n=parseInt(nextNum(),10);
    const [sy,sm]=r.since.split('-').map(Number); const now=new Date();
    let y=sy, m=sm, guard=0;
    while((y<now.getFullYear()||(y===now.getFullYear()&&m<=now.getMonth()+1)) && guard++<36){
      (r.days||[1,15]).forEach(dd=>{
        const dim=new Date(y,m,0).getDate(); const day=Math.min(+dd,dim);
        const ds=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        if(ds>=r.since && ds<=today && !invoices.some(i=>i.rk===ds) && !(r.skip||[]).includes(ds)){
          made.push({id:Date.now()+made.length,num:String(n++),date:ds,due:ds,customer:r.customer,items:[{desc:r.desc||'Services',amount:+r.amount||0}],gstRate:+P.gstRate||0,notes:P.notes||'',rk:ds});
        }
      });
      m++; if(m>12){m=1;y++;}
    }
    if(made.length) setInvoices(p=>[...p,...made]);
  },[JSON.stringify(P.recur),invoices.length,P.customers.length]);

  const yInv = invoices.filter(i=>i.date.startsWith(year)).sort((a,b)=>b.date.localeCompare(a.date)||(parseInt(b.num)||0)-(parseInt(a.num)||0));
  const years=[...new Set([thisYear,...invoices.map(i=>i.date.slice(0,4))])].sort().reverse();
  const inPeriod = d => { if(!d.startsWith(year)) return false; if(period==='year') return true; const m=+d.slice(5,7); const q=Math.ceil(m/3); return period==='q'+q; };
  const pInv = invoices.filter(i=>inPeriod(i.date) && (i.sent||i.paid));
  const billed = pInv.reduce((s,i)=>s+invSub(i),0);
  const gstC   = pInv.reduce((s,i)=>s+invGst(i),0);
  const unpaid = invoices.filter(i=>!i.paid && i.sent).reduce((s,i)=>s+invTot(i),0);
  const itc = useMemo(()=>expenses.filter(e=>inPeriod(e.date)).reduce((s,e)=>{ const bd=calcBD(e.amount,e.province||province,e.category,e.tax,cats); return s+bd.gstClaimable*((e.bizPct!=null?e.bizPct:100)/100); },0),[expenses,year,period,province,cats]);
  const net = gstC-itc;
  const drafts = yInv.filter(i=>invStatus(i)==='Draft').length;

  const upd = (id,patch)=>setInvoices(p=>p.map(i=>i.id===id?{...i,...patch}:i));
  const newInvoice = ()=>{
    if(!P.customers.length){ setShowSet(true); setMsg('Add your details and a client first.'); return; }
    setEdit({id:Date.now(),num:nextNum(),date:localToday(),due:localToday(),customer:P.customers[0].name,items:[{desc:'',amount:''}],gstRate:+P.gstRate||0,notes:P.notes||'',_new:true});
  };
  function saveEdit(){
    const i={...edit,items:edit.items.filter(x=>x.desc||+x.amount).map(x=>({desc:x.desc,amount:+x.amount||0}))};
    if(!i.items.length){ setMsg('Add at least one line item.'); return; }
    if(invoices.some(x=>x.num===i.num && x.id!==i.id)){ setMsg('Invoice number '+i.num+' is already used.'); return; }
    delete i._new; delete i.gst; setInvoices(p=>p.some(x=>x.id===i.id)?p.map(x=>x.id===i.id?i:x):[...p,i]); setEdit(null); setMsg('');
  }
  function delInvoice(i){
    if(!window.confirm('Delete invoice '+i.num+'? This cannot be undone here.')) return;
    setInvoices(p=>p.filter(x=>x.id!==i.id));
    if(i.rk) setProf({...P,recur:{...P.recur,skip:[...(P.recur.skip||[]),i.rk]}});
    setEdit(null);
  }
  const markPaid = i=>{ const d=window.prompt('Date paid (YYYY-MM-DD)',localToday()); if(d && /^\d{4}-\d{2}-\d{2}$/.test(d)) upd(i.id,{paid:d,sent:true,method:i.method||'e-transfer'}); };
  async function pdfOf(i){ setBusy(i.id); setMsg(''); try{ return await makeInvoicePdf(i,P,logoImg); } catch(e){ setMsg(e.message||'PDF failed'); return null; } finally{ setBusy(''); } }
  function saveBlob(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500); }
  async function download(i){ const b=await pdfOf(i); if(b) saveBlob(b,invFile(i)); }
  async function send(i){
    const b=await pdfOf(i); if(!b) return;
    const c=P.customers.find(x=>x.name===i.customer)||{};
    const subject=`Invoice ${i.num} from ${P.name||'me'}`;
    const first=(c.contact||'').split(' ')[0]||'there';
    const body=`Hi ${first},\n\nPlease find invoice ${i.num} attached for ${cad(invTot(i))}, due ${longDate(i.due||i.date)}.\n\n${(P.notes||'').split('\n')[0]}\n\nThanks,\n${P.name||''}`;
    const file=new File([b],invFile(i),{type:'application/pdf'});
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:subject,text:body}); }
      else { saveBlob(b,invFile(i)); window.location.href=`mailto:${encodeURIComponent(c.email||'')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`; }
      upd(i.id,{sent:true});
    }catch(e){ if(e&&e.name!=='AbortError') setMsg('Could not open the share sheet. Use Download instead.'); }
  }
  function exportCSV(){
    const rows=[['Number','Date','Due','Customer','Status','Subtotal','GST','Total','Paid date'],...yInv.slice().reverse().map(i=>[i.num,i.date,i.due||'',i.customer,invStatus(i),invSub(i).toFixed(2),invGst(i).toFixed(2),invTot(i).toFixed(2),i.paid||''])];
    dl('Invoices_'+year+'.csv','text/csv',rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'));
  }
  function importCSV(file){
    const rd=new FileReader(); rd.onload=()=>{
      try{
        const lines=String(rd.result).replace(/\r/g,'').split('\n').filter(l=>l.trim());
        const parse=l=>{ const o=[]; let c='',q=false; for(const ch of l){ if(ch==='"') q=!q; else if(ch===','&&!q){o.push(c);c='';} else c+=ch; } o.push(c); return o.map(s=>s.trim()); };
        const h=parse(lines[0]).map(s=>s.toLowerCase());
        const ix=(...k)=>h.findIndex(x=>k.some(y=>x.includes(y)));
        const iN=ix('number','invoice #','invoice no'), iD=ix('invoice date','date'), iC=ix('customer','client','bill'), iT=ix('total','amount'), iS=ix('subtotal'), iX=ix('tax','gst');
        if(iN<0||iD<0||iT<0) throw new Error('Need columns for invoice number, date and total.');
        const have=new Set(invoices.map(i=>i.num)); const out=[]; const rate=+P.gstRate||5;
        lines.slice(1).forEach((l,k)=>{
          const c=parse(l); const nm=c[iN]; const dt=(c[iD]||'').slice(0,10); const tot=parseFloat((c[iT]||'').replace(/[^0-9.\-]/g,''));
          if(!nm||have.has(nm)||!/^\d{4}-\d{2}-\d{2}$/.test(dt)||isNaN(tot)) return;
          let sub,gr,gx; const sv=iS>=0?parseFloat((c[iS]||'').replace(/[^0-9.\-]/g,'')):NaN, tx=iX>=0?parseFloat((c[iX]||'').replace(/[^0-9.\-]/g,'')):NaN;
          if(!isNaN(sv)&&!isNaN(tx)){ sub=sv; gx=tx; gr=sv?+(tx/sv*100).toFixed(2):0; }
          else if(impGst==='incl'){ sub=+(tot/(1+rate/100)).toFixed(2); gx=+(tot-sub).toFixed(2); gr=rate; } else { sub=tot; gr=0; }
          out.push({id:Date.now()+k,num:nm,date:dt,due:dt,customer:(iC>=0&&c[iC])||(P.customers[0]&&P.customers[0].name)||'',items:[{desc:'Imported from Wave',amount:sub}],gstRate:gr,gst:gx,notes:'',sent:true,paid:dt,method:'e-transfer',imported:true});
        });
        if(!out.length) throw new Error('No new invoices found in that file.');
        setInvoices(p=>[...p,...out]); setMsg('Imported '+out.length+' invoices.');
      }catch(e){ setMsg(e.message||'Import failed'); }
    }; rd.readAsText(file);
  }
  const chip=s=>({Paid:['rgba(46,204,138,.16)',T.green],Draft:['rgba(150,150,160,.2)',T.text],Unpaid:['rgba(10,132,255,.16)',T.blue],Overdue:['rgba(255,69,58,.16)','#ff453a']}[s]);
  const setE=(k,v)=>setEdit(e=>({...e,[k]:v}));
  const setItem=(n,k,v)=>setEdit(e=>({...e,items:e.items.map((x,j)=>j===n?{...x,[k]:v}:x)}));
  const setP=(k,v)=>setProf({...P,[k]:v});
  const setR=(k,v)=>setProf({...P,recur:{...P.recur,[k]:v}});
  const bs={padding:'9px 14px',borderRadius:9,fontSize:13,fontWeight:600,cursor:'pointer',border:`1px solid ${T.border}`,background:T.bg4,color:T.text};

  return (
    <div>
      <div className="sgrid" style={{marginBottom:14}}>
        <div className="sc" style={{background:T.bg2,borderColor:T.border}}><div className="sc-bar" style={{background:T.blue}}/><div className="sc-lbl">Invoiced {year}</div><div className="sc-val" style={{color:T.blue,...num}}>{cad(invoices.filter(i=>i.date.startsWith(year)&&(i.sent||i.paid)).reduce((s,i)=>s+invSub(i),0))}</div><div className="sc-sub">before GST</div></div>
        <div className="sc" style={{background:T.bg2,borderColor:T.border}}><div className="sc-bar" style={{background:unpaid>0?T.amber:T.green}}/><div className="sc-lbl">Waiting to be paid</div><div className="sc-val" style={{color:unpaid>0?T.amber:T.green,...num}}>{cad(unpaid)}</div><div className="sc-sub">{drafts?`${drafts} draft${drafts>1?'s':''} not sent`:'all sent'}</div></div>
      </div>

      <div className="card" style={{background:T.bg2,borderColor:T.border,marginBottom:14}}>
        <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:10}}>
          <div style={{fontWeight:700,flex:1}}>GST to remit</div>
          <select value={period} onChange={e=>setPeriod(e.target.value)} className="xbtn" style={{borderColor:T.border,color:T.text,background:'transparent'}}>
            <option style={{color:'#000'}} value="year">Whole year</option><option style={{color:'#000'}} value="q1">Jan to Mar</option><option style={{color:'#000'}} value="q2">Apr to Jun</option><option style={{color:'#000'}} value="q3">Jul to Sep</option><option style={{color:'#000'}} value="q4">Oct to Dec</option>
          </select>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr auto',rowGap:6,fontSize:14,...num}}>
          <div style={{opacity:.7}}>GST charged on invoices sent</div><div style={{textAlign:'right'}}>{cad(gstC)}</div>
          <div style={{opacity:.7}}>GST paid on expenses (ITCs)</div><div style={{textAlign:'right'}}>- {cad(itc)}</div>
          <div style={{fontWeight:700,borderTop:`1px solid ${T.border}`,paddingTop:8}}>{net>=0?'You owe':'Refund'}</div><div style={{textAlign:'right',fontWeight:700,borderTop:`1px solid ${T.border}`,paddingTop:8,color:net>=0?T.amber:T.green}}>{cad(Math.abs(net))}</div>
        </div>
        <div style={{fontSize:11,opacity:.5,marginTop:8}}>Based on invoice dates. Check against your GST filing method before you file.</div>
      </div>

      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:12}}>
        <button style={{...bs,background:T.accent,color:'#fff',border:'none'}} onClick={newInvoice}>+ New invoice</button>
        <button style={bs} onClick={()=>setShowSet(s=>!s)}>{showSet?'Close details':'Invoice details'}</button>
        <select value={year} onChange={e=>setYear(e.target.value)} className="xbtn" style={{borderColor:T.border,color:T.text,background:'transparent'}}>{years.map(y=><option key={y} style={{color:'#000'}}>{y}</option>)}</select>
        <button style={bs} onClick={exportCSV}>CSV</button>
      </div>
      {msg && <div style={{padding:'9px 12px',borderRadius:9,background:'rgba(255,159,10,.14)',color:T.amber,fontSize:13,marginBottom:12}}>{msg}</div>}

      {showSet && (
        <div className="card" style={{background:T.bg2,borderColor:T.border,marginBottom:14}}>
          <div style={{fontWeight:700,marginBottom:10}}>Your details (shown on every invoice)</div>
          <div className="fg"><label className="fl">Your name or business</label><input style={inp} value={P.name} onChange={e=>setP('name',e.target.value)}/></div>
          <div className="fg"><label className="fl">Address (one line per row)</label><textarea style={{...inp,minHeight:64}} value={P.addr} onChange={e=>setP('addr',e.target.value)}/></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div className="fg"><label className="fl">Phone</label><input style={inp} value={P.phone} onChange={e=>setP('phone',e.target.value)}/></div>
            <div className="fg"><label className="fl">GST number</label><input style={inp} value={P.gstNo} onChange={e=>setP('gstNo',e.target.value)}/></div>
            <div className="fg"><label className="fl">GST rate %</label><input type="number" style={inp} value={P.gstRate} onChange={e=>setP('gstRate',e.target.value)}/></div>
            <div className="fg"><label className="fl">Next invoice # (if none yet)</label><input type="number" style={inp} value={P.startNum} onChange={e=>setP('startNum',e.target.value)}/></div>
          </div>
          <div className="fg"><label className="fl">Notes / terms on each invoice</label><textarea style={{...inp,minHeight:64}} value={P.notes} onChange={e=>setP('notes',e.target.value)}/></div>

          <div style={{fontWeight:700,margin:'14px 0 8px'}}>Clients</div>
          {P.customers.map((c,n)=>(
            <div key={n} style={{border:`1px solid ${T.border}`,borderRadius:10,padding:10,marginBottom:8}}>
              <input style={{...inp,marginBottom:6}} placeholder="Company name" value={c.name} onChange={e=>setP('customers',P.customers.map((x,j)=>j===n?{...x,name:e.target.value}:x))}/>
              <input style={{...inp,marginBottom:6}} placeholder="Contact person" value={c.contact||''} onChange={e=>setP('customers',P.customers.map((x,j)=>j===n?{...x,contact:e.target.value}:x))}/>
              <textarea style={{...inp,marginBottom:6,minHeight:56}} placeholder="Address" value={c.addr||''} onChange={e=>setP('customers',P.customers.map((x,j)=>j===n?{...x,addr:e.target.value}:x))}/>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                <input style={inp} placeholder="Phone" value={c.phone||''} onChange={e=>setP('customers',P.customers.map((x,j)=>j===n?{...x,phone:e.target.value}:x))}/>
                <input style={inp} placeholder="Email (for sending)" value={c.email||''} onChange={e=>setP('customers',P.customers.map((x,j)=>j===n?{...x,email:e.target.value}:x))}/>
              </div>
              <button style={{background:'none',border:'none',color:T.red,fontSize:12,marginTop:6}} onClick={()=>{ if(window.confirm('Remove this client? Existing invoices keep their name.')) setP('customers',P.customers.filter((_,j)=>j!==n)); }}>Remove client</button>
            </div>))}
          <button style={bs} onClick={()=>setP('customers',[...P.customers,{name:'',contact:'',addr:'',phone:'',email:''}])}>+ Add client</button>

          <div style={{fontWeight:700,margin:'16px 0 4px'}}>Repeat automatically</div>
          <div style={{fontSize:12,opacity:.55,marginBottom:8}}>Makes a draft on the 1st and 15th. You open it, check it and send it.</div>
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:14,marginBottom:8}}><input type="checkbox" checked={!!P.recur.on} onChange={e=>setProf({...P,recur:{...P.recur,on:e.target.checked,since:P.recur.since||localToday(),customer:P.recur.customer||(P.customers[0]&&P.customers[0].name)||''}})}/> Draft my recurring invoice</label>
          {P.recur.on && <div>
            <div className="fg"><label className="fl">Client</label><select style={inp} value={P.recur.customer} onChange={e=>setR('customer',e.target.value)}>{P.customers.map(c=><option key={c.name}>{c.name}</option>)}</select></div>
            <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:10}}>
              <div className="fg"><label className="fl">Description</label><input style={inp} value={P.recur.desc} onChange={e=>setR('desc',e.target.value)}/></div>
              <div className="fg"><label className="fl">Amount (before GST)</label><input type="number" style={inp} value={P.recur.amount} onChange={e=>setR('amount',e.target.value)}/></div>
            </div>
            <div className="fg"><label className="fl">Days of the month</label><input style={inp} value={(P.recur.days||[]).join(', ')} onChange={e=>setR('days',e.target.value.split(/[ ,]+/).map(Number).filter(n=>n>=1&&n<=31))}/></div>
            <div className="fg"><label className="fl">Start from</label><input type="date" style={{...inp,height:34}} value={P.recur.since} onChange={e=>setR('since',e.target.value)}/></div>
          </div>}

          <div style={{fontWeight:700,margin:'16px 0 4px'}}>Import from Wave</div>
          <div style={{fontSize:12,opacity:.55,marginBottom:8}}>Pick a CSV with invoice number, date, customer and total. Existing numbers are skipped.</div>
          <select style={{...inp,marginBottom:8}} value={impGst} onChange={e=>setImpGst(e.target.value)}><option value="incl">Totals include GST at my rate</option><option value="none">Totals have no GST</option></select>
          <input type="file" accept=".csv,text/csv" onChange={e=>{ if(e.target.files[0]) importCSV(e.target.files[0]); e.target.value=''; }}/>
        </div>)}

      {yInv.length===0
        ? <div className="empty"><div style={{fontSize:44,marginBottom:12}}>🧾</div><div>No invoices for {year}</div></div>
        : <div className="etbl" style={{borderColor:T.border}}>
            {yInv.map(i=>{ const s=invStatus(i), c=chip(s); return (
              <div key={i.id} style={{padding:'12px 16px',borderBottom:`1px solid ${T.border}`,background:T.bg2,fontSize:13}}>
                <div style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer'}} onClick={()=>setEdit({...i,items:i.items.map(x=>({...x}))})}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:600}}>#{i.num} · {i.customer}</div>
                    <div style={{opacity:.55,fontSize:12}}>{longDate(i.date)}</div>
                  </div>
                  <span style={{padding:'3px 9px',borderRadius:20,fontSize:11,fontWeight:600,background:c[0],color:c[1]}}>{s}</span>
                  <div style={{fontWeight:600,minWidth:84,textAlign:'right',...num}}>{cad(invTot(i))}</div>
                </div>
                {i.imported && /^https:\/\/next\.waveapps\.com\//.test(i.waveUrl||'') && <div style={{marginTop:6}}><a href={i.waveUrl} target="_blank" rel="noopener noreferrer" style={{color:T.blue,fontSize:12}} onClick={e=>e.stopPropagation()}>View in Wave</a>{/^https:\/\/drive\.google\.com\//.test(i.pdfUrl||'') && <a href={i.pdfUrl} target="_blank" rel="noopener noreferrer" style={{color:T.blue,fontSize:12,marginLeft:14}} onClick={e=>e.stopPropagation()}>Wave PDF (Drive)</a>}</div>}
                {!i.imported && <div style={{display:'flex',gap:8,marginTop:8,flexWrap:'wrap'}}>
                  <button style={bs} disabled={busy===i.id} onClick={()=>send(i)}>{busy===i.id?'Working…':(i.sent?'Send again':'Send')}</button>
                  <button style={bs} onClick={()=>download(i)}>PDF</button>
                  {!i.paid && <button style={{...bs,color:T.green}} onClick={()=>markPaid(i)}>Mark paid</button>}
                </div>}
              </div>);})}
          </div>}

      {edit && (
        <div className="ov" onClick={()=>setEdit(null)}>
          <div className="modal" style={{background:T.bg2,borderColor:T.border,color:T.text,maxWidth:520}} onClick={e=>e.stopPropagation()}>
            <div className="mhdr"><div className="mttl">Invoice {edit.num}</div><button className="mclose" style={{borderColor:T.border,color:T.text}} onClick={()=>setEdit(null)}>✕</button></div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              <div className="fg"><label className="fl">Number</label><input style={inp} value={edit.num} onChange={e=>setE('num',e.target.value)}/></div>
              <div className="fg"><label className="fl">Client</label><select style={inp} value={edit.customer} onChange={e=>setE('customer',e.target.value)}>{[...new Set([edit.customer,...P.customers.map(c=>c.name)])].map(n=><option key={n}>{n}</option>)}</select></div>
              <div className="fg"><label className="fl">Invoice date</label><input type="date" style={{...inp,height:34}} value={edit.date} onChange={e=>setEdit(x=>({...x,date:e.target.value,due:x.due===x.date?e.target.value:x.due}))}/></div>
              <div className="fg"><label className="fl">Due</label><input type="date" style={{...inp,height:34}} value={edit.due||edit.date} onChange={e=>setE('due',e.target.value)}/></div>
            </div>
            <label className="fl">Items</label>
            {edit.items.map((it,n)=>(
              <div key={n} style={{display:'flex',gap:8,marginBottom:8}}>
                <input style={{...inp,flex:1}} placeholder="Description" value={it.desc} onChange={e=>setItem(n,'desc',e.target.value)}/>
                <input style={{...inp,width:100}} type="number" inputMode="decimal" placeholder="0.00" value={it.amount} onChange={e=>setItem(n,'amount',e.target.value)}/>
                {edit.items.length>1 && <button style={{background:'none',border:'none',color:T.red}} onClick={()=>setEdit(e=>({...e,items:e.items.filter((_,j)=>j!==n)}))}>✕</button>}
              </div>))}
            <button style={{...bs,marginBottom:12}} onClick={()=>setEdit(e=>({...e,items:[...e.items,{desc:'',amount:''}]}))}>+ Add line</button>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              <div className="fg"><label className="fl">GST %</label><input type="number" style={inp} value={edit.gstRate} onChange={e=>setE('gstRate',e.target.value)}/></div>
              <div style={{textAlign:'right',alignSelf:'end',paddingBottom:12,...num}}><div style={{fontSize:12,opacity:.55}}>Total</div><div style={{fontWeight:700,fontSize:18}}>{cad(invTot(edit))}</div></div>

function kbwDownload(name, mime, text) {
  try {
    const url = URL.createObjectURL(new Blob([text], {type: mime}));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);

  } catch(e) { alert('Could not download: ' + e.message); }
}
// ---- PDF first-page preview (pdf.js is loaded on demand, only when a PDF receipt is shown) ----
const PDFJS_V='3.11.174', PDF_CACHE=new Map();
let _pdfjsP=null;
function loadPdfjs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(_pdfjsP) return _pdfjsP;
  _pdfjsP=new Promise((res,rej)=>{
    const sc=document.createElement('script');
    sc.src=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_V}/pdf.min.js`;
    sc.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_V}/pdf.worker.min.js`; res(window.pdfjsLib);}catch(e){rej(e);} };
    sc.onerror=()=>{_pdfjsP=null;rej(new Error('pdfjs'));};
    document.head.appendChild(sc);
  });
  return _pdfjsP;
}
async function pdfFirstPage(dataUrl, width){
  const key=dataUrl.length+':'+dataUrl.slice(-64)+':'+width;
  if(PDF_CACHE.has(key)) return PDF_CACHE.get(key);
  const lib=await loadPdfjs();
  const b64=dataUrl.slice(dataUrl.indexOf(',')+1), bin=atob(b64), u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  const doc=await lib.getDocument({data:u8}).promise;
  const page=await doc.getPage(1);
  const v0=page.getViewport({scale:1}), sc=width/v0.width, vp=page.getViewport({scale:sc});
  const cv=document.createElement('canvas'); cv.width=Math.ceil(vp.width); cv.height=Math.ceil(vp.height);
  await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  const out=cv.toDataURL('image/jpeg',0.8); PDF_CACHE.set(key,out); try{doc.destroy();}catch(e){}
  return out;
}
function PdfPreview({src, width, className, style, fallback, onClick, alt}){
  const [img,setImg]=useState(null);
  useEffect(()=>{ let dead=false; setImg(null);
    if(src&&src.startsWith('data:')) pdfFirstPage(src,width||240).then(u=>{if(!dead)setImg(u);}).catch(()=>{});
    return ()=>{dead=true;};
  },[src,width]);
  return img ? <img className={className} style={style} src={img} alt={alt||'PDF preview'} onClick={onClick}/> : fallback;
}
