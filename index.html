function MedicalModal({editId, record, T, onSave, onClose, onZoom, onDriveBackup, gClientId}) {
  const today = new Date().toISOString().split('T')[0];
  const [date,        setDate]        = useState(record?.date        || today);
  const [description, setDescription] = useState(record?.description || '');
  const [type,        setType]        = useState(record?.type        || 'Dental');
  const [provider,    setProvider]    = useState(record?.provider    || '');
  const [rxName,      setRxName]      = useState(record?.rxName      || '');
  const [rxDoctor,    setRxDoctor]    = useState(record?.rxDoctor    || '');
  const [total,       setTotal]       = useState(record?.total       != null ? String(record.total) : '');
  const [providerPaid,setProviderPaid]= useState(record?.providerPaid!= null ? String(record.providerPaid) : '');
  const [notes,       setNotes]       = useState(record?.notes       || '');
  const [receipt,     setReceipt]     = useState(record?.receipt     || null);
  const [payType,     setPayType]     = useState(record?.payment?.type  ||'Credit Card');
  const [payLast4,    setPayLast4]    = useState(record?.payment?.last4 ||'');
  const [payName,     setPayName]     = useState(record?.payment?.name  ||'');
  const fileRef = useRef();

  const totalN  = parseFloat(total)||0;
  const provN   = parseFloat(providerPaid)||0;
  const youPaid = +(Math.max(0, totalN - provN)).toFixed(2);
  const isRx    = type === 'Prescription';

  function handleFile(e) {
    const file = e.target.files[0]; if(!file) return;
    const isPdf = file.type==='application/pdf';
    if (isPdf) {
      const r=new FileReader(); r.onload=ev=>setReceipt('__PDF__:'+ev.target.result); r.readAsDataURL(file); return;
    }
    const img2=new Image(), url=URL.createObjectURL(file);
    img2.onload=()=>{
      URL.revokeObjectURL(url);
      const MAX=1200; let w=img2.width,h=img2.height;
      if(w>MAX){h=Math.round(h*MAX/w);w=MAX;} if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img2,0,0,w,h);
      setReceipt(c.toDataURL('image/jpeg',0.75));
    };
    img2.src=url;
  }

  function submit() {
    if(!description.trim()){alert('Please enter a description.');return;}
    if(!(totalN>0)){alert('Please enter the total cost.');return;}
    const data = {date,description:description.trim(),type,provider:provider.trim(),rxName:rxName.trim(),rxDoctor:rxDoctor.trim(),total:totalN,providerPaid:provN,youPaid,notes:notes.trim(),receipt,payment:{type:payType,last4:payLast4.trim(),name:payName.trim()}};
    onSave(data);
    if (receipt && onDriveBackup) setTimeout(()=>onDriveBackup(data), 400);
  }

  const inp={background:T.bg4,borderColor:T.border,color:T.text,borderRadius:8,padding:'9px 12px',fontSize:14,width:'100%',outline:'none',border:'1px solid',fontFamily:'inherit'};

  return (
    <div className="ov" onClick={onClose}>
      <div className="modal" style={{background:T.bg2,borderColor:T.border,color:T.text,maxWidth:520}} onClick={e=>e.stopPropagation()}>
        <div className="mhdr">
          <div className="mttl">🏥 {editId?'Edit':'Add'} Medical Expense</div>
          <button type="button" className="msave" style={{background:'rgba(236,72,153,.9)'}} onClick={submit}>Save</button>
          <button className="mclose" style={{borderColor:T.border,color:T.text}} onClick={onClose}>✕</button>
        </div>

        {/* Receipt */}
        <div className="fg">
          <label className="fl">Receipt / Document</label>
          {receipt
            ? <div className="rp">
                {receipt.startsWith('__PDF__:')
                  ? <div style={{background:T.bg4,borderRadius:10,border:`1px solid ${T.border}`,padding:'16px',textAlign:'center',cursor:'pointer'}} onClick={()=>onZoom(receipt.slice(8))}>
                      <div style={{fontSize:32,marginBottom:6}}>📄</div><div style={{fontSize:13}}>PDF — click to view</div>
                    </div>
                  : <img src={viewSrc(receipt)} onError={fbImg(receipt,1600)} referrerPolicy="no-referrer" style={{width:'100%',borderRadius:10,border:`1px solid ${T.border}`,maxHeight:180,objectFit:'cover',cursor:'zoom-in'}} alt="" onClick={()=>onZoom(receipt)}/>
                }
                <button className="rp-rm" onClick={()=>setReceipt(null)}>Remove</button>
              </div>
            : <div style={{border:`2px dashed ${T.border}`,borderRadius:11,padding:'22px 16px',textAlign:'center',cursor:'pointer',position:'relative'}} onClick={()=>fileRef.current.click()}>
                <input ref={fileRef} type="file" accept="image/*,application/pdf" style={{position:'absolute',inset:0,opacity:0,cursor:'pointer'}} onChange={handleFile} onClick={e=>e.stopPropagation()}/>
                <div style={{fontSize:26,marginBottom:6}}>📷</div>
                <div style={{fontSize:13,opacity:.6}}>Click or drag receipt / EOB document</div>
              </div>
          }
        </div>

        <div className="frow fg">
          <div><label className="fl">Date</label><input type="date" style={inp} value={date} onChange={e=>setDate(e.target.value)}/></div>
          <div><label className="fl">Type</label>
            <select style={inp} value={type} onChange={e=>setType(e.target.value)}>
              {MED_TYPES.map(t=><option key={t} value={t}>{t}</option>)}
            </select>
          </div>
        </div>

        <div className="fg"><label className="fl">Description</label>
          <input type="text" style={inp} placeholder="e.g. Dental filling, Glasses frames & lenses, Prescription refill" value={description} onChange={e=>setDescription(e.target.value)}/>
        </div>

        <div className="fg"><label className="fl">Provider / Clinic / Pharmacy</label>
          <input type="text" style={inp} placeholder="e.g. Pacific Blue Cross, Dr. Smith Dental, Shoppers Drug Mart" value={provider} onChange={e=>setProvider(e.target.value)}/>
        </div>

        {/* Prescription-specific fields — only shown when type is Prescription */}
        {isRx && (
          <div style={{background:'rgba(75,142,245,.07)',border:`1px solid rgba(75,142,245,.2)`,borderRadius:11,padding:'14px',marginBottom:14}}>
            <div style={{fontSize:12,fontWeight:600,color:T.blue,marginBottom:10}}>💊 Prescription Details</div>
            <div className="frow">
              <div>
                <label className="fl">Drug / Medication Name</label>
                <input type="text" style={inp} placeholder="e.g. Amoxicillin 500mg" value={rxName} onChange={e=>setRxName(e.target.value)}/>
              </div>
              <div>
                <label className="fl">Prescribed By</label>
                <input type="text" style={inp} placeholder="e.g. Dr. Johnson" value={rxDoctor} onChange={e=>setRxDoctor(e.target.value)}/>
              </div>
            </div>
          </div>
        )}

        {/* Cost calculation */}
        <div style={{background:T.bg3,border:`1px solid ${T.border}`,borderRadius:11,padding:'15px',marginBottom:14}}>
          <div style={{fontWeight:600,fontSize:13,marginBottom:12}}>💰 Cost Breakdown</div>
          <div className="frow" style={{marginBottom:12}}>
            <div>
              <label className="fl">Total Cost ($)</label>
              <input type="number" inputMode="decimal" step="0.01" placeholder="0.00" style={inp} value={total} onChange={e=>setTotal(e.target.value)}/>
            </div>
            <div>
              <label className="fl">Insurance / Provider Paid ($)</label>
              <input type="number" inputMode="decimal" step="0.01" placeholder="0.00" style={inp} value={providerPaid} onChange={e=>setProviderPaid(e.target.value)}/>
            </div>
          </div>
          {totalN>0&&(
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
              {[
                {lbl:'Total Cost',      val:cad(totalN),    color:T.text},
                {lbl:'Provider Covered',val:cad(provN),     color:'#ec4899'},
                {lbl:'You Paid ✅',     val:cad(youPaid),   color:T.blue},
              ].map(x=>(
                <div key={x.lbl} style={{background:T.bg4,borderRadius:8,padding:'8px 10px',border:`1px solid ${T.border}`,textAlign:'center'}}>
                  <div style={{fontSize:10,opacity:.5,marginBottom:4}}>{x.lbl}</div>
                  <div style={{fontWeight:700,fontSize:15,color:x.color}}>{x.val}</div>
                </div>
              ))}
            </div>
          )}
          <div style={{fontSize:11,opacity:.45,marginTop:10}}>Only the <b style={{opacity:1}}>"You Paid"</b> amount is claimable on your CRA T1 return.</div>
        </div>

        {/* Payment Method */}
        <div className="fg">
          <label className="fl">Payment Method <span style={{opacity:.4,fontWeight:400}}>for your out-of-pocket portion</span></label>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:10}}>
            {['Credit Card','Debit Card','Cash','Cheque','E-Transfer','Other'].map(pt=>(
              <button key={pt} type="button"
                style={{padding:'8px 10px',borderRadius:8,border:`1px solid ${payType===pt?'rgba(236,72,153,.6)':T.border}`,background:payType===pt?'rgba(236,72,153,.1)':T.bg4,color:T.text,fontWeight:payType===pt?600:400,fontSize:13,transition:'all .15s',cursor:'pointer'}}
                onClick={()=>setPayType(pt)}>
                {pt==='Credit Card'?'💳':pt==='Debit Card'?'🏧':pt==='Cash'?'💵':pt==='Cheque'?'📝':pt==='E-Transfer'?'📲':'•'} {pt}
              </button>
            ))}
          </div>
          {(payType==='Credit Card'||payType==='Debit Card')&&<CardPicker payType={payType} payName={payName} payLast4={payLast4} setPayType={setPayType} setPayName={setPayName} setPayLast4={setPayLast4} T={T} inp={inp}/>}
          {(payType==='Credit Card'||payType==='Debit Card')&&(
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              <div>
                <label className="fl" style={{fontSize:10}}>Card Name <span style={{opacity:.5,fontWeight:400}}>(e.g. Amex, Visa)</span></label>
                <input type="text" style={inp} placeholder="e.g. Amex, TD Visa" value={payName} onChange={e=>setPayName(e.target.value)}/>
              </div>
              <div>
                <label className="fl" style={{fontSize:10}}>Last 4 Digits</label>
                <input type="text" style={inp} placeholder="e.g. 3405" maxLength={4} value={payLast4} onChange={e=>setPayLast4(e.target.value.replace(/\D/g,''))}/>
              </div>
            </div>
          )}
        </div>

        <div className="fg"><label className="fl">Notes</label>
          <textarea rows={2} style={inp} placeholder="e.g. Prescribed by Dr. Lee · Claim submitted to Blue Cross March 2026" value={notes} onChange={e=>setNotes(e.target.value)}/>
        </div>

        <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:6}}>
          <button style={{background:T.bg4,border:`1px solid ${T.border}`,color:T.text,padding:'9px 17px',borderRadius:9}} onClick={onClose}>Cancel</button>
          <button style={{background:'rgba(236,72,153,.9)',color:'#fff',padding:'9px 19px',borderRadius:9,fontWeight:600}} onClick={submit}>{editId?'Save Changes':'Add Record'}</button>
        </div>
      </div>
    </div>
  );
}

// ─── RECEIPT LIGHTBOX ─────────────────────────────────────────────────────────
function LightboxOne({src, onClose, onPrev, onNext, idx, total}) {
  const isPdf = src && src.startsWith('__PDF__:');
  const isDriveUrl = src && src.startsWith('https://');
  const isPlaceholder = !src || src.startsWith('[') || src === 'null';
  const raw = isPdf ? src.slice(8) : src;
  const [blobUrl, setBlobUrl] = useState(null);
  const [z, setZ] = useState({s:1,x:0,y:0});
  const g = useRef({});
  const dist = t => Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  const ts = e => {
    if (e.touches.length===2) g.current = {mode:'pinch', d:dist(e.touches), s0:z.s};
    else if (e.touches.length===1) g.current = {mode:'pan', x0:e.touches[0].clientX, y0:e.touches[0].clientY, zx:z.x, zy:z.y};
  };
  const tm = e => {
    const G = g.current;
    if (G.mode==='pinch' && e.touches.length===2) { const sc = Math.min(5, Math.max(1, G.s0*dist(e.touches)/G.d)); setZ(p=>({...p, s:sc})); }
    else if (G.mode==='pan' && e.touches.length===1 && z.s>1) setZ(p=>({...p, x:G.zx+e.touches[0].clientX-G.x0, y:G.zy+e.touches[0].clientY-G.y0}));
  };
  const te = e => {
    const G = g.current;
    if (G.mode==='pan' && z.s<=1 && e.changedTouches.length) {
      const dx = e.changedTouches[0].clientX-G.x0, dy = e.changedTouches[0].clientY-G.y0;
      if (Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) { if (dx<0) { onNext && onNext(); } else { onPrev && onPrev(); } }
    }
    if (z.s<1.05) setZ({s:1,x:0,y:0});
    g.current = {};
  };

  useEffect(()=>{
    const handler = e => {
      if (e.key==='Escape') onClose();
      else if (e.key==='ArrowRight' && onNext) onNext();
      else if (e.key==='ArrowLeft' && onPrev) onPrev();
    };
    window.addEventListener('keydown', handler);
    return ()=>window.removeEventListener('keydown', handler);
  },[onClose, onPrev, onNext]);

  // For data URLs: convert to blob for reliable display
  useEffect(()=>{
    if (isPlaceholder || isPdf || isDriveUrl) return;
    try {
      const arr  = raw.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      const bytes = new Uint8Array(bstr.length);
      for (let i=0;i<bstr.length;i++) bytes[i]=bstr.charCodeAt(i);
      const blob = new Blob([bytes], {type:mime});
      const url  = URL.createObjectURL(blob);
      setBlobUrl(url);
      return ()=>URL.revokeObjectURL(url);
    } catch { setBlobUrl(raw); }
  },[raw]);

  useEffect(()=>{
    if (!isPdf) return;
    try {
      const arr=raw.split(','),mime=arr[0].match(/:(.*?);/)[1];
      const bstr=atob(arr[1]),bytes=new Uint8Array(bstr.length);
      for(let i=0;i<bstr.length;i++) bytes[i]=bstr.charCodeAt(i);
      const blob=new Blob([bytes],{type:mime}),url=URL.createObjectURL(blob);
      window.open(url,'_blank');
      setTimeout(()=>URL.revokeObjectURL(url),10000);
    } catch { window.open(raw,'_blank'); }
    onClose();
  },[]);

  if (isPdf) return null;

  if (isPlaceholder) return (
    <div className="rfs" onClick={onClose}>
      <div className="rfs-bar">
        <span style={{color:'rgba(255,255,255,.7)',fontSize:13}}>Receipt stored in Google Drive</span>
        <button className="rfs-close" onClick={onClose}>✕</button>
      </div>
      <div style={{color:'rgba(255,255,255,.6)',textAlign:'center',padding:40}}>
        <div style={{fontSize:48,marginBottom:16}}>📁</div>
        <div style={{fontSize:16,marginBottom:8}}>Receipt is in Google Drive</div>
        <div style={{fontSize:13,opacity:.5}}>Open Google Drive to view this receipt</div>
      </div>
    </div>
  );

  // Drive URL — load directly from Google Drive
  const displayUrl = isDriveUrl ? viewSrc(raw) : blobUrl;
  const barBtn = {background:'rgba(255,255,255,.15)',color:'#fff',padding:'6px 13px',borderRadius:7,fontSize:12,textDecoration:'none'};
  return (
    <div className="rfs" onClick={onClose} style={{cursor:'zoom-out'}} onTouchStart={ts} onTouchMove={tm} onTouchEnd={te}>
      <div className="rfs-bar">
        <span style={{color:'rgba(255,255,255,.7)',fontSize:13,pointerEvents:'none'}}>
          {total>1 ? `Receipt ${idx+1} of ${total}` : 'Receipt'} · {z.s>1?'pinch or double-tap to reset':'Esc to close'}
        </span>
        <div style={{display:'flex',gap:8,pointerEvents:'all'}}>
          {isDriveUrl
            ? <a href={drivePage(raw)} target="_blank" rel="noreferrer" style={barBtn} onClick={e=>e.stopPropagation()}>Open in Drive ↗</a>
            : displayUrl&&<a href={displayUrl} download="receipt.jpg" target="_blank" rel="noreferrer" style={barBtn} onClick={e=>e.stopPropagation()}>Download</a>}
          <button className="rfs-close" onClick={onClose}><Ic n="x" s={18} c="#fff"/></button>
        </div>
      </div>
      {onPrev && <button className="rfs-nav l" aria-label="Previous receipt" onClick={e=>{e.stopPropagation();onPrev();}}><Ic n="left" s={22} c="#fff"/></button>}
      {onNext && <button className="rfs-nav r" aria-label="Next receipt" onClick={e=>{e.stopPropagation();onNext();}}><Ic n="right" s={22} c="#fff"/></button>}
      {displayUrl
        ? <img src={displayUrl} alt="Receipt" onError={e=>{ if(isDriveUrl){ const n=+e.target.dataset.fb||0; e.target.dataset.fb=String(n+1); const id=driveId(raw); if(n===0&&id) e.target.src=`https://lh3.googleusercontent.com/d/${id}=w1600`; else if(n===1) e.target.src=raw; } }} referrerPolicy="no-referrer" draggable={false}
            onDoubleClick={e=>{ e.stopPropagation(); setZ(p=>p.s>1?{s:1,x:0,y:0}:{s:2.5,x:0,y:0}); }}
            onWheel={e=>{ const f=e.deltaY<0?1.12:0.89; setZ(p=>{ const sc=Math.min(5,Math.max(1,p.s*f)); return sc<=1?{s:1,x:0,y:0}:{...p,s:sc}; }); }}
            style={{maxWidth:'90vw',maxHeight:'86vh',objectFit:'contain',borderRadius:12,boxShadow:'0 0 80px rgba(0,0,0,.9)',cursor:z.s>1?'grab':'default',display:'block',touchAction:'none',transform:`translate(${z.x}px,${z.y}px) scale(${z.s})`,transition:g.current.mode?'none':'transform .15s'}}
            onClick={e=>e.stopPropagation()}/>
        : <div style={{color:'rgba(255,255,255,.5)',fontSize:14}}>Loading…</div>
      }
      {total>1 && <div className="rfs-cnt">{idx+1} / {total}</div>}
    </div>
  );
}

// Wrapper: lets you step through every receipt in the current list
function ReceiptLightbox({src, list, onClose}) {
  const nav = useMemo(()=>(list||[]).filter(r=>typeof r==='string' && r && !r.startsWith('__PDF__:') && !r.startsWith('[') && r!=='null'),[list]);
  const [cur, setCur] = useState(src);
  const i = nav.indexOf(cur);
  const go = d => { if (i<0 || nav.length<2) return; setCur(nav[(i+d+nav.length)%nav.length]); };
  const many = i>=0 && nav.length>1;
  return <LightboxOne key={cur} src={cur} onClose={onClose} onPrev={many?()=>go(-1):null} onNext={many?()=>go(1):null} idx={i} total={many?nav.length:0}/>;
}


// ─── APP WRAPPER (handles PIN before loading main App) ────────────────────────
function AppWrapper() {
  const [unlocked, setUnlocked] = useState(()=>sessionStorage.getItem('kbw_unlocked')==='1');
  const [pinInput, setPinInput] = useState('');
  const [pinError, setPinError] = useState('');
  const [firstPin, setFirstPin] = useState('');
  const storedHash = (()=>{ try { return localStorage.getItem('cra_tracker_v1_pinHash')||''; } catch { return ''; } })();
  const [hasPin, setHasPin] = useState(!!storedHash);

  async function hashPin(pin) {
    const s = 'kbw-salt:' + pin;
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    } catch { return 'plain:' + s; }
  }

  async function verifyPin(pin) {
    if (!hasPin) {
      // First run on this device: set a PIN (enter twice)
      if (pin.length < 6) { setPinError('PIN must be 6 digits.'); setPinInput(''); return; }
      if (!firstPin) { setFirstPin(pin); setPinInput(''); setPinError(''); return; }
      if (firstPin !== pin) { setFirstPin(''); setPinInput(''); setPinError("PINs didn't match. Start again."); return; }
      try { localStorage.setItem('cra_tracker_v1_pinHash', await hashPin(pin)); } catch {}
      setHasPin(true); setFirstPin('');
      sessionStorage.setItem('kbw_unlocked','1');
      setUnlocked(true); setPinError('');
      return;
    }
    const h = await hashPin(pin);
    if (h === localStorage.getItem('cra_tracker_v1_pinHash')) {
      sessionStorage.setItem('kbw_unlocked','1');
      setUnlocked(true); setPinError('');
    } else {
      setPinError('Incorrect PIN. Try again.');
      setPinInput('');
    }
  }

  // ── Face ID / Touch ID (WebAuthn platform authenticator, per device) ──
  const BIO_KEY = 'cra_tracker_v1_bioId';
  const b64 = {
    enc: buf => btoa(String.fromCharCode(...new Uint8Array(buf))),
    dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)),
  };
  const [bioId, setBioId] = useState(()=>{ try { return localStorage.getItem(BIO_KEY)||''; } catch { return ''; } });
  const [bioSupported, setBioSupported] = useState(false);
  const [offerBio, setOfferBio] = useState(false);
  const [bioMsg, setBioMsg] = useState('');
  useEffect(()=>{
    (async()=>{
      try {
        if (window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
          setBioSupported(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
        }
      } catch {}
    })();
  },[]);

  async function unlockWithBio(auto) {
    try {
      const cred = await navigator.credentials.get({ publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{ type:'public-key', id: b64.dec(bioId) }],
        userVerification: 'required',
        timeout: 60000,
      }});
      if (cred) { sessionStorage.setItem('kbw_unlocked','1'); setUnlocked(true); setPinError(''); }
    } catch (e) {
      if (auto !== true) setPinError('Touch ID did not work (' + (e && e.name || 'error') + '). Use your PIN, then turn it on again in Settings.');
    }
  }

  async function enableBio() {
    try {
      const cred = await navigator.credentials.create({ publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp: { name: 'KBW Expense Tracker', id: window.location.hostname },
        user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'kbw-expense-tracker', displayName: 'KBW Expense Tracker' },
        pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
        authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged' },
        timeout: 60000,
      }});
      if (cred) {
        const id = b64.enc(cred.rawId);
        try { localStorage.setItem(BIO_KEY, id); } catch {}
        setBioId(id); setOfferBio(false); setBioMsg('Face ID / Touch ID is on for this device.');
        setTimeout(()=>setBioMsg(''), 3500);
      }
    } catch (e) {
      setOfferBio(false);
      setBioMsg('Could not turn on Touch ID (' + (e && e.name || 'error') + ').');
      setTimeout(()=>setBioMsg(''), 6000);
    }
  }

  function declineBio() { try { localStorage.setItem('cra_tracker_v1_bioDeclined','1'); } catch {} setOfferBio(false); }

  // After a PIN unlock, offer to enable biometrics once (if supported, not enrolled, not declined)
  useEffect(()=>{
    if (!unlocked || !bioSupported || bioId) return;
    let declined = false; try { declined = localStorage.getItem('cra_tracker_v1_bioDeclined')==='1'; } catch {}
    if (!declined) setOfferBio(true);
  },[unlocked, bioSupported, bioId]);

  // Lets Settings show an "Enable Face ID / Touch ID" button any time
  window.kbwBio = { supported: bioSupported, enrolled: !!bioId, enable: enableBio };

  // Prompt Face ID / Touch ID automatically when the lock screen opens
  const autoBioTried = useRef(false);
  useEffect(()=>{
    if (!unlocked && hasPin && bioId && bioSupported && !autoBioTried.current) {
      autoBioTried.current = true;
      setTimeout(()=>{ unlockWithBio(true); }, 350);
    }
  },[unlocked, hasPin, bioId, bioSupported]);

  const prompt = hasPin ? 'Enter your PIN to continue' : (firstPin ? 'Confirm your new 6-digit PIN' : 'Choose a 6-digit PIN for this device');
  if (!unlocked) return <PinScreen pinInput={pinInput} setPinInput={setPinInput} pinError={pinError} onSubmit={verifyPin} prompt={prompt} bioReady={hasPin && !!bioId && bioSupported} onBio={unlockWithBio} />;
  return (
    <>
      <App />
      {(offerBio || bioMsg) && (
        <div style={{position:'fixed',left:12,right:12,bottom:'calc(84px + env(safe-area-inset-bottom))',zIndex:9999,display:'flex',justifyContent:'center',pointerEvents:'none'}}>
          <div style={{pointerEvents:'auto',maxWidth:420,width:'100%',background:'#1c1c1e',color:'#f5f5f7',border:'1px solid rgba(255,255,255,.12)',borderRadius:18,padding:'14px 16px',boxShadow:'0 8px 30px rgba(0,0,0,.4)',fontFamily:"-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif",fontSize:14}}>
            {bioMsg ? bioMsg : (<>
              <div style={{fontWeight:600,marginBottom:4}}>Unlock with Face ID / Touch ID?</div>
              <div style={{opacity:.65,fontSize:12,marginBottom:12}}>Skip typing your PIN on this device. The PIN still works as a backup.</div>
              <div style={{display:'flex',gap:8}}>
                <button onClick={enableBio} style={{flex:1,padding:'10px',borderRadius:10,border:'none',background:'#0a84ff',color:'#fff',fontWeight:600,fontFamily:'inherit',cursor:'pointer'}}>Turn on</button>
                <button onClick={declineBio} style={{flex:1,padding:'10px',borderRadius:10,border:'1px solid rgba(255,255,255,.2)',background:'transparent',color:'#e8ecf8',fontFamily:'inherit',cursor:'pointer'}}>Not now</button>
              </div>
            </>)}
          </div>
        </div>
      )}
    </>
  );
}
function PinScreen({pinInput, setPinInput, pinError, onSubmit, prompt, bioReady, onBio}) {
  // Load logo from localStorage to show on PIN screen
  const logo = (() => { try { const v=localStorage.getItem('cra_tracker_v1_logo'); return fixLogo(v?JSON.parse(v):null); } catch { return DEFAULT_LOGO; } })();
  const icon  = logo?.logoImg || logo?.icon  || '🍁';
  const title = logo?.title || 'KBW Expense Tracker';
  const iconBg = logo?.iconBg || '#e8412a';
  const isImg = logo?.logoImg;

  useEffect(()=>{
    document.body.style.background='#000';
    document.body.style.color='#e8ecf8';
  },[]);

  function handleDigit(d){ if(pinInput.length<6) setPinInput(p=>p+d); }
  function handleDelete(){ setPinInput(p=>p.slice(0,-1)); }
  useEffect(()=>{ if(pinInput.length>=6) onSubmit(pinInput); },[pinInput]);

  // Keyboard / phone number-pad entry: digits, Backspace, Enter
  const pinRef = useRef(pinInput);
  useEffect(()=>{ pinRef.current = pinInput; },[pinInput]);
  useEffect(()=>{
    const onKey = e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.target && e.target.tagName === 'INPUT') return;   // the hidden PIN input handles its own typing
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); if (pinRef.current.length < 6) setPinInput(p=>p+e.key); }
      else if (e.key === 'Backspace') { e.preventDefault(); setPinInput(p=>p.slice(0,-1)); }
      else if (e.key === 'Enter' && pinRef.current.length >= 4) { e.preventDefault(); onSubmit(pinRef.current); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  },[]);

  return (
    <div style={{minHeight:'100dvh',display:'flex',alignItems:'center',justifyContent:'center',background:'#000',fontFamily:"-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro Text,Inter,system-ui,sans-serif"}}>
      <div style={{textAlign:'center',padding:32,maxWidth:320,width:'100%'}}>
        {/* Logo */}
        <div style={{display:'flex',justifyContent:'center',marginBottom:12}}>
          {isImg
            ? <img src={isImg} style={{width:56,height:56,borderRadius:14,objectFit:'cover'}} alt="logo"/>
            : <div style={{width:56,height:56,borderRadius:14,background:iconBg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:28}}>{icon}</div>
          }
        </div>
        <div style={{fontSize:18,fontWeight:700,marginBottom:4,color:'#e8ecf8'}}>{title}</div>
        <div style={{fontSize:13,opacity:.4,marginBottom:32}}>{prompt||'Enter your PIN to continue'}</div>

        {/* PIN dots */}
        <div style={{display:'flex',gap:12,justifyContent:'center',marginBottom:24,position:'relative'}}>
          {[0,1,2,3,4,5].map(i=>(
            <div key={i} style={{width:14,height:14,borderRadius:'50%',background:i<pinInput.length?'#fff':'rgba(255,255,255,.2)',transition:'background .1s'}}/>
          ))}
          {/* Invisible input over the dots: tap the dots to use your phone's own number pad */}
          <input type="tel" inputMode="numeric" pattern="[0-9]*" autoComplete="off" aria-label="PIN"
            value={pinInput}
            onChange={e=>setPinInput(e.target.value.replace(/\D/g,'').slice(0,6))}
            onKeyDown={e=>{ if(e.key==='Enter' && pinInput.length>=4) onSubmit(pinInput); }}
            style={{position:'absolute',inset:'-10px 0',width:'100%',height:'calc(100% + 20px)',opacity:0,fontSize:16,border:'none',background:'transparent',color:'transparent',caretColor:'transparent'}}/>
        </div>

        {pinError&&<div style={{color:'#e85555',fontSize:13,marginBottom:16}}>{pinError}</div>}

        {/* Numpad */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:14,maxWidth:264,margin:'0 auto'}}>
          {[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map((d,i)=>(
            <button key={i}
              style={{width:72,height:72,margin:'0 auto',padding:0,borderRadius:'50%',border:'none',background:d===''?'transparent':'rgba(255,255,255,.12)',color:'#fff',fontSize:d==='⌫'?22:30,fontWeight:400,cursor:d===''?'default':'pointer',fontFamily:'inherit',transition:'background .12s'}}
              onClick={()=>{ if(d==='⌫') handleDelete(); else if(d!=='') handleDigit(String(d)); }}
              onMouseEnter={e=>{ if(d!=='') e.target.style.background='rgba(255,255,255,.22)'; }}
              onMouseLeave={e=>{ if(d!=='') e.target.style.background='rgba(255,255,255,.12)'; }}
              disabled={d===''}
            >{d}</button>
          ))}
        </div>
        {pinInput.length>=4&&(
          <button onClick={()=>onSubmit(pinInput)}
            style={{marginTop:16,width:'100%',maxWidth:240,margin:'16px auto 0',display:'block',padding:'14px',borderRadius:14,background:'#0a84ff',border:'none',color:'#fff',fontSize:16,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>
            Unlock →
          </button>
        )}
        {bioReady&&(
          <button onClick={onBio}
            style={{marginTop:14,width:'100%',maxWidth:240,margin:'14px auto 0',display:'block',padding:'12px',borderRadius:12,background:'transparent',border:'1px solid rgba(255,255,255,.25)',color:'#e8ecf8',fontSize:14,fontWeight:500,cursor:'pointer',fontFamily:'inherit'}}>
            🔓 Use Face ID / Touch ID
          </button>
        )}
        <div style={{fontSize:11,opacity:.3,marginTop:24}}>Tap the dots to use your keypad · Your PIN is the same on all your devices · v2026.11.26e</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppWrapper/>);
</script>
