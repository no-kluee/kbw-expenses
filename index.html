<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KBW Expense Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-size:14px;line-height:1.5;transition:background .25s,color .25s;font-family:'Poppins',sans-serif}
input,select,textarea{border-radius:8px;padding:8px 10px;font-size:14px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s;font-family:inherit}
input[type="date"]{padding:4px 6px;font-size:13px;-webkit-appearance:none;appearance:none;height:34px;line-height:1.2}
input[type=color]{padding:3px 5px;height:36px;cursor:pointer}
textarea{resize:vertical}
button{cursor:pointer;font-size:14px;border-radius:8px;border:none;transition:all .15s;font-weight:500;font-family:inherit}
.shell{display:flex;flex-direction:column;min-height:100vh}
.hdr{border-bottom:1px solid;padding:0 22px;position:sticky;top:0;z-index:100}
.hdr-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:10px;height:60px;flex-wrap:wrap}
.logo-area{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px 8px;border-radius:8px;flex-shrink:0}
.logo-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.logo-title{font-size:15px;font-weight:700}
.logo-sub{font-size:10px;font-family:'Poppins',sans-serif;margin-top:1px;opacity:.4}
.nav{display:flex;gap:2px;margin-left:auto}
.nb{background:transparent;border:1px solid transparent;padding:6px 13px;border-radius:8px;font-size:13px;opacity:.6}
.nb:hover{opacity:1}
.nb.on{opacity:1;border-color:rgba(128,128,128,.3)}
.psel,.fsel{padding:6px 9px;font-size:12px;border-radius:7px;border:1px solid;background:transparent;font-family:inherit;cursor:pointer;width:auto}
.psel{max-width:72px}
.addbtn{padding:8px 17px;border-radius:9px;font-weight:600;font-size:13px}
.addbtn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.tbtn{padding:7px 11px;border-radius:8px;font-size:12px;border:1px solid;background:transparent;opacity:.7}
.tbtn:hover{opacity:1}
.fbar{border-bottom:1px solid;padding:8px 22px;position:sticky;top:57px;z-index:90}
.fbar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto}
.flbl{font-size:10px;font-family:'Poppins',sans-serif;letter-spacing:.3px;text-transform:uppercase;opacity:.4}
.main{flex:1;padding:22px;max-width:1200px;margin:0 auto;width:100%}
/* stat cards */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.sc{border-radius:14px;padding:17px 19px;position:relative;overflow:hidden;cursor:pointer;transition:filter .15s;border:1px solid}
.sc:hover{filter:brightness(1.06)}
.sc-bar{position:absolute;top:0;left:0;right:0;height:2px}
.sc-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.3px;margin-bottom:7px;font-family:'Poppins',sans-serif;opacity:.5}
.sc-val{font-size:22px;font-weight:700;letter-spacing:-.3px}
.sc-sub{font-size:11px;margin-top:4px;opacity:.4}
.sc-hint{position:absolute;top:8px;right:10px;font-size:10px;opacity:0;transition:opacity .15s;pointer-events:none}
.sc:hover .sc-hint{opacity:.5}
/* layout */
.card{border-radius:14px;padding:19px;border:1px solid}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sec-ttl{font-size:15px;font-weight:700;margin-bottom:14px}
/* cat bars */
.cbar{margin-bottom:11px}
.cbar-h{display:flex;justify-content:space-between;margin-bottom:4px}
.cbar-name{font-size:13px;display:flex;align-items:center;gap:6px}
.cbar-amt{font-size:13px;font-weight:600;font-family:'Poppins',sans-serif}
.prog{height:4px;border-radius:3px;overflow:hidden;opacity:.25}
.prog-fill{height:100%;border-radius:3px;transition:width .4s}
/* expense table */
.etbl{border-radius:14px;overflow:hidden;border:1px solid}
.etbl-hd{padding:11px 17px;border-bottom:1px solid;display:grid;grid-template-columns:48px 100px 1fr 210px 90px 90px 90px 115px;gap:10px;align-items:center}
.th{font-size:11px;font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.3px;opacity:.4}
.erow{padding:11px 17px;border-bottom:1px solid;display:grid;grid-template-columns:48px 100px 1fr 210px 90px 90px 90px 115px;gap:10px;align-items:center;cursor:pointer;transition:background .1s}
.erow:last-child{border-bottom:none}
.erow{content-visibility:auto;contain-intrinsic-size:auto 66px}
.r-thumb{width:40px;height:40px;border-radius:7px;object-fit:cover;border:1px solid;cursor:zoom-in;display:block}
.r-thumb:hover{filter:brightness(1.15)}
.r-wrap{position:relative;width:40px;height:40px;flex-shrink:0}
.r-tick{position:absolute;right:-5px;bottom:-5px;width:17px;height:17px;border-radius:50%;background:#22a45d;color:#fff;font-size:11px;font-weight:700;line-height:17px;text-align:center;border:2px solid var(--bg,#111);box-sizing:content-box;text-decoration:none;cursor:pointer}
.r-icon{width:40px;height:40px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid}
.vname{font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vnote{font-size:13px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-top:1px;opacity:.4}
.mob-only{display:none}
.mob-amounts{display:none;gap:12px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.lnbadge{display:inline-block;padding:1px 6px;border-radius:5px;font-size:10px;font-family:'Poppins',sans-serif;opacity:.5;margin-left:4px}
.ra{text-align:right}
.mono{font-family:'Poppins',sans-serif}
.rac{display:flex;gap:5px;justify-content:flex-end}
.bsm{padding:4px 9px;border-radius:7px;font-size:12px;border:1px solid;background:transparent}
.bsm:hover{filter:brightness(1.3)}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;backdrop-filter:blur(6px)}
.modal{border-radius:18px;padding:26px;width:100%;max-width:560px;max-height:93vh;overflow-y:auto;border:1px solid}
.modal-sm{max-width:440px}
.modal-lg{max-width:720px}
.mhdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.mttl{font-size:18px;font-weight:700}
.mclose{border:1px solid;width:30px;height:30px;border-radius:7px;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;background:transparent;cursor:pointer}
.fg{margin-bottom:14px}
.fl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px;display:block;font-family:'Poppins',sans-serif;opacity:.6}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* receipt drop zone */
.dz{border:2px dashed;border-radius:11px;padding:26px 16px;text-align:center;cursor:pointer;position:relative}
.dz input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dz:hover{opacity:.75}
/* scan */
.scan-box{border-radius:11px;padding:18px;text-align:center;margin-bottom:14px;border:1px solid}
.spin{width:26px;height:26px;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px;border-width:2.5px;border-style:solid}
@keyframes spin{to{transform:rotate(360deg)}}
/* breakdown */
.bkbox{border-radius:10px;padding:13px;margin-bottom:14px;border:1px solid}
.bkrow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px}
.bkrow+.bkrow{border-top:1px solid}
.bklbl{opacity:.6}
.bkval{font-family:'Poppins',sans-serif;font-weight:500}
.bkdiv{border-top-width:2px!important;margin-top:4px;padding-top:8px!important}
.bkdiv .bklbl{opacity:1;font-weight:600}
.bkdiv .bkval{font-size:14px;font-weight:700}
/* gas helper */
.gas-helper{border-radius:10px;padding:11px 14px;margin-bottom:14px;border:1px solid;font-size:12px;line-height:1.7}
/* cra note */
.cranote{border-left:3px solid;border-radius:0 8px 8px 0;padding:8px 12px;font-size:12px;margin-bottom:14px;line-height:1.6;opacity:.7}
/* pst toggle */
.pst-row{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:8px;cursor:pointer;opacity:.7}
.pst-row input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:#4b8ef5}
/* receipt in modal */
.rp{position:relative;margin-bottom:14px}
.rp img{width:100%;border-radius:10px;border:1px solid;max-height:200px;object-fit:cover;cursor:zoom-in;display:block}
.rp img:hover{filter:brightness(1.08)}
.rp-rm{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.78);border:none;color:#fff;border-radius:6px;padding:3px 9px;font-size:11px;cursor:pointer}
/* fullscreen receipt */
.rfs{position:fixed;inset:0;background:#000;z-index:3000;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:zoom-out}
.rfs-img{max-width:96vw;max-height:88vh;object-fit:contain;border-radius:8px}
.rfs-bar{position:absolute;top:0;left:0;right:0;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(rgba(0,0,0,.7),transparent);pointer-events:none}
.rfs-bar button{pointer-events:all}
.rfs-close{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:18px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* category cards */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ccard{border-radius:14px;padding:16px 18px;border-left:3px solid;border:1px solid;position:relative}
.ccard-top{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.ccard-icon{font-size:20px}
.ccard-name{font-weight:600;font-size:13px}
.ccard-line{font-size:10px;font-family:'Poppins',sans-serif;opacity:.4;margin-top:1px}
.ccard-count{font-size:11px;opacity:.4}
.ccard-tot{margin-left:auto;font-size:16px;font-weight:700;font-family:'Poppins',sans-serif}
.ccard-ebtn{border:1px solid;padding:3px 9px;border-radius:6px;font-size:11px;background:transparent;opacity:.5;cursor:pointer;flex-shrink:0}
.ccard-ebtn:hover{opacity:1}
.cminis{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
.cmini{border-radius:7px;padding:7px 9px;border:1px solid}
.cminilbl{font-size:10px;font-family:'Poppins',sans-serif;margin-bottom:2px;opacity:.4}
.cminival{font-size:12px;font-weight:600;font-family:'Poppins',sans-serif}
.ccranote{border-radius:6px;padding:7px 10px;font-size:11px;line-height:1.5;opacity:.45}
.wpill{margin-top:6px;border-radius:6px;padding:4px 9px;font-size:11px;border:1px solid}
/* summary table */
.stbl{width:100%;border-collapse:collapse}
.stbl th{padding:9px 14px;text-align:right;font-size:10px;font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid;font-weight:500;opacity:.5}
.stbl th:first-child,.stbl td:first-child{text-align:left}
.stbl td{padding:10px 14px;text-align:right;border-bottom:1px solid;font-size:13px}
.stbl tbody tr:hover{filter:brightness(1.05)}
.stbl tfoot td{border-top:2px solid;font-weight:700}
/* export */
.xbar{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.xbtn{padding:8px 15px;border-radius:8px;font-size:13px;border:1px solid;background:transparent;display:flex;align-items:center;gap:6px}
.xbtn:hover{filter:brightness(1.2)}
/* detail */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}
.di{border-radius:8px;padding:9px 11px;border:1px solid}
.dilbl{font-size:10px;font-family:'Poppins',sans-serif;margin-bottom:2px;opacity:.4}
.dival{font-size:13px;font-weight:600}
/* theme */
.font-opt{border:1px solid;border-radius:9px;padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px}
.font-opt:hover{filter:brightness(1.12)}
.font-opt.sel{border-width:2px}
.color-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* info banner */
.ibanner{border-radius:11px;padding:13px 17px;font-size:13px;line-height:1.7;margin-top:16px;border:1px solid;opacity:.75}
/* empty */
.empty{padding:56px 20px;text-align:center;opacity:.4}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{border-radius:3px;background:rgba(128,128,128,.2)}
@media(max-width:900px){.sgrid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.hcol{display:none}.cgrid{grid-template-columns:1fr}}

/* ── MOBILE (<=640px) ── */
@media(max-width:480px){
  .hdr{padding:0 10px}
  .hdr-in{height:auto!important;padding:8px 0;gap:6px;flex-wrap:nowrap;align-items:center;overflow-x:auto}
  .logo-area{flex-shrink:0;gap:5px}
  .logo-icon{width:26px;height:26px;font-size:13px;border-radius:6px}
  .logo-title{font-size:11px;white-space:nowrap}
  .logo-sub{display:none}
  .psel{font-size:10px;padding:4px 5px;max-width:95px;flex-shrink:0}
  .tbtn{font-size:10px;padding:4px 7px;flex-shrink:0;white-space:nowrap}
  .hdr-in{flex-wrap:wrap}
  .nav{order:3;width:100%;overflow-x:auto;gap:2px;padding-bottom:3px;display:flex;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nb{font-size:11px;padding:6px 12px;white-space:nowrap;flex-shrink:0;border-radius:8px}
  .fbar-in{flex-wrap:wrap;gap:5px;padding:8px 10px}
  .fsel{font-size:11px;padding:5px 6px;flex-shrink:0;min-width:0}
  .addbtn{font-size:13px;padding:10px 16px;width:100%;order:99;margin-top:4px;border-radius:10px}
  .main{padding:10px}
  .sgrid{grid-template-columns:1fr 1fr!important;gap:8px}
  .sc{padding:10px 8px}.sc-val{font-size:17px}.sc-lbl{font-size:9px}.sc-sub{font-size:10px}
  .two{grid-template-columns:1fr!important}
  .card{padding:12px}
  .etbl-hd{display:none!important}
  .erow{display:block!important;padding:12px!important}
  .erow .hcol{display:none!important}
  .vname{font-size:14px}.vnote{font-size:12px}
  .cgrid{grid-template-columns:1fr!important}
  .ov{padding:0;align-items:flex-end}
  .modal,.modal-sm,.modal-lg{width:100vw!important;max-width:100vw!important;max-height:92dvh!important;border-radius:20px 20px 0 0!important;margin:0;overflow-y:auto;padding:18px 14px}
  .mttl{font-size:16px}
  .frow{grid-template-columns:1fr 1fr}.frow3{grid-template-columns:1fr 1fr}
  .sum-tbl{font-size:11px}.sum-tbl td,.sum-tbl th{padding:5px 6px}
  .med-tbl-hdr{display:none!important}
  .med-row{display:block!important;padding:12px!important;position:relative}
  .bsm{font-size:11px;padding:4px 10px}
  .mob-hide{display:none!important}
  .mob-only{display:block!important}
  .mob-amounts{display:flex!important}
  .med-desk{display:none!important}
  .hcol{display:none!important}
  .med-mob-amounts{display:flex!important}
  .med-row{grid-template-columns:48px 1fr 80px!important}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useMemo, useEffect } = React;

// ─── FONTS ────────────────────────────────────────────────────────────────────
const FONTS = [
  {id:'system', name:'System Default', stack:"system-ui,-apple-system,sans-serif", url:null},
  {id:'dm',     name:'DM Sans',        stack:"'DM Sans',sans-serif",  url:'https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap'},
  {id:'inter',  name:'Inter',          stack:"'Inter',sans-serif",    url:'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap'},
  {id:'jakarta',name:'Plus Jakarta',   stack:"'Plus Jakarta Sans',sans-serif", url:'https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap'},
  {id:'outfit', name:'Outfit',         stack:"'Outfit',sans-serif",   url:'https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap'},
  {id:'sora',   name:'Sora',           stack:"'Sora',sans-serif",     url:'https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap'},
];

// ─── PROVINCES ────────────────────────────────────────────────────────────────
const PROVS = [
  {code:'BC',name:'British Columbia', gst:.05,pst:.07, hst:false},
  {code:'AB',name:'Alberta',          gst:.05,pst:0,   hst:false},
  {code:'SK',name:'Saskatchewan',     gst:.05,pst:.06, hst:false},
  {code:'MB',name:'Manitoba',         gst:.05,pst:.07, hst:false},
  {code:'ON',name:'Ontario',          gst:0,  pst:0,   hst:true,hstRate:.13},
  {code:'QC',name:'Quebec',           gst:.05,pst:.09975,hst:false,qst:true},
  {code:'NB',name:'New Brunswick',    gst:0,  pst:0,   hst:true,hstRate:.15},
  {code:'NS',name:'Nova Scotia',      gst:0,  pst:0,   hst:true,hstRate:.15},
  {code:'PE',name:'PEI',              gst:0,  pst:0,   hst:true,hstRate:.15},
  {code:'NL',name:'Newfoundland',     gst:0,  pst:0,   hst:true,hstRate:.15},
  {code:'YT',name:'Yukon',            gst:.05,pst:0,   hst:false},
  {code:'NT',name:'NWT',              gst:.05,pst:0,   hst:false},
  {code:'NU',name:'Nunavut',          gst:.05,pst:0,   hst:false},
];

// ─── CRA T2125 CATEGORIES ─────────────────────────────────────────────────────
// line: T2125 line number. gf = GST claimable fraction. df = deductible fraction.
// CRA says "Don't include GST/HST in your expenses; claim an ITC instead."
// So deductible = subtotal × df  (NOT subtotal+GST)
const DEFAULT_CATS = [
  {id:'advertising',   label:'Advertising',                       line:'8521', icon:'📣', color:'#4b8ef5', gf:1, df:1, cra:'Line 8521 — 100% deductible. Flyers, digital ads, marketing materials.'},
  {id:'meals',         label:'Meals & Entertainment',             line:'8523', icon:'🍽️', color:'#f0a033', gf:.5, df:.5, cra:'Line 8523 — 50% deductible, 50% GST claimable. Document who/why.'},
  {id:'baddebts',      label:'Bad Debts',                         line:'8590', icon:'💸', color:'#e85555', gf:0, df:1, cra:'Line 8590 — Amounts owed to you that are uncollectable.'},
  {id:'insurance',     label:'Insurance',                         line:'8690', icon:'🛡️', color:'#f0a033', gf:0, df:1, cra:'Line 8690 — No GST. Business insurance premiums 100% deductible.'},
  {id:'interest',      label:'Interest',                          line:'8710', icon:'🏦', color:'#9b72f5', gf:0, df:1, cra:'Line 8710 — No GST. Business loan interest 100% deductible.'},
  {id:'business_tax',  label:'Business Tax, Fees & Licences',     line:'8760', icon:'🏛️', color:'#36c9c9', gf:0, df:1, cra:'Line 8760 — Memberships, dues, subscriptions, municipal licences.'},
  {id:'office',        label:'Office Expenses',                   line:'8810', icon:'📎', color:'#e85555', gf:1, df:1, cra:'Line 8810 — 100% deductible. Pens, paper, printer ink, stamps.'},
  {id:'supplies',      label:'Supplies',                          line:'8811', icon:'📦', color:'#2ecc8a', gf:1, df:1, cra:'Line 8811 — 100% deductible. Materials used to earn income.'},
  {id:'legal',         label:'Legal, Accounting & Professional',  line:'8860', icon:'⚖️', color:'#36c9c9', gf:1, df:1, cra:'Line 8860 — 100% deductible. Accountant, lawyer, consultants.'},
  {id:'management',    label:'Management & Admin Fees',           line:'8871', icon:'💼', color:'#9b72f5', gf:1, df:1, cra:'Line 8871 — Fees paid to outside management/admin services.'},
  {id:'rent',          label:'Rent',                              line:'8910', icon:'🏢', color:'#4b8ef5', gf:1, df:1, cra:'Line 8910 — 100% deductible. Office/studio rent only (not home office).'},

// ─── CORE CALC ────────────────────────────────────────────────────────────────
// CRA rule: "Do NOT include GST/HST in your expenses — claim ITC instead."
// Therefore: deductible = subtotal × df   (never subtotal + GST)
// Gas tip: NOT deductible (CRA does not allow tip on fuel as a business expense)
function calcBD(amount, province, catId, tax, cats) {
  const cat = cats.find(c=>c.id===catId) || cats[cats.length-1];
  const p   = PROVS.find(x=>x.code===province) || PROVS[0];
  const sub = parseFloat(amount) || 0;

  const autoGst = () => {
    if (cat.gf === 0) return 0;
    return p.hst ? sub * p.hstRate : sub * p.gst;
  };

  const tip    = parseFloat(tax?.tip)    || 0;
  const liquor = parseFloat(tax?.liquor) || 0;
  const other2 = parseFloat(tax?.other)  || 0;
  const gstPaid = (tax?.gst != null && tax.gst !== '') ? (parseFloat(tax.gst)||0) : autoGst();
  const pstPaid = (tax?.hasPst && tax?.pst != null) ? (parseFloat(tax.pst)||0) : 0;
  const total   = sub + tip + gstPaid + pstPaid + liquor + other2;

  // GST ITC claimable: 50% for meals/entertain, 0% for insurance/banking/payroll, 100% else
  const gstClaimable = Math.round(gstPaid * cat.gf * 100) / 100;

  // Deductible base: subtotal + PST + liquor tax (both non-recoverable, part of your expense cost)
  // GST excluded (claimed separately as ITC). Gas: tip excluded. Meals: tip + liquor included in 50% base.
  const taxBase = cat.id === 'gas' ? (sub + pstPaid) : (sub + tip + pstPaid + liquor + other2);
  const deductibleAmount = Math.round(taxBase * cat.df * 100) / 100;

  return { sub, tip, gstPaid:Math.round(gstPaid*100)/100, pstPaid, liquor:liquor+other2, total:Math.round(total*100)/100, gstClaimable, deductibleAmount };
}

// Re-attach receipts that already live in Google Drive (matched by date + amount). Only fills empty receipts.
function relinkDriveReceipts(exps, meds) {
  let n = 0;
  const e2 = exps.map(e => {
    if (e.receipt) return e;
    const id = DRIVE_RECEIPTS[`${e.date}|${Number(e.amount).toFixed(2)}`];
    if (!id) return e;
    n++; return { ...e, receipt: driveUrl(id) };
  });
  const m2 = meds.map(m => {
    if (m.receipt) return m;
    const id = DRIVE_MED_RECEIPTS[m.date];
    if (!id) return m;
    n++; return { ...m, receipt: driveUrl(id) };
  });
  return { exps: e2, meds: m2, n };
}

const LS_KEY = 'cra_tracker_v1';
function lsLoad(key, fallback) {
  try { const v = localStorage.getItem(LS_KEY+'_'+key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function lsSave(key, val) {
  try {
    localStorage.setItem(LS_KEY+'_'+key, JSON.stringify(val));
  } catch(e) {
    // Storage full — receipts are likely the culprit
    if (e.name === 'QuotaExceededError') {
      alert('⚠️ Storage is full! Your receipts are taking up too much space.\n\nTip: Export your data to CSV/Excel as a backup, then consider removing old receipts from expenses to free up space.');
    }
  }
}

function lsUsageMB() {
  try {
    let total = 0;
    for (let k in localStorage) {
      if (k.startsWith(LS_KEY)) total += (localStorage[k]||'').length;
    }
    return (total * 2 / 1024 / 1024).toFixed(1); // UTF-16 = 2 bytes per char
  } catch { return '?'; }
}

  async function gGetOrCreateFolder(name, parentId, token) {
    // Search for existing folder
    const q = `name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false${parentId?` and '${parentId}' in parents`:''}`;
    const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    const searchData = await searchRes.json();
    if (searchData.files && searchData.files.length > 0) return searchData.files[0].id;
    // Create folder
    const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, mimeType: 'application/vnd.google-apps.folder', parents: parentId ? [parentId] : [] })
    });
    const created = await createRes.json();
    return created.id;
  }

  async function compressForDrive(dataUrl) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1600;
        let w = img.width, h = img.height;
        if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
        if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  }

    const b64   = finalUrl.split(',')[1];
    const bstr  = atob(b64);
    const bytes = new Uint8Array(bstr.length);
    for (let i=0;i<bstr.length;i++) bytes[i]=bstr.charCodeAt(i);
    const mime     = isPdf ? 'application/pdf' : 'image/jpeg';
    const ext      = isPdf ? 'pdf' : 'jpg';
    const safeName = expense.vendor.replace(/[^a-zA-Z0-9 ]/g,'').replace(/\s+/g,'_').slice(0,30);
    const fileName = `${expense.date}_${safeName}_$${expense.amount}.${ext}`;
    // Avoid duplicates — update if already exists
    const eq = `name='${fileName}' and '${catId}' in parents and trashed=false`;
    const er = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(eq)}&fields=files(id)`,{headers:{Authorization:`Bearer ${token}`}});
    const ed = await er.json();
    setGStatus('☁️ Uploading…');
    let fileId;
    if (ed.files?.length>0) {
      fileId = ed.files[0].id;
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,{method:'PATCH',headers:{Authorization:`Bearer ${token}`,'Content-Type':mime},body:bytes});
    } else {
      const bd='kbw_b'; const meta=JSON.stringify({name:fileName,parents:[catId]});
      const p1=new TextEncoder().encode(`--${bd}\r\nContent-Type: application/json\r\n\r\n${meta}\r\n--${bd}\r\nContent-Type: ${mime}\r\n\r\n`);
      const p2=new TextEncoder().encode(`\r\n--${bd}--`);
      const body=new Uint8Array(p1.length+bytes.length+p2.length);
      body.set(p1);body.set(bytes,p1.length);body.set(p2,p1.length+bytes.length);
      const uploadRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':`multipart/related; boundary=${bd}`},body});
      const uploadData = await uploadRes.json();
      fileId = uploadData.id;
    }
    // Make file publicly viewable so any device can load the receipt
    if (fileId) {
      await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, {
        method:'POST', headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
        body: JSON.stringify({role:'reader', type:'anyone'})
      });
      return `https://drive.google.com/uc?export=view&id=${fileId}`;
    }
    return fileName;
  }

  async function gSyncFromDrive(silent=false) {
    if (!gClientId) { if(!silent) alert('Please set up Google Drive in ⚙️ Settings first.'); return; }
    if (!window.google?.accounts?.oauth2) {
      if (!silent) { setGStatus('❌ Google not loaded — try refreshing'); setTimeout(()=>setGStatus(''),4000); }
      return;
    }
    if (!silent) { setGSyncing(true); setGStatus('🔗 Signing in…'); }
    try {
      let token;
      try { token = await gSignIn(); } catch(e) { throw new Error('Sign-in cancelled. Try again.'); }
      if (!token) throw new Error('No access token.');
      if (!silent) setGStatus('🔍 Loading expenses…');
      const rootId = await gGetOrCreateFolder(DRIVE_ROOT, null, token);

      // Search entire KBW Expenses folder tree for any expenses_*.json files
      const searchQ = `name contains 'expenses_' and '${rootId}' in parents or (name contains 'expenses_' and mimeType='application/json') and trashed=false`;
      // Simpler: just search all of Drive for expenses_ json files under root
      const allFilesQ = `name contains 'expenses_' and trashed=false`;
      const allFilesR = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(allFilesQ)}&fields=files(id,name,parents)&pageSize=50`,{headers:{Authorization:`Bearer ${token}`}});
      const allFilesD = await allFilesR.json();

      let allExpenses = [];
      for (const file of (allFilesD.files||[])) {
        if (!file.name.includes('expenses_')) continue;
        try {
          const dr = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`,{headers:{Authorization:`Bearer ${token}`}});
          const data = await dr.json();
          if (Array.isArray(data)) allExpenses = [...allExpenses, ...data];
        } catch(e) { console.log('skip file', file.name); }
      }
      if (!allExpenses.length) {
        if (!silent) { setGStatus('❌ No expenses found in Drive'); setTimeout(()=>setGStatus(''),4000); }
        if (!silent) setGSyncing(false); return;
      }
      const seen = new Set();
      const cleaned = allExpenses
        .map((e,i)=>({...e, id:e.id||Date.now()+i, receipt:(e.receipt&&typeof e.receipt==='string'&&e.receipt.startsWith('['))?null:e.receipt}))
        .filter(e=>{ if(seen.has(e.id)) return false; seen.add(e.id); return true; });
      setExpenses(cleaned);
      lsSave('expenses', cleaned);
      if (!silent) { setGStatus(`✅ Synced ${cleaned.length} expenses!`); setTimeout(()=>setGStatus(''),3000); }
    } catch(err) {
      console.error(err);
      if (!silent) { setGStatus('❌ '+(err.message||'Sync error')); setTimeout(()=>setGStatus(''),5000); }
    }
    if (!silent) setGSyncing(false);
  }

      const total = todoE.length + todoM.length;

  // Load saved data from GitHub (startup, and right after a token is saved in Settings)
  async function pullFromGitHub(token) {
    if (!token) return { ok:false, reason:'no-token' };
    window._ghLoading = true;
    try {
      const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}`, {
        headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.raw+json' },
        cache: 'no-store'
      });
      if (!res.ok) return { ok:false, reason: res.status===401 ? 'bad-token' : (res.status===404 ? 'not-found' : 'error') };
      const parsed = await res.json();
      let n = 0, outExp = null, outMed = null, extra = 0;
      // First sync on this device: MERGE so nothing stored only here is lost. After that, GitHub is the source of truth.
      const firstSync = !lsLoad('ghSynced', false);
      if (Array.isArray(parsed?.expenses)) {
        const localExp = lsLoad('expenses', []);
        const receiptById = {};
        localExp.forEach(e => { if (e.receipt) receiptById[e.id] = e.receipt; });
        let merged = parsed.expenses.map(e => ({ ...e, receipt: e.receipt || receiptById[e.id] || null }));
        if (firstSync) {
          const have = new Set(merged.map(e => e.id));
          const onlyLocal = localExp.filter(e => !have.has(e.id));
          extra += onlyLocal.length;
          merged = [...merged, ...onlyLocal];
        }
        setExpenses(merged); lsSave('expenses', merged); n = merged.length; outExp = merged;
      }
      if (Array.isArray(parsed?.medical)) {
        const localMed = lsLoad('medical', []);
        const medReceipt = {};
        localMed.forEach(m => { if (m.receipt) medReceipt[m.id] = m.receipt; });
        let mergedMed = parsed.medical.map(m => ({ ...m, receipt: m.receipt || medReceipt[m.id] || null }));
        if (firstSync) {
          const haveM = new Set(mergedMed.map(m => m.id));
          const onlyLocalM = localMed.filter(m => !haveM.has(m.id));
          extra += onlyLocalM.length;
          mergedMed = [...mergedMed, ...onlyLocalM];
        }
        setMedical(mergedMed); lsSave('medical', mergedMed); outMed = mergedMed;
      }
      // Settings (logo, theme, categories, etc.): saved copy wins once one exists
      const st = parsed?.settings;
      if (st?.pinHash && typeof st.pinHash === 'string') { try { localStorage.setItem('cra_tracker_v1_pinHash', st.pinHash); } catch {} }
      else { try { if (localStorage.getItem('cra_tracker_v1_pinHash')) extra++; } catch {} }
      if (st && typeof st === 'object') {
        if (st.theme && typeof st.theme === 'object') setTheme(st.theme);
        if (st.logo && typeof st.logo === 'object') setLogo(st.logo);
        if (Array.isArray(st.cats) && st.cats.length) setCats(st.cats);
        if (typeof st.province === 'string' && st.province) setProvince(st.province);
        if (Array.isArray(st.statCards) && st.statCards.length) setStatCards(st.statCards);
        if (typeof st.gClientId === 'string' && st.gClientId) { setGClientId(st.gClientId); lsSave('gClientId', st.gClientId); }
      }
      // Re-attach receipts already in Google Drive (fills empty ones only)
      {
        const rl = relinkDriveReceipts(outExp || lsLoad('expenses', []), outMed || lsLoad('medical', []));
        if (rl.n > 0) {
          setExpenses(rl.exps); lsSave('expenses', rl.exps); outExp = rl.exps;
          setMedical(rl.meds); lsSave('medical', rl.meds); outMed = rl.meds;
          extra += rl.n;
        }
      }
      window._ghReady = true;   // only now is it safe to save changes back
      lsSave('ghSynced', true);
      // If this device had entries GitHub didn't, push the combined list up once
      if (extra > 0 && outExp) setTimeout(()=>ghSave(outExp, outMed || lsLoad('medical', [])), 1500);
      return { ok:true, count:n, added:extra };
    } catch (e) {
      return { ok:false, reason:'error' };
    } finally {
      setTimeout(() => { window._ghLoading = false; }, 1000);
    }
  }

  function importCSV(file) {
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const text = ev.target.result;
        const lines = text.split('\n').filter(l=>l.trim());
        if (lines.length < 2) { alert('File appears empty.'); return; }
        function parseRow(line) {
          const fields=[]; let cur='', inQ=false;
          for (let i=0;i<line.length;i++) {
            const ch=line[i];
            if (ch==='"') { if(inQ&&line[i+1]==='"'){cur+='"';i++;} else inQ=!inQ; }
            else if (ch===','&&!inQ) { fields.push(cur.trim()); cur=''; }
            else cur+=ch;
          }
          fields.push(cur.trim());
          return fields;
        }
        const headers = parseRow(lines[0]).map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,''));
        const imported = [];
        let skipped = 0;
        const baseTime = Date.now();
        for (let i=1;i<lines.length;i++) {
          const row = parseRow(lines[i]);
          if (row.length < 3) continue;
          const get = (...keys) => {
            for (const k of keys) {
              const idx = headers.findIndex(h=>h.includes(k));
              if (idx>=0 && row[idx] !== undefined) return row[idx].replace(/^"|"$/g,'');
            }
            return '';
          };
          const date   = get('date');
          const vendor = get('vendor');
          const catName= get('category');
          if (!date || !vendor) { skipped++; continue; }
          const cat    = cats.find(c=>c.label.toLowerCase()===catName.toLowerCase()) || cats[cats.length-1];
          const amount = parseFloat(get('subtotal','pretax','amount'))||0;
          const tip    = parseFloat(get('tip'))||0;
          const gst    = parseFloat(get('gsthst','gst'))||0;
          const pst    = parseFloat(get('pst'))||0;
          const other  = parseFloat(get('othertax','other'))||0;
          const bizPctS= get('business');
          const bizPct = bizPctS ? parseInt(bizPctS)||100 : 100;
          const prov   = get('province')||province;
          const note   = get('purpose','note');
          const payType= get('paymenttype','payment')||'';
          const payName= get('cardname','name')||'';
          const payLast4=get('last4','card')||'';
          // Use base time + index * large offset to guarantee unique IDs
          imported.push({
            id: baseTime * 1000 + i,
            date, vendor, category: cat.id,
            amount, province: prov, bizPct,
            tax: { gst, pst, hasPst: pst>0, tip, liquor: other, other: 0, gasMode: false, gasTotal: 0 },
            payment: { type: payType, name: payName, last4: payLast4 },
            note, receipt: null
          });
        }
        if (imported.length===0) { alert('No valid rows found. Check the format matches the template.'); return; }
        const msg = `Import ${imported.length} expense${imported.length!==1?'s':''}${skipped>0?` (${skipped} rows skipped)`:''}\n\nReplace all existing expenses, or add to them?\n\nOK = Replace all\nCancel = Add to existing`;
        if (window.confirm(msg)) {
          setExpenses(imported);
        } else {
          setExpenses(prev => {
            const existingKeys = new Set(prev.map(e=>`${e.date}|${e.vendor}|${e.amount}`));
            const newOnes = imported.filter(e=>!existingKeys.has(`${e.date}|${e.vendor}|${e.amount}`));
            return [...prev, ...newOnes];
          });
        }
        alert(`✅ Imported ${imported.length} expense${imported.length!==1?'s':''}!`);
      } catch(err) {
        alert('Error reading file: ' + err.message);
      }
    };
    reader.readAsText(file);
  }

  function dedupeExpenses() {
    // Remove duplicates: keep first occurrence of each unique vendor+date+amount combo
    const seen = new Set();
    const deduped = expenses.filter(e => {

    if (window.confirm(`Found ${removed} duplicate expense${removed!==1?'s':''}. Remove them?`)) {
      setExpenses(deduped);
      alert(`✅ Removed ${removed} duplicate${removed!==1?'s':''}. ${deduped.length} expenses remain.`);

          <button className="tbtn" style={{borderColor:T.border,color:T.text}} onClick={()=>setModal('settings')}><span className="mob-hide">⚙️ Settings</span><span className="mob-only">⚙️</span></button>
          {gStatus&&<span style={{fontSize:11,color:gStatus.startsWith('❌')?T.red:gStatus.startsWith('✅')?T.green:T.blue,maxWidth:200,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{gStatus}</span>}
        </div>
      </div>

      {/* Filter bar */}
      <div className="fbar" style={{background:T.bg2,borderColor:T.border}}>
        <div className="fbar-in">
          <select className="fsel" style={{borderColor:T.border,color:T.text}} value={filter.year} onChange={e=>setFilter(p=>({...p,year:e.target.value,dateFrom:'',dateTo:''}))}>

            {years.map(y=><option key={y} value={y}>{y}</option>)}
          </select>
          <select className="fsel" style={{borderColor:T.border,color:T.text,maxWidth:180}} value={filter.cat} onChange={e=>setFilter(p=>({...p,cat:e.target.value}))}>
            <option value="all">All Categories</option>
            {cats.map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}
          </select>
          <span className="mob-hide flbl">From</span>
          <input className="mob-hide" type="date" style={{background:T.bg4,borderColor:T.border,color:T.text,borderRadius:7,padding:'5px 9px',fontSize:12,border:'1px solid',width:'auto',fontFamily:'inherit'}} value={filter.dateFrom} onChange={e=>setFilter(p=>({...p,dateFrom:e.target.value,year:'all'}))}/>
          <span className="mob-hide flbl">To</span>
          <input className="mob-hide" type="date" style={{background:T.bg4,borderColor:T.border,color:T.text,borderRadius:7,padding:'5px 9px',fontSize:12,border:'1px solid',width:'auto',fontFamily:'inherit'}} value={filter.dateTo} onChange={e=>setFilter(p=>({...p,dateTo:e.target.value,year:'all'}))}/>
          {(filter.dateFrom||filter.dateTo)&&<button className="mob-hide" onClick={()=>setFilter(p=>({...p,dateFrom:'',dateTo:'',year:String(new Date().getFullYear())}))} style={{fontSize:11,background:'transparent',border:`1px solid ${T.border}`,color:T.text,padding:'4px 8px',borderRadius:6,opacity:.6}}>✕</button>}
          <select className="fsel" style={{borderColor:T.border,color:T.text}} value={filter.sort} onChange={e=>setFilter(p=>({...p,sort:e.target.value}))}>
            <option value="date">Date (newest first)</option>
            <option value="date_asc">Date (oldest first)</option>
            <option value="added">Recently Added</option>
            <option value="amount">Amount (highest)</option>
            <option value="amount_asc">Amount (lowest)</option>
          </select>
          <span style={{marginLeft:'auto',fontSize:11,opacity:.4,whiteSpace:'nowrap'}}>{filtered.length} expense{filtered.length!==1?'s':''}</span>
          <span style={{fontSize:11,opacity:.3,marginLeft:8,whiteSpace:'nowrap'}}>💾 {lsUsageMB()} MB</span>
          <button className="addbtn" style={{background:T.accent,color:'#fff',marginLeft:12,whiteSpace:'nowrap',flexShrink:0}} onClick={()=>{setEditId(null);setModal('expense');}}>+ Add Expense</button>
        </div>
      </div>

      {/* Main */}
      <div className="main">
        {tab==='dashboard'  && <Dashboard  {...{filtered,statVals,statCards,cats,province,T,getCat,calcBD}} onDetail={e=>{setDetailExp(e);setModal('detail');}} onEditStat={s=>{setEditStat(s);setModal('statEdit');}} />}
        {tab==='expenses'   && <Expenses   {...{filtered,cats,province,T,getCat,calcBD}} onDetail={e=>{setDetailExp(e);setModal('detail');}} onEdit={id=>{setEditId(id);setModal('expense');}} onDelete={id=>{const exp=expenses.find(e=>e.id===id);setExpenses(p=>p.filter(e=>e.id!==id));if(exp?.receipt)setTimeout(()=>gDeleteFile(exp),300);}} onZoom={setFullImg} exportCSV={exportCSV} exportXLS={exportXLS} importCSV={importCSV} downloadTemplate={downloadTemplate} dedupeExpenses={dedupeExpenses} />}
        {tab==='categories' && <Categories {...{filtered,cats,province,T,getCat,calcBD}} onEditCat={c=>{setEditCat(c);setModal('catEdit');}} />}
        {tab==='medical'    && <MedicalTab medical={medical} setMedical={setMedical} T={T} onZoom={setFullImg} onDriveBackup={handleMedicalDriveBackup} gClientId={gClientId} />}
        {tab==='summary'    && <Summary    {...{filtered,statVals,statCards,cats,province,T,getCat,calcBD}} exportCSV={exportCSV} exportXLS={exportXLS} />}
      </div>

      {/* Modals */}

      {modal==='theme'    && <ThemeModal  theme={T} onSave={t=>{setTheme(t);closeModal();}} onClose={closeModal} />}
      {modal==='logo'     && <LogoModal   logo={logo} T={T} onSave={l=>{setLogo(l);closeModal();}} onClose={closeModal} />}
      {modal==='settings' && <SettingsModal apiKey={apiKey} gClientId={gClientId} ghToken={ghToken} T={T} onSave={(k,g,gh)=>{
        const tokenChanged = gh && gh !== lsLoad('ghToken','');
        setApiKey(k);setGClientId(g);setGhToken(gh);lsSave('ghToken', gh);closeModal();
        if (gh && (tokenChanged || !window._ghReady)) {
          pullFromGitHub(gh).then(r=>{
            if (r.ok) alert(`Connected. Loaded ${r.count} expenses from GitHub.`);
            else if (r.reason==='bad-token') alert('GitHub rejected that token. Check that you copied all of it.');
            else if (r.reason==='not-found') alert('Token saved, but the data file was not found. Make sure the token has access to the data repo.');
            else alert('Could not reach GitHub. Check your connection and try Save again.');
          });
        }
      }} onClose={closeModal} onMigrate={moveReceiptsToDrive} localReceipts={expenses.filter(e=>isLocalReceipt(e.receipt)).length + medical.filter(m=>isLocalReceipt(m.receipt)).length} />}

            <span className="th ra">Amount</span><span className="th ra">GST ITC</span>

          {shown.map(e=>{

            const adjITC=+(bd.gstClaimable*pct).toFixed(2);
            const adjDed=+(bd.deductibleAmount*pct).toFixed(2);
            const payIcon = e.payment?.type==='Credit Card'?'💳':e.payment?.type==='Debit Card'?'🏧':e.payment?.type==='Cash'?'💵':'💳';
            const receipt = e.receipt;
            const isPdfReceipt = receipt?.startsWith('__PDF__:');
            return(
              <div key={e.id} className="erow" style={{borderColor:T.border,background:'transparent'}}
                onMouseEnter={ev=>ev.currentTarget.style.background=T.bg3}
                onMouseLeave={ev=>ev.currentTarget.style.background='transparent'}
                onClick={()=>onDetail(e)}>
                {/* Thumbnail — always shown */}
                <div className="r-wrap">
                {receipt
                  ? isPdfReceipt
                    ? <div className="r-icon" style={{borderColor:T.border,background:T.bg4,cursor:'zoom-in',fontSize:20}} onClick={ev=>{ev.stopPropagation();onZoom(receipt);}}>📄</div>
                    : <img className="r-thumb" style={{borderColor:T.border}} src={thumbSrc(receipt)} loading="lazy" decoding="async" alt="" onClick={ev=>{ev.stopPropagation();onZoom(receipt);}}/>
                  : <div className="r-icon" style={{borderColor:T.border,background:T.bg4}}>{c.icon}</div>}
                {receipt && <span className="r-tick" title="Receipt saved" onClick={ev=>{ev.stopPropagation(); if(/^https?:/.test(receipt)) window.open(receipt,'_blank','noopener'); else onZoom(receipt);}}>✓</span>}
                </div>

                {/* Desktop: date column */}
                <div className="hcol" style={{fontSize:12,opacity:.55}}>{e.date}</div>

                {/* Vendor column — desktop shows just vendor+note+payment, mobile shows everything */}
                <div style={{minWidth:0}}>
                  {/* Mobile-only: date */}
                  <div className="mob-only" style={{fontSize:11,opacity:.45,marginBottom:2}}>{e.date}</div>
                  <div className="vname">{e.vendor}</div>
                  {e.note&&<div className="vnote">{e.note}</div>}
                  {e.payment?.type&&<div style={{fontSize:12,opacity:.45,marginTop:2}}>
                    {payIcon}{' '}{e.payment.name||e.payment.type}{e.payment.last4?` ···· ${e.payment.last4}`:''}
                    {e.bizPct&&e.bizPct!==100?<span style={{marginLeft:6,color:T.green}}>{e.bizPct}% biz</span>:''}
                  </div>}
                  {/* Mobile-only: category badge + amounts */}
                  <div className="mob-only" style={{marginTop:4}}>
                    <span className="badge" style={{background:c.color+'22',color:c.color}}>{c.icon} {c.label}</span>
                    <span className="lnbadge" style={{marginLeft:4}}>L{c.line}</span>
                  </div>
                  <div className="mob-only mob-amounts" style={{marginTop:6}}>
                    <span style={{fontSize:12}}><span style={{opacity:.4,fontSize:10}}>AMT </span><b>{cad(e.amount)}</b></span>
                    <span style={{fontSize:12}}><span style={{opacity:.4,fontSize:10}}>ITC </span><b style={{color:T.green}}>{cad(adjITC)}</b></span>
                    <span style={{fontSize:12}}><span style={{opacity:.4,fontSize:10}}>DED </span><b style={{color:T.blue}}>{cad(adjDed)}</b></span>
                  </div>
                </div>

                {/* Desktop: category */}
                <div className="hcol"><span className="badge" style={{background:c.color+'22',color:c.color}}>{c.icon} {c.label}</span><span className="lnbadge">L{c.line}</span></div>

                {/* Desktop: amounts */}
                <div className="ra mono hcol" style={{fontSize:15,fontWeight:600}}>{cad(e.amount)}</div>
                <div className="ra mono hcol" style={{color:T.green,fontWeight:600,fontSize:15}}>{cad(adjITC)}</div>
                <div className="ra mono hcol" style={{color:T.blue,fontSize:15}}>{cad(adjDed)}</div>

                {/* Actions */}
                <div className="rac" onClick={ev=>ev.stopPropagation()}>
                  <button className="bsm" style={{borderColor:T.border,color:T.text}} onClick={()=>onEdit(e.id)}>Edit</button>
                  <button className="bsm" style={{borderColor:'rgba(232,85,85,.25)',color:T.red}} onClick={()=>onDelete(e.id)}>✕</button>
                </div>
              </div>
            );
          })}
          {filtered.length > limit && (
            <button onClick={()=>setLimit(l=>l+PAGE)}
              style={{width:'100%',padding:'14px',background:'transparent',border:'none',borderTop:`1px solid ${T.border}`,color:T.text,fontWeight:600,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>
              Show more ({filtered.length - limit} remaining)
            </button>
          )}
        </div>}
    </div>
  );
}

// ─── EXPENSE MODAL ────────────────────────────────────────────────────────────
function ExpenseModal({editId,expense,cats,defaultProvince,T,calcBD,apiKey,onSave,onClose,onZoom}) {
  const today=new Date().toISOString().split('T')[0];
  const [date,    setDate]    = useState(expense?.date    ||today);
  const [vendor,  setVendor]  = useState(expense?.vendor  ||'');
  const [cat,     setCat]     = useState(expense?.category||'advertising');
  const [province,setProv]    = useState(expense?.province||defaultProvince);
  const [note,    setNote]    = useState(expense?.note    ||'');
  const [receipt, setReceipt] = useState(expense?.receipt ||null);
  const [scanning,setScanning]= useState(false);
  const [scanErr, setScanErr] = useState('');
  // Payment method
  const [payType,  setPayType]  = useState(expense?.payment?.type  ||'Credit Card');
  const [payLast4, setPayLast4] = useState(expense?.payment?.last4 ||'');
  const [payName,  setPayName]  = useState(expense?.payment?.name  ||'');
  // Business use %
  const [bizPct,   setBizPct]   = useState(expense?.bizPct != null ? String(expense.bizPct) : '100');

  // Tax fields
  const init=expense?.tax||{gst:'',pst:'',hasPst:false,tip:'',liquor:'',other:'',gasMode:false,gasTotal:''};
  const [gst,    setGst]    = useState(String(init.gst   ||''));
  const [pst,    setPst]    = useState(String(init.pst   ||''));
  const [hasPst, setHasPst] = useState(!!init.hasPst);
  const [tip,    setTip]    = useState(String(init.tip   ||''));
  const [liquor, setLiquor] = useState(String(init.liquor||''));
  const [gasMode,setGasMode]= useState(true);   // always on for gas — type total, get split
  const [gasTotal,setGasTotal]=useState(init.gasTotal?String(init.gasTotal): (expense?.category==='gas'&&expense?.amount ? String((expense.tax?.gasTotal)||'') : ''));
  // amount = pre-tax subtotal
  const [amount, setAmount] = useState(expense?.amount!=null?String(expense.amount):'');

  const fileRef = useRef();
  const catObj  = cats.find(c=>c.id===cat)||cats[cats.length-1];
  const isGas   = cat==='gas';

  // Gas: derive subtotal + GST directly from gasTotal (no useEffect needed)
  const p = PROVS.find(x=>x.code===province)||PROVS[0];
  const gstRate = p.hst ? p.hstRate : p.gst;

  function handleGasTotal(val) {
    setGasTotal(val);
    const total = parseFloat(val) || 0;
    if (total > 0) {
      const sub  = +(total / (1 + gstRate)).toFixed(2);
      const gstV = +(total - sub).toFixed(2);
      setAmount(String(sub));
      setGst(String(gstV));
    } else {
      setAmount('');
      setGst('');
    }
  }

  // Recalculate if province changes while a gasTotal is already entered
  useEffect(()=>{
    if (isGas && parseFloat(gasTotal) > 0) {
      handleGasTotal(gasTotal);
    }
  }, [province]);

  const taxObj  = {gst,pst,hasPst,tip,liquor,other:'',gasMode:true,gasTotal};
  const amt     = parseFloat(amount)||0;
  const bd      = amt>0 ? calcBD(amt,province,cat,taxObj,cats) : null;

  const PROMPT_TEXT = `You are a Canadian tax receipt OCR. Extract all financial details from this receipt.
Return ONLY valid JSON (no markdown, no explanation):
{
  "vendor": "exact store/business name",
  "date": "YYYY-MM-DD or null",
  "category": "one of: advertising|meals|insurance|interest|business_tax|office|supplies|legal|management|rent|maintenance|salaries|property_tax|travel|phone|fuel|gas|delivery|vehicle|cca|other|homeoffice|software",
  "subtotal": number,
  "tip": number or 0,
  "gst": number or 0,
  "hst": number or 0,
  "pst": number or 0,
  "qst": number or 0,
  "liquor_tax": number or 0,
  "total": number,
  "province": "2-letter CA province code",
  "payment_type": "Credit Card|Debit Card|Cash|Cheque|E-Transfer|Other",
  "card_last4": "4 digits or null",
  "card_name": "card network or bank name e.g. Visa, Mastercard, Amex, TD Debit or null",
  "note": "brief 1-line description of what was purchased"
}
Rules: gas receipts → total=full pump amount inc. GST. PST only if explicitly printed on receipt. All numbers as floats, 0 if absent.`;

  async function doScan(dataUrl, mime) {
    try {
      const base64 = dataUrl.split(',')[1];
      const isPdf  = mime === 'application/pdf';

      const fileBlock = isPdf
        ? { type:'document', source:{ type:'base64', media_type:'application/pdf', data:base64 } }
        : { type:'image',    source:{ type:'base64', media_type: mime.startsWith('image/') ? mime : 'image/jpeg', data:base64 } };

      const body = JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 800,
        messages: [{ role:'user', content:[ fileBlock, { type:'text', text:PROMPT_TEXT } ] }]
      });

      // API call — use provided API key (works from file://) or browser IPC (works on localhost/claude.ai)
      let res;
      try {
        const headers = { 'Content-Type':'application/json', 'anthropic-version':'2023-06-01' };
        if (apiKey) {
          headers['x-api-key'] = apiKey;
        } else {
          headers['anthropic-dangerous-direct-browser-ipc'] = 'true';
        }
        res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST', headers, body
        });
      } catch(fetchErr) {
        throw new Error('Network blocked — add your Anthropic API key via ⚙️ AI Setup button, or open via http://localhost:8080');
      }

      const data = await res.json();
      if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

      const txt    = (data.content?.find(b=>b.type==='text')?.text || '').replace(/```json|```/g,'').trim();
      const parsed = JSON.parse(txt);

      if (parsed.vendor)   setVendor(parsed.vendor);
      if (parsed.date)     setDate(parsed.date);
      if (parsed.category) setCat(parsed.category);
      if (parsed.province) setProv(parsed.province);
      if (parsed.note && !note) setNote(parsed.note);

      // Payment method
      if (parsed.payment_type) setPayType(parsed.payment_type);
      if (parsed.card_last4)   setPayLast4(parsed.card_last4);
      if (parsed.card_name)    setPayName(parsed.card_name);

      const gstV = parsed.gst || parsed.hst || 0;
      const pstV = parsed.pst || parsed.qst || 0;
      const sub  = parsed.subtotal || 0;

      if (parsed.category === 'gas' && parsed.total) {
        setGasTotal(String(parsed.total));
      } else {
        setAmount(String(sub));
        setGst(gstV ? String(gstV) : '');
      }
      if (pstV) { setPst(String(pstV)); setHasPst(true); }
      setTip(parsed.tip    ? String(parsed.tip)       : '');
      setLiquor(parsed.liquor_tax ? String(parsed.liquor_tax) : '');
      setScanning(false);

    } catch(err) {
      console.error('Scan error:', err);
      setScanning(false);
      setScanErr(`Could not auto-read receipt (${err.message||'unknown error'}) — fill in manually below.`);
    }
  }

  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const isPdf = file.type === 'application/pdf';

    if (isPdf) {
      const reader = new FileReader();
      reader.onload = ev => {
        setReceipt('__PDF__:' + ev.target.result);
        setScanErr('');
      };
      reader.readAsDataURL(file);
      return;
    }

    // Compress image before storing — keeps localStorage from filling up
    // Resize to max 1200px wide, 0.75 quality JPEG = ~80% smaller than original
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objectUrl);
      const MAX = 1200;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const compressed = canvas.toDataURL('image/jpeg', 0.75);
      setReceipt(compressed);
      setScanErr('');
    };
    img.onerror = () => {
      // Fallback: store original
      const reader = new FileReader();
      reader.onload = ev => { setReceipt(ev.target.result); setScanErr(''); };
      reader.readAsDataURL(file);
    };
    img.src = objectUrl;
  }

  function submit() {
    if(!vendor.trim()){alert('Please enter a vendor name.');return;}
    if(isGas && !(parseFloat(gasTotal)>0)){alert('Please enter the total amount paid at the pump.');return;}
    if(!isGas && !(parseFloat(amount)>0)){alert('Please enter a pre-tax amount.');return;}
    const savedTax={gst:parseFloat(gst)||0,pst:parseFloat(pst)||0,hasPst,tip:parseFloat(tip)||0,liquor:parseFloat(liquor)||0,other:0,gasMode:isGas,gasTotal:parseFloat(gasTotal)||0};
    const payment={type:payType,last4:payLast4.trim(),name:payName.trim()};
    const pct = Math.min(100, Math.max(0, parseFloat(bizPct)||100));
    onSave({date,vendor:vendor.trim(),category:cat,amount:parseFloat(amount),province,note:note.trim(),receipt,tax:savedTax,payment,bizPct:pct});
  }

  const inp={background:T.bg4,borderColor:T.border,color:T.text};

  return(
    <div className="ov" onClick={onClose}>
      <div className="modal" style={{background:T.bg2,borderColor:T.border,color:T.text}} onClick={e=>e.stopPropagation()}>
        <div className="mhdr">
          <div className="mttl">{editId?'Edit Expense':'Add Expense'}</div>
          <button className="mclose" style={{borderColor:T.border,color:T.text}} onClick={onClose}>✕</button>
        </div>

        {/* Receipt */}
        <div className="fg">
          <label className="fl">Receipt Photo — AI Auto-Scan</label>
          {scanning?(
            <div className="scan-box" style={{background:'rgba(75,142,245,.08)',borderColor:'rgba(75,142,245,.25)'}}>
              <div className="spin" style={{borderColor:'rgba(75,142,245,.2)',borderTopColor:T.blue}}/>
              <div style={{color:T.blue,fontSize:13,fontWeight:500}}>Scanning receipt with AI…</div>
              <div style={{fontSize:11,opacity:.5,marginTop:3}}>Reading vendor · amounts · GST · PST · tip · payment method…</div>
            </div>
          ):receipt?(
            <div className="rp">
              {receipt.startsWith('__PDF__:')
                ? <div style={{background:T.bg4,borderRadius:10,border:`1px solid ${T.border}`,padding:'20px 16px',textAlign:'center',cursor:'pointer'}} onClick={()=>onZoom(receipt.slice(8))}>
                    <div style={{fontSize:40,marginBottom:8}}>📄</div>
                    <div style={{fontSize:13,fontWeight:500}}>PDF Receipt</div>
                    <div style={{fontSize:11,opacity:.4,marginTop:3}}>Click to open full PDF</div>
                  </div>
                : <img src={receipt} alt="receipt" style={{borderColor:T.border}} onClick={()=>onZoom(receipt)}/>
              }
              <button className="rp-rm" onClick={()=>{setReceipt(null);setScanErr('');}}>Remove</button>
            </div>
          ):(
            <div className="dz" style={{borderColor:T.border}} onClick={()=>fileRef.current.click()}>
              <input ref={fileRef} type="file" accept="image/*,application/pdf" onChange={handleFile} onClick={e=>e.stopPropagation()}/>
              <div style={{fontSize:30,marginBottom:8}}>📷</div>
              <div style={{fontSize:13,opacity:.6}}>Click or drag receipt photo or PDF</div>
              <div style={{fontSize:11,opacity:.4,marginTop:3}}>Saved as backup for CRA · image is compressed automatically</div>
            </div>
          )}
          {scanErr&&(
            <div style={{marginTop:6,fontSize:12,borderRadius:8,padding:'10px 13px',border:`1px solid rgba(240,160,51,.3)`,background:'rgba(240,160,51,.08)',color:T.amber}}>
              ⚠ {scanErr}
            </div>
          )}
        </div>

        {/* Date + Province */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 60px',gap:4,marginBottom:12}}>
          <div><label className="fl">Date</label><input type="date" style={{background:T.bg4,borderColor:T.border,color:T.text,borderRadius:8,border:'1px solid',width:'100%',padding:'4px 6px',fontSize:13,fontFamily:'inherit',outline:'none',height:34,WebkitAppearance:'none',appearance:'none',lineHeight:'1.2'}} value={date} onChange={e=>setDate(e.target.value)}/></div>
          <div><label className="fl">Prov.</label>
            <select style={{background:T.bg4,borderColor:T.border,color:T.text,borderRadius:8,border:'1px solid',width:'100%',padding:'4px 2px',fontSize:12,fontFamily:'inherit',outline:'none',height:34}} value={province} onChange={e=>setProv(e.target.value)}>
              {PROVS.map(p=><option key={p.code} value={p.code}>{p.code}</option>)}
            </select>
          </div>
        </div>

        {/* Vendor */}
        <div className="fg"><label className="fl">Vendor / Business Name</label>
          <input type="text" style={inp} placeholder="e.g. Esso, The Keg, WestJet" value={vendor} onChange={e=>setVendor(e.target.value)}/>
        </div>

        {/* Category */}
        <div className="fg"><label className="fl">Category</label>
          <select style={inp} value={cat} onChange={e=>setCat(e.target.value)}>
            {cats.map(c=><option key={c.id} value={c.id}>{c.icon} {c.label} (L{c.line})</option>)}
          </select>
        </div>

        {/* CRA note */}
        <div className="cranote" style={{borderLeftColor:catObj.color,background:T.bg4}}>📋 {catObj.cra}</div>

        {/* GAS MODE: always enter total-inc-GST, auto-splits */}
        {isGas&&(
          <div className="gas-helper" style={{background:'rgba(46,204,138,.08)',borderColor:'rgba(46,204,138,.3)',color:T.green}}>
            <div style={{fontWeight:600,marginBottom:6,display:'flex',alignItems:'center',gap:6}}>⛽ Gas — Enter Your Receipt Total</div>
            <div style={{fontSize:11,opacity:.7,marginBottom:10,color:T.text}}>
              Type the <b>total amount you paid</b> (inc. GST) and the subtotal + GST will be calculated automatically based on your province ({province}, {((PROVS.find(x=>x.code===province)||PROVS[0]).hst ? ((PROVS.find(x=>x.code===province)||PROVS[0]).hstRate*100).toFixed(0) : (PROVS.find(x=>x.code===province)||PROVS[0]).gst*100).toFixed(0)}% tax).
            </div>
            <label className="fl" style={{color:T.text}}>Total Paid (inc. GST) — from your receipt</label>
            <input type="number" step="0.01" placeholder="e.g. 80.00" style={{background:T.bg4,borderColor:'rgba(46,204,138,.4)',color:T.text,borderRadius:8,padding:'9px 12px',fontSize:14,width:'100%',outline:'none'}}
              value={gasTotal} onChange={e=>handleGasTotal(e.target.value)}/>
            {parseFloat(gasTotal)>0&&(
              <div style={{marginTop:10,display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
                {[
                  {lbl:'Pre-Tax Subtotal',val:cad(parseFloat(amount)||0),color:T.text},
                  {lbl:`GST (${(gstRate*100).toFixed(0)}%)`,val:cad(parseFloat(gst)||0),color:T.green},
                  {lbl:'CRA Deductible',val:cad(parseFloat(amount)||0),color:T.blue},
                ].map(x=>(
                  <div key={x.lbl} style={{background:T.bg4,borderRadius:8,padding:'8px 10px',border:`1px solid ${T.border}`}}>
                    <div style={{fontSize:10,fontFamily:"'Poppins',sans-serif",opacity:.5,marginBottom:3}}>{x.lbl}</div>
                    <div style={{fontSize:14,fontWeight:700,color:x.color}}>{x.val}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* Amount — hidden for gas (handled by total field above) */}
        {!isGas&&(
        <div className="fg">
          <label className="fl">Pre-Tax Subtotal ($) <span style={{opacity:.4,fontWeight:400}}>before GST/PST/tip</span></label>
          <input type="number" step="0.01" placeholder="0.00" style={inp} value={amount} onChange={e=>setAmount(e.target.value)}/>
        </div>
        )}

        {/* Tax fields — GST auto-calculated for gas */}
        <div className="fg">
          <label className="fl">Tax &amp; Extras <span style={{opacity:.4,fontWeight:400}}>{isGas?'optional — PST / other charges only':'all optional — enter only what\'s on your receipt'}</span></label>
          <div className="frow3">
            {!isGas&&<div>
              <label className="fl" style={{fontSize:10}}>GST / HST</label>
              <input type="number" step="0.01" placeholder="0.00" style={inp} value={gst} onChange={e=>setGst(e.target.value)}/>
            </div>}
            {!isGas&&<div>
              <label className="fl" style={{fontSize:10}}>Tip</label>
              <input type="number" step="0.01" placeholder="0.00" style={inp} value={tip} onChange={e=>setTip(e.target.value)}/>
            </div>}
            <div>
              <label className="fl" style={{fontSize:10}}>Liquor / Other Tax</label>
              <input type="number" step="0.01" placeholder="0.00" style={inp} value={liquor} onChange={e=>setLiquor(e.target.value)}/>
            </div>
          </div>
          <label className="pst-row" style={{color:T.text}}>
            <input type="checkbox" checked={hasPst} onChange={e=>setHasPst(e.target.checked)}/>
            PST is shown on this receipt
          </label>
          {hasPst&&<input type="number" step="0.01" placeholder="PST amount" style={{...inp,marginTop:6}} value={pst} onChange={e=>setPst(e.target.value)}/>}
        </div>

        {/* Live breakdown */}
        {bd&&amt>0&&(
          <div className="bkbox" style={{background:T.bg3,borderColor:T.border}}>
            {bd.tip>0&&<>
              <div className="bkrow" style={{borderColor:T.border}}><span className="bklbl">Subtotal</span><span className="bkval">{cad(bd.sub)}</span></div>
              <div className="bkrow" style={{borderColor:T.border}}>
                <span className="bklbl">Tip {isGas?<span style={{color:T.amber,fontSize:11}}>(⚠ not deductible for gas)</span>:''}</span>
                <span className="bkval">{cad(bd.tip)}</span>
              </div>
            </>}
            {bd.liquor>0&&<div className="bkrow" style={{borderColor:T.border}}><span className="bklbl">Liquor / other tax</span><span className="bkval">{cad(bd.liquor)}</span></div>}
            <div className="bkrow" style={{borderColor:T.border}}><span className="bklbl">GST/HST paid</span><span className="bkval">{cad(bd.gstPaid)}</span></div>
            {bd.pstPaid>0&&<div className="bkrow" style={{borderColor:T.border}}><span className="bklbl" style={{color:T.amber}}>PST paid (non-recoverable)</span><span className="bkval" style={{color:T.amber}}>{cad(bd.pstPaid)}</span></div>}
            <div className="bkrow" style={{borderColor:T.border}}><span className="bklbl">Receipt Total</span><span className="bkval">{cad(bd.total)}</span></div>
            <div className="bkrow bkdiv" style={{borderColor:T.border}}><span className="bklbl">✅ GST ITC Claimable</span><span className="bkval" style={{color:T.green}}>{cad(bd.gstClaimable)}</span></div>
            <div className="bkrow" style={{borderColor:T.border}}><span className="bklbl">✅ CRA Deductible (subtotal only)</span><span className="bkval" style={{color:T.blue}}>{cad(bd.deductibleAmount)}</span></div>
            {catObj.df<1&&<div style={{marginTop:7,fontSize:11,color:T.amber}}>⚠ {catObj.label}: only {catObj.df*100}% deductible per CRA</div>}
          </div>
        )}

        {/* Business use % — for gas and vehicle */}
        {(isGas || cat==='vehicle' || cat==='travel') && (
          <div className="fg">
            <label className="fl">Business Use % <span style={{opacity:.4,fontWeight:400}}>CRA allows only the business portion</span></label>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <input type="range" min="0" max="100" step="5"
                style={{flex:1,accentColor:T.green,background:'transparent',border:'none',padding:'4px 0'}}
                value={bizPct} onChange={e=>setBizPct(e.target.value)}/>
              <div style={{background:T.bg4,border:`1px solid ${T.border}`,borderRadius:8,padding:'6px 12px',minWidth:64,textAlign:'center',fontWeight:600,color:T.green,fontSize:15}}>
                {bizPct}%
              </div>
            </div>
            {parseFloat(bizPct)<100&&bd&&amt>0&&(
              <div style={{fontSize:12,color:T.amber,marginTop:6,background:'rgba(240,160,51,.08)',borderRadius:7,padding:'6px 10px',border:`1px solid rgba(240,160,51,.2)`}}>
                ⚠ At {bizPct}% business use: Deductible = {cad(bd.deductibleAmount * (parseFloat(bizPct)/100))} · ITC = {cad(bd.gstClaimable * (parseFloat(bizPct)/100))}
              </div>
            )}
          </div>
        )}

        {/* Payment Method */}
        <div className="fg">
          <label className="fl">Payment Method</label>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
            {['Credit Card','Debit Card','Cash','Cheque','E-Transfer','Other'].map(pt=>(
              <button key={pt} type="button"
                style={{padding:'8px 10px',borderRadius:8,border:`1px solid ${payType===pt?T.blue:T.border}`,background:payType===pt?`rgba(75,142,245,.12)`:T.bg4,color:T.text,fontWeight:payType===pt?600:400,fontSize:13,transition:'all .15s'}}
                onClick={()=>setPayType(pt)}>
                {pt==='Credit Card'?'💳':pt==='Debit Card'?'🏧':pt==='Cash'?'💵':pt==='Cheque'?'📝':pt==='E-Transfer'?'📲':'•'} {pt}
              </button>
            ))}
          </div>
          {(payType==='Credit Card'||payType==='Debit Card')&&(
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              <div>
                <label className="fl" style={{fontSize:10}}>Card Name <span style={{opacity:.5,fontWeight:400}}>(e.g. Amex, Visa)</span></label>
                <input type="text" style={inp} placeholder="e.g. Amex, TD Visa" value={payName} onChange={e=>setPayName(e.target.value)}/>
              </div>
              <div>
                <label className="fl" style={{fontSize:10}}>Last 4 Digits</label>
                <input type="text" style={inp} placeholder="e.g. 3405" maxLength={4} value={payLast4} onChange={e=>setPayLast4(e.target.value.replace(/\D/g,''))}/>
              </div>
            </div>
          )}
        </div>

        {/* Note */}
        <div className="fg">
          <label className="fl">Business Purpose <span style={{opacity:.4,fontWeight:400}}>CRA requires this for audits</span></label>
          <textarea rows={2} style={inp} placeholder="Who, what, why — e.g. 'Client lunch with ABC Corp to discuss Q2 campaign'" value={note} onChange={e=>setNote(e.target.value)}/>
        </div>

        <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:6}}>
          <button style={{background:T.bg4,border:`1px solid ${T.border}`,color:T.text,padding:'9px 17px',borderRadius:9}} onClick={onClose}>Cancel</button>
          <button style={{background:T.accent,color:'#fff',padding:'9px 19px',borderRadius:9,fontWeight:600}} onClick={submit}>{editId?'Save Changes':'Add Expense'}</button>
        </div>
      </div>
    </div>
  );
}

// ─── DETAIL MODAL ─────────────────────────────────────────────────────────────
function DetailModal({expense,cats,province,T,getCat,calcBD,onClose,onZoom}) {
  const e=expense, c=getCat(e.category);
  const bd=calcBD(e.amount,e.province||province,e.category,e.tax,cats);
  const pct=(e.bizPct!=null?e.bizPct:100)/100;
  const adjITC=+(bd.gstClaimable*pct).toFixed(2);
  const adjDed=+(bd.deductibleAmount*pct).toFixed(2);
  const pay=e.payment;
  const payLabel = pay?.type
    ? [pay.name, pay.type, pay.last4?`···· ${pay.last4}`:''].filter(Boolean).join(' ')
    : null;
  const isPdf = e.receipt?.startsWith('__PDF__:');
  return(
    <div className="ov" onClick={onClose}>
      <div className="modal modal-sm" style={{background:T.bg2,borderColor:T.border,color:T.text}} onClick={ev=>ev.stopPropagation()}>
        <div className="mhdr">
          <div className="mttl">{e.vendor}</div>
          <button className="mclose" style={{borderColor:T.border,color:T.text}} onClick={onClose}>✕</button>
        </div>
        {e.receipt&&(
          <div className="rp">
            {isPdf
              ? <div style={{background:T.bg4,borderRadius:10,border:`1px solid ${T.border}`,padding:'18px',textAlign:'center',cursor:'pointer'}} onClick={()=>onZoom(e.receipt.slice(8))}>
                  <div style={{fontSize:36,marginBottom:6}}>📄</div>
                  <div style={{fontSize:13,fontWeight:500}}>PDF Receipt — click to open</div>
                </div>
              : <img src={e.receipt} alt="receipt" style={{borderColor:T.border}} onClick={()=>onZoom(e.receipt)}/>
            }
            {!isPdf&&<button className="rp-rm" style={{pointerEvents:'none',opacity:.6}}>🔍 click to expand</button>}
          </div>
        )}
        <div className="dgrid">
          <div className="di" style={{borderColor:T.border,background:T.bg4}}><div className="dilbl">Category</div><div className="dival">{c.icon} {c.label}</div></div>
          <div className="di" style={{borderColor:T.border,background:T.bg4}}><div className="dilbl">T2125 Line</div><div className="dival">{c.line}</div></div>
          <div className="di" style={{borderColor:T.border,background:T.bg4}}><div className="dilbl">Date</div><div className="dival">{e.date}</div></div>
          <div className="di" style={{borderColor:T.border,background:T.bg4}}><div className="dilbl">Province</div><div className="dival">{e.province}</div></div>
          {payLabel&&<div className="di" style={{borderColor:T.border,background:T.bg4,gridColumn:'span 2'}}><div className="dilbl">Payment</div><div className="dival">💳 {payLabel}</div></div>}
          {e.bizPct!=null&&e.bizPct!==100&&(
            <div className="di" style={{borderColor:T.border,background:'rgba(46,204,138,.08)',gridColumn:'span 2'}}>
              <div className="dilbl">Business Use</div>
              <div className="dival" style={{color:T.green}}>{e.bizPct}% business</div>
            </div>
          )}
        </div>
        <div className="bkbox" style={{background:T.bg3,borderColor:T.border}}>
          <div className="bkrow" style={{borderColor:T.border}}><span className="bklbl">Pre-Tax Subtotal</span><span className="bkval">{cad(bd.sub)}</span></div>
          {bd.tip>0&&<div className="bkrow" style={{borderColor:T.border}}><span className="bklbl">Tip</span><span className="bkval">{cad(bd.tip)}</span></div>}
          {bd.liquor>0&&<div className="bkrow" style={{borderColor:T.border}}><span className="bklbl">Liquor / other tax</span><span className="bkval">{cad(bd.liquor)}</span></div>}
          <div className="bkrow" style={{borderColor:T.border}}><span className="bklbl">GST/HST paid</span><span className="bkval">{cad(bd.gstPaid)}</span></div>
          {bd.pstPaid>0&&<div className="bkrow" style={{borderColor:T.border}}><span className="bklbl" style={{color:T.amber}}>PST paid</span><span className="bkval" style={{color:T.amber}}>{cad(bd.pstPaid)}</span></div>}
          <div className="bkrow" style={{borderColor:T.border}}><span className="bklbl">Receipt Total</span><span className="bkval">{cad(bd.total)}</span></div>
          <div className="bkrow bkdiv" style={{borderColor:T.border}}>
            <span className="bklbl">✅ GST ITC Claimable{pct<1?` (${e.bizPct}%)`:''}</span>
            <span className="bkval" style={{color:T.green}}>{cad(adjITC)}</span>
          </div>
          <div className="bkrow" style={{borderColor:T.border}}>
            <span className="bklbl">✅ CRA Deductible{pct<1?` (${e.bizPct}%)`:''}</span>
            <span className="bkval" style={{color:T.blue}}>{cad(adjDed)}</span>
          </div>
        </div>
        {e.note&&<div style={{background:T.bg4,borderRadius:8,padding:'9px 12px',fontSize:13,border:`1px solid ${T.border}`}}><span style={{fontSize:10,opacity:.4,display:'block',marginBottom:2}}>Business purpose</span>{e.note}</div>}
      </div>
    </div>
  );
}

// ─── THEME MODAL ──────────────────────────────────────────────────────────────
function ThemeModal({theme,onSave,onClose}) {
  const [t,setT]=useState({...theme});
  const inp={background:t.bg4,borderColor:t.border,color:t.text};
  const setF=k=>v=>setT(x=>({...x,[k]:v}));
  return(
    <div className="ov" onClick={onClose}>
      <div className="modal modal-lg" style={{background:t.bg2,borderColor:t.border,color:t.text}} onClick={e=>e.stopPropagation()}>
        <div className="mhdr"><div className="mttl">🎨 Theme Customisation</div><button className="mclose" style={{borderColor:t.border,color:t.text}} onClick={onClose}>✕</button></div>

        {/* Mode quick-switch */}
